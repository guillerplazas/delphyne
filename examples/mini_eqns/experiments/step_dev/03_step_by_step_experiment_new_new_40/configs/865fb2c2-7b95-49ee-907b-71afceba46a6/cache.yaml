            ## Step format

            ```yaml
            <step_id>:
              - ["<lhs>", "<rhs>"]
              - <justification>
            ```

            Justifications can be:
            - `{rule: <rule_name>, vars: {<var>: "<value>", ...}}`
            - `{step: <prev_step_id>}`
            - `{sym: <prev_step_id>}`
