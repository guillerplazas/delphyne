      chat:
        - role: user
          content: |
            fun: check
            args:
              eq:
                - cos(2*x)
                - 1 - 2*sin(x)**2
              proof:
                1:
                  - - cos(2*x)
                    - cos(x)**2 - sin(x)**2
                  - rule: cos_add
                    vars:
                      x: x
                      y: x
                2:
                  - - cos(0)
                    - cos(x)*cos(-x) - sin(x)*sin(-x)
                  - rule: cos_add
                    vars:
                      x: x
                      y: -x
                3:
                  - - cos(x)*cos(-x) - sin(x)*sin(-x)
                    - cos(x)**2 - sin(x)*sin(-x)
                  - rule: cos_neg
                    vars:
                      x: x
                4:
                  - - cos(x)**2 - sin(x)*sin(-x)
                    - cos(x)**2 + sin(x)**2
                  - rule: sin_neg
                    vars:
                      x: x
                5:
                  - - cos(0)
                    - cos(x)**2 + sin(x)**2
                  - trans:
                      - 2
                      - 3
                      - 4
                6:
                  - - cos(x)**2 + sin(x)**2
                    - cos(0)
                  - sym: 5
                7:
                  - - cos(0)
                    - '1'
                  - rule: cos_zero
                    vars: {}
                8:
                  - - cos(x)**2 + sin(x)**2
                    - '1'
                  - trans:
                      - 6
                      - 7
                9:
                  - - cos(x)**2 + sin(x)**2 - 2*sin(x)**2
                    - 1 - 2*sin(x)**2
                  - trans:
                      - 8
                      - 8
              rules:
                cos_zero:
                  - cos(0)
                  - '1'
                sin_zero:
                  - sin(0)
                  - '0'
                sin_halfpi:
                  - sin(pi/2)
                  - '1'
                cos_halfpi:
                  - cos(pi/2)
                  - '0'
                sin_neg:
                  - sin(-x)
                  - -sin(x)
                cos_neg:
                  - cos(-x)
                  - cos(x)
                cos_add:
                  - cos(x + y)
                  - cos(x)*cos(y) - sin(x)*sin(y)
                sin_add:
                  - sin(x + y)
                  - sin(x)*cos(y) + cos(x)*sin(y)
      options:
        model: __compute__
    iter: 1
  output:
    outputs:
      - content: |
          feedback: 'Unequal terms: ''cos(x)**2 + sin(x)**2 - 2*sin(x)**2'' and ''cos(x)**2 + sin(x)**2'''
          step: 9
