                  - Arithmetic simplification is allowed implicitly by the checker, but every
                    trigonometric fact must come from the listed rules or from previous steps.

                  ## Available rules

                  ```
                  - cos_zero: `cos(0) = 1`
                  - sin_zero: `sin(0) = 0`
                  - sin_halfpi: `sin(pi/2) = 1`
                  - cos_halfpi: `cos(pi/2) = 0`
                  - sin_neg: `sin(-x) = -sin(x)`
                  - cos_neg: `cos(-x) = cos(x)`
                  - cos_add: `cos(x + y) = cos(x)*cos(y) - sin(x)*sin(y)`
                  - sin_add: `sin(x + y) = sin(x)*cos(y) + cos(x)*sin(y)`
                  ```

                  ## Deriving sub-lemmas

                  For double-angle, triple-angle, or product identities, first derive
                  `cos(x)**2 + sin(x)**2 = 1` as explicit numbered steps, then reuse it with `step:<K>`.

                  The trick for reusing it: write a step whose LHS contains `cos(x)**2 + sin(x)**2`
                  explicitly (which is arithmetically equal to whatever you have), then apply `step:<K>`
                  to substitute `cos(x)**2 + sin(x)**2 → 1` in that LHS.

                  For evaluating `cos(pi)`, `sin(pi)`, `cos(2*pi)`, `sin(2*pi)`: expand via
                  `cos_add`/`sin_add` (e.g. `cos(pi) = cos(pi/2+pi/2)` via `cos_add`), then simplify
                  each factor using `cos_halfpi` and `sin_halfpi`.

