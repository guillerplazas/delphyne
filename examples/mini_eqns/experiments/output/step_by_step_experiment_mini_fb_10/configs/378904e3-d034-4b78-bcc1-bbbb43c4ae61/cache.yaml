          2. Apply cos_neg to simplify cos(-y) = cos(y), so the first term becomes cos(x)*cos(y)
          3. Apply sin_neg to simplify sin(-y) = -sin(y), so -sin(x)*sin(-y) becomes +sin(x)*sin(y)
          4. Apply cos_add with x=x, y=y to expand cos(x + y) as cos(x)*cos(y) - sin(x)*sin(y)
