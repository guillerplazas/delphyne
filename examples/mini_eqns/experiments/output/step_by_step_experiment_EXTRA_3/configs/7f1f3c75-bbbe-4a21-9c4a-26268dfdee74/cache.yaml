          2. Apply cos_add with x, y = -x to express cos(0) = cos(x + (-x)) = cos x*cos(-x) - sin x*sin(-x)
          3. Apply cos_neg to simplify cos(-x) = cos x; Apply sin_neg to simplify sin(-x) = -sin x
             This gives cos(0) = cos^2 x + sin^2 x
          4. Apply cos_zero to substitute cos(0) = 1
