    outputs:
      - content: |-
          ```
          1. Expand sin(3x) as sin(2x + x) using sin_add: sin(3x) = sin(2x)cos x + cos(2x) sin x
          2. Expand sin(2x) via sin_add with x and x: sin(2x) = 2*sin x * cos x
          3. Expand cos(2x) via cos_add with x and x: cos(2x) = cos^2 x - sin^2 x
          4. Substitute into step 1: sin(3x) = (2*sin x*cos x)*cos x + (cos^2 x - sin^2 x)*sin x
             = 3*sin x * cos^2 x - sin^3 x
          5. Use sin^2 x + cos^2 x = 1 to replace cos^2 x by 1 - sin^2 x
