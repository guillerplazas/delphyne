            content: |-
              Using angle addition and the given special-value rules:
              \[
              \sin\left(\frac{\pi}{2}\right)=\sin\left(\frac{\pi}{4}+\frac{\pi}{4}\right)
              =\sin\left(\frac{\pi}{4}\right)\cos\left(\frac{\pi}{4}\right)+\cos\left(\frac{\pi}{4}\right)\sin\left(\frac{\pi}{4}\right)
              =2\sin\left(\frac{\pi}{4}\right)\cos\left(\frac{\pi}{4}\right).
              \]
              Since \(\sin(\pi/2)=1\), we get \(2\sin(\pi/4)\cos(\pi/4)=1\).

              Also,
              \[
              \cos\left(\frac{\pi}{2}\right)=\cos\left(\frac{\pi}{4}+\frac{\pi}{4}\right)
              =\cos^2\left(\frac{\pi}{4}\right)-\sin^2\left(\frac{\pi}{4}\right)=0,
              \]
              so \(\cos^2(\pi/4)=\sin^2(\pi/4)\).

              From these two equalities, we can conclude \(\cos(\pi/4)=\sin(\pi/4)\) (since then \((\cos-\sin)(\cos+\sin)=0\) and \(\cos+\sin\neq 0\) as their product is \(1/2\)).

              Below is a formal proof that encodes exactly this algebraic reasoning.

              ```yaml
