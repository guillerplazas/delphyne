                  ## Task Description

                  The goal is to produce machine-checkable proofs of simple trigonometric equalities. For the proof to be verified, it must obey a very strict format and consist of a list of steps. Each step states an equality and is attached a justification for how the equality was obtained, which can be either:

                  - Applying a predefined rewriting rule (see list below): `{rule: <rule_name>, vars: {<var_1>: "<value_1>", ..., <var_n>: "value_n"}}`.
                  - Substituting a previously obtained equality: `{step: <prev_step_id>}`.
                  - Flipping the left-hand side and right-hand side of a previously obtained equality: `{sym: <prev_step_id>}` .
                  - Combining previously obtained equalities transitively: `{trans: [<prev_step_id_1>, ..., <prev_step_id_n>]}`.

                  The last step of the proof must feature the target equality that you were tasked to prove.

                  Whenever the proof checker evaluates the equality of two expressions to determine whether or not a rule application or a substitution is valid, it does so modulo standard arithmetic simplification rules on polynomials. Thus, the `cos_zero` rule can be used as a standalone justification for `cos(y - y) + 1 = 2` and there is no need to separately establish `y - y = 0` and `1 + 1 = 2`. However, **no** fact about trigonometry should be ever taken for granted.

                  You should organize your answer in the following way. Given a target equality, you should first prove it informally, making sure that every step of rewriting that you use is small enough to be justified by one of the provided rules. For example, you should not rewrite `cos(pi)` into `-1` without explicitly justifying this fact, since `cos(pi) = -1` is not part of the provided axioms.

                  Once you've done that, you should end your answer with a markdown code block (using triple backticks: ```yaml) containing a valid YAML object that describes a machine-checkable proof formalizing your former reasoning. All expressions must be written as strings using Python syntax (and thus parsable using `sympy.sympyfy`). In particular, exponentiation is written `**`.

                  **Please look at the provided examples carefully before composing your answer.**

                  If you get something wrong and your proof is invalid, you'll be provided some feedback that you can use to fix your answer.

                  ## List of allowed rewriting rules

                  ```
                  - cos_zero: `cos(0) = 1`
                  - sin_zero: `sin(0) = 0`
                  - sin_halfpi: `sin(pi/2) = 1`
                  - cos_halfpi: `cos(pi/2) = 0`
                  - sin_neg: `sin(-x) = -sin(x)`
                  - cos_neg: `cos(-x) = cos(x)`
                  - cos_add: `cos(x + y) = cos(x)*cos(y) - sin(x)*sin(y)`
                  - sin_add: `sin(x + y) = sin(x)*cos(y) + cos(x)*sin(y)`
                  ```

                  ## Common Proof Patterns

                  ### Subtraction via addition + negation

                  To handle `cos(a - b)` or `sin(a - b)`, rewrite the subtraction as addition with a negative argument, then simplify the negative:

                  1. Use `cos_add` with `vars: {x: "a", y: "-b"}` to get `cos(a + (-b)) = cos(a)*cos(-b) - sin(a)*sin(-b)`
                  2. Use `cos_neg` with `vars: {x: "b"}` to get `cos(-b) = cos(b)`
                  3. Use `sin_neg` with `vars: {x: "b"}` to get `sin(-b) = -sin(b)`
                  4. Chain everything with `trans`

                  ### Double angle

                  To prove identities involving `sin(2*x)` or `cos(2*x)`, use the addition formulas with both arguments equal:

                  - `sin(2*x)`: use `sin_add` with `vars: {x: "x", y: "x"}` to get `sin(x + x) = sin(x)*cos(x) + cos(x)*sin(x)`
                  - `cos(2*x)`: use `cos_add` with `vars: {x: "x", y: "x"}` to get `cos(x + x) = cos(x)*cos(x) - sin(x)*sin(x)`

                  Since `sin(2*x) = sin(x + x)` and `2*sin(x)*cos(x) = sin(x)*cos(x) + cos(x)*sin(x)` hold modulo polynomial arithmetic, the checker accepts these directly.

                  ### Chaining with transitivity

                  When a proof requires multiple rewriting steps, prove each intermediate equality separately, then combine:

                  1. Step 1: `A = B` (by some rule)
                  2. Step 2: `B = C` (by another rule)
                  3. Step 3: `A = C` with `{trans: [1, 2]}`

                  ### Working from both sides

                  When direct rewriting from LHS to RHS is hard, prove both sides equal to a common intermediate form:

                  1. Step 1: `LHS = M` (rewrite the left-hand side)
                  2. Step 2: `RHS = M` (rewrite the right-hand side)
                  3. Step 3: `M = RHS` with `{sym: 2}` (flip step 2)
                  4. Step 4: `LHS = RHS` with `{trans: [1, 3]}` (combine)

                  ### Evaluating at specific values

                  To evaluate expressions like `cos(pi)` or `sin(pi)`, decompose using addition formulas:

                  - `cos(pi)`: use `cos_add` with `vars: {x: "pi/2", y: "pi/2"}`, then apply `cos_halfpi` and `sin_halfpi`
                  - `sin(pi)`: use `sin_add` with `vars: {x: "pi/2", y: "pi/2"}`, then apply `cos_halfpi` and `sin_halfpi`
