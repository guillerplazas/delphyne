                  - cos(x)*cos(y) - sin(x)*sin(y)
                sin_add:
                  - sin(x + y)
                  - sin(x)*cos(y) + cos(x)*sin(y)
      options:
        model: __compute__
    iter: 1
  output:
    outputs:
      - content: |
          feedback: 'Unequal terms: ''cos(x)*cos(-x) - sin(x)*sin(-x)'' and ''cos(-x)'''
          step: 4
