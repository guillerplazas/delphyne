      chat:
        - role: user
          content: |
            fun: check
            args:
              eq:
                - cos(2*x)
                - 2*cos(x)**2 - 1
              proof:
                1:
                  - - cos(0)
                    - '1'
                  - rule: cos_zero
                    vars: {}
                2:
                  - - cos(x - x)
                    - '1'
                  - step: 1
                3:
                  - - cos(x + (-x))
                    - cos(x)*cos(-x) - sin(x)*sin(-x)
                  - rule: cos_add
                    vars:
                      x: x
                      y: -x
                4:
                  - - cos(x - x)
                    - cos(x)*cos(-x) - sin(x)*sin(-x)
                  - step: 3
                5:
                  - - cos(x - x)
                    - cos(x)**2 + sin(x)**2
                  - rule: cos_neg
                    vars:
                      x: x
                6:
                  - - cos(x - x)
                    - cos(x)**2 + sin(x)**2
                  - trans:
                      - 4
                      - 5
                7:
                  - - cos(x)**2 + sin(x)**2
                    - '1'
                  - trans:
                      - 6
                      - 2
                8:
                  - - sin(x)**2
                    - 1 - cos(x)**2
                  - trans:
                      - 7
                9:
                  - - cos(2*x)
                    - cos(x)*cos(x) - sin(x)*sin(x)
                  - rule: cos_add
                    vars:
                      x: x
                      y: x
                10:
                  - - cos(2*x)
                    - cos(x)**2 - sin(x)**2
                  - step: 9
                11:
                  - - cos(x)**2 - sin(x)**2
                    - 2*cos(x)**2 - 1
                  - step: 8
                12:
                  - - cos(2*x)
                    - 2*cos(x)**2 - 1
                  - trans:
                      - 10
                      - 11
              rules:
                cos_zero:
                  - cos(0)
                  - '1'
                sin_zero:
                  - sin(0)
                  - '0'
                sin_halfpi:
                  - sin(pi/2)
                  - '1'
                cos_halfpi:
                  - cos(pi/2)
                  - '0'
                sin_neg:
                  - sin(-x)
                  - -sin(x)
                cos_neg:
                  - cos(-x)
                  - cos(x)
                cos_add:
                  - cos(x + y)
                  - cos(x)*cos(y) - sin(x)*sin(y)
                sin_add:
                  - sin(x + y)
                  - sin(x)*cos(y) + cos(x)*sin(y)
      options:
        model: __compute__
    iter: 1
  output:
    outputs:
      - content: |
          feedback: 'Rule application failed. Obtained: ''cos(0)'' instead of the expected right-hand side.'
          step: 5
