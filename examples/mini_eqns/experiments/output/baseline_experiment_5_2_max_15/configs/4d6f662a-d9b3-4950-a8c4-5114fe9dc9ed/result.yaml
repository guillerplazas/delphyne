                        content: |-
                          Informal derivation (using only allowed rules):

                          1. Use angle addition twice:
                          - \(\sin(2\pi + x) = \sin(2\pi)\cos(x) + \cos(2\pi)\sin(x)\).
                          - \(\sin(2\pi) = \sin(\pi+\pi) = \sin(\pi)\cos(\pi)+\cos(\pi)\sin(\pi)=0\).
                          - \(\cos(2\pi) = \cos(\pi+\pi)=\cos(\pi)^2-\sin(\pi)^2\).

                          But we are missing rules for \(\sin(\pi)\) and \(\cos(\pi)\), and also for \(\pi\) itself (we only have values at \(0\) and \(\pi/2\)). So we instead rewrite \(2\pi\) as \(\pi/2+\pi/2+\pi/2+\pi/2\), and compute \(\sin(2\pi)=0\) and \(\cos(2\pi)=1\) purely from \(\sin(\pi/2)=1\), \(\cos(\pi/2)=0\), and angle addition.

                          Compute:
                          - \(\sin(\pi)=\sin(\pi/2+\pi/2)=1\cdot 0 + 0\cdot 1 = 0\).
                          - \(\cos(\pi)=\cos(\pi/2+\pi/2)=0\cdot 0 - 1\cdot 1 = -1\).
                          - \(\sin(3\pi/2)=\sin(\pi+\pi/2)=0\cdot 0 + (-1)\cdot 1 = -1\).
                          - \(\cos(3\pi/2)=\cos(\pi+\pi/2)=(-1)\cdot 0 - 0\cdot 1 = 0\).
                          - \(\sin(2\pi)=\sin(3\pi/2+\pi/2)=(-1)\cdot 0 + 0\cdot 1 = 0\).
                          - \(\cos(2\pi)=\cos(3\pi/2+\pi/2)=0\cdot 0 - (-1)\cdot 1 = 1\).

                          Finally,
                          \(\sin(2\pi+x)=\sin(2\pi)\cos(x)+\cos(2\pi)\sin(x)=0\cdot \cos(x)+1\cdot \sin(x)=\sin(x)\).

                          Formal proof:

                          ```yaml
                          1:
                            - ["sin(pi/2)", "1"]
                            - {rule: sin_halfpi, vars: {}}
                          2:
                            - ["cos(pi/2)", "0"]
                            - {rule: cos_halfpi, vars: {}}

                          # sin(pi) = sin(pi/2 + pi/2) = 0
                          3:
                            - ["sin(pi/2 + pi/2)", "sin(pi/2)*cos(pi/2) + cos(pi/2)*sin(pi/2)"]
                            - {rule: sin_add, vars: {x: "pi/2", y: "pi/2"}}
                          4:
                            - ["sin(pi/2)*cos(pi/2) + cos(pi/2)*sin(pi/2)", "0"]
                            - {trans: [2, 1]}
