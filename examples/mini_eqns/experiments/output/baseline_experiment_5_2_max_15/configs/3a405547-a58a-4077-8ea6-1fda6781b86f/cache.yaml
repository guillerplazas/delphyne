                - ["cos(pi/3)", "cos(pi/2)*cos(-pi/6) - sin(pi/2)*sin(-pi/6)"]
                - {rule: cos_add, vars: {x: "pi/2", y: "-pi/6"}}
              2:
                - ["cos(pi/2)*cos(-pi/6) - sin(pi/2)*sin(-pi/6)", "-sin(pi/2)*sin(-pi/6)"]
                - {rule: cos_halfpi, vars: {}}
              3:
                - ["-sin(pi/2)*sin(-pi/6)", "-sin(-pi/6)"]
                - {rule: sin_halfpi, vars: {}}
              4:
                - ["-sin(-pi/6)", "sin(pi/6)"]
                - {rule: sin_neg, vars: {x: "pi/6"}}
              5:
                - ["cos(pi/3)", "sin(pi/6)"]
                - {trans: [1, 2, 3, 4]}
              ```
        - role: user
          content: 'Prove the following equality: `2*sin(x/2)*cos(x/2) = sin(x)`.'
        - role: assistant
          answer:
            mode: null
            content: |-
              It is easier to start with the right-hand side here:

              ```
              sin(x)
              = sin(x/2+x/2)
              = sin(x/2)*cos(x/2) + cos(x/2)*sin(x/2)
              = 2*sin(x/2)*cos(x/2)
              ```

              The first and last steps are just elementary simplifications so the only real rule to apply here is `sin_add`.

              ```yaml
              1:
                - ["sin(x)", "2*sin(x/2)*cos(x/2)"]
                - {rule: sin_add, vars: {x: "x/2", y: "x/2"}}
              2:
                - ["2*sin(x/2)*cos(x/2)", "sin(x)"]
                - {sym: 1}
              ```
        - role: user
          content: 'Prove the following equality: `cos(x)**2 + sin(x)**2 = 1`.'
      options:
        model: gpt-5.2
        temperature: 1.0
    iter: 1
  output:
    outputs:
      - content: |-
          This identity (the Pythagorean trig identity) is not derivable from the provided rule set alone.

          Allowed rules only give:
          - specific values at `0` and `pi/2`,
          - parity (`sin(-x)`, `cos(-x)`),
          - and angle addition formulas (`sin_add`, `cos_add`).

          From these, one can derive many compound-angle identities, but there is no axiom relating `sin` and `cos` by a quadratic constraint like `cos(x)**2 + sin(x)**2 = 1`. In particular, none of the rules allows rewriting `sin(x)` in terms of `cos(x)` (or vice versa), nor introduces the constant `1` from an expression involving `sin(x)` and `cos(x)` at a general angle.

