              To prove this equality using the provided rules, we need to manipulate and transform expressions step by step. Let's use the angle addition formulas for trigonometric functions to derive this equality.

              ### Informal Reasoning

              ```
              sin(2x)
              = 2*sin(x)*cos(x)
              ```

              By squaring both sides, we have:

              ```
              sin(2x)**2
              = (2*sin(x)*cos(x))**2
              ```

              Using the angle addition formula for cosine:

              ```
              cos(2x)
              = cos(x + x)
              = cos(x)*cos(x) - sin(x)*sin(x)
              = cos(x)**2 - sin(x)**2
              ```

              Now, consider the identity for the sine and cosine of double angles:

              ```
              cos(2x) + sin(2x)**2 = 1
              ```

              Since `sin(2x) = 2*sin(x)*cos(x)`, then:

              ```
              (2*sin(x)*cos(x))**2 = (2*sin(x)*cos(x))**2
              ```

              Finally, re-arranging the equation above:

              ```
              cos(x)**2 + sin(x)**2 = 1
              ```

              ### Formal Proof

