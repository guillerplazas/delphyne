             \]

          5. Therefore:
             \[
             \sin(pi/4)\cos(pi/4) = 1/2
             \]

          6. Using the property that \((\sin(\theta))^2 + (\cos(\theta))^2 = 1\) and symmetry for \(\pi/4\):
