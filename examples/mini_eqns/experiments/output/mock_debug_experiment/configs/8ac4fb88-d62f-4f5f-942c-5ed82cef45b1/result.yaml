              Angles like `pi/4` are special because they bisect right angles, and their trigonometric values can be derived from symmetry and identities. In particular, for a 45-degree angle (which is equivalent to `pi/4` radians), we have:
              - `cos(pi/4) = sqrt(2)/2`
              - `sin(pi/4) = sqrt(2)/2`

