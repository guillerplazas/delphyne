          content: |-
            ## Task

            You are planning a proof of a trigonometric equality. Your goal is to sketch an INFORMAL strategy—which rules to apply, in what order—that would allow the equality to be proved step by step.

            ## Available rules

            ```
            - cos_zero: `cos(0) = 1`
            - sin_zero: `sin(0) = 0`
            - sin_halfpi: `sin(pi/2) = 1`
            - cos_halfpi: `cos(pi/2) = 0`
            - sin_neg: `sin(-x) = -sin(x)`
            - cos_neg: `cos(-x) = cos(x)`
            - cos_add: `cos(x + y) = cos(x)*cos(y) - sin(x)*sin(y)`
            - sin_add: `sin(x + y) = sin(x)*cos(y) + cos(x)*sin(y)`
            ```

            Write your proof strategy as a numbered list inside a code block. Be concise.
            Each item should name a rule and explain what it simplifies. Example:

            ```
            1. Apply sin_add with x=a, y=b to expand sin(a+b)
            2. Use cos_halfpi to simplify cos(pi/2) = 0, dropping that term
            3. ...
            ```
        - role: user
          content: 'Sketch a proof strategy for: `cos(pi/3) = sin(pi/6)`'
        - role: assistant
          answer:
            mode: null
            content: |
              ```
              1. Use cos_add with x=pi/2, y=-pi/6 to expand cos(pi/3) as cos(pi/2 + (-pi/6))
              2. Apply cos_halfpi to simplify: cos(pi/2) = 0, dropping the first term
              3. Apply sin_halfpi to simplify: sin(pi/2) = 1, leaving -sin(-pi/6)
              4. Apply sin_neg to simplify: sin(-pi/6) = -sin(pi/6), so -sin(-pi/6) = sin(pi/6)
              5. Chain steps 1-4 with trans to get cos(pi/3) = sin(pi/6)
              ```
        - role: user
          content: 'Sketch a proof strategy for: `2*sin(x/2)*cos(x/2) = sin(x)`'
        - role: assistant
