                - ["cos(pi/3)", "cos(pi/2)*cos(-pi/6) - sin(pi/2)*sin(-pi/6)"]
                - {rule: cos_add, vars: {x: "pi/2", y: "-pi/6"}}
              2:
                - ["cos(pi/2)*cos(-pi/6) - sin(pi/2)*sin(-pi/6)", "-sin(pi/2)*sin(-pi/6)"]
                - {rule: cos_halfpi, vars: {}}
              3:
                - ["-sin(pi/2)*sin(-pi/6)", "-sin(-pi/6)"]
                - {rule: sin_halfpi, vars: {}}
              4:
                - ["-sin(-pi/6)", "sin(pi/6)"]
                - {rule: sin_neg, vars: {x: "pi/6"}}
              5:
                - ["cos(pi/3)", "sin(pi/6)"]
                - {trans: [1, 2, 3, 4]}
              ```
        - role: user
          content: 'Prove the following equality: `2*sin(x/2)*cos(x/2) = sin(x)`.'
        - role: assistant
          answer:
            mode: null
            content: |-
              It is easier to start with the right-hand side here:

              ```
              sin(x)
              = sin(x/2+x/2)
              = sin(x/2)*cos(x/2) + cos(x/2)*sin(x/2)
              = 2*sin(x/2)*cos(x/2)
              ```

              The first and last steps are just elementary simplifications so the only real rule to apply here is `sin_add`.

              ```yaml
              1:
                - ["sin(x)", "2*sin(x/2)*cos(x/2)"]
                - {rule: sin_add, vars: {x: "x/2", y: "x/2"}}
              2:
                - ["2*sin(x/2)*cos(x/2)", "sin(x)"]
                - {sym: 1}
              ```
        - role: user
          content: 'Prove the following equality: `sin(2*pi + x) = sin(x)`.'
      options:
        model: gpt-5.2
        temperature: 1.0
    iter: 1
  output:
    outputs:
      - content: |-
          This equality is **not derivable** from the provided rule set.

          Reason: the only available trigonometric rewriting rules are
          - values at `0` and `pi/2`,
          - parity (`sin(-x)`, `cos(-x)`),
          - angle addition formulas (`sin_add`, `cos_add`).

          To prove periodicity like `sin(x + 2*pi) = sin(x)`, one needs facts about `sin(2*pi)` and `cos(2*pi)` (e.g., `sin(2*pi)=0`, `cos(2*pi)=1`) or some way to relate `2*pi` to `0`/`pi/2` using allowed rules. None are available: there is no rule for `sin(pi)`, `cos(pi)`, `sin(2*pi)`, `cos(2*pi)`, or for period/shift identities.

