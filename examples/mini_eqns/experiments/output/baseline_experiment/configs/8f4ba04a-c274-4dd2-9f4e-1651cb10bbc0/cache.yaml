                - ["2*sin(x/2)*cos(x/2)", "sin(x)"]
                - {sym: 1}
              ```
        - role: user
          content: 'Prove the following equality: `cos(x + y)*cos(x - y) = cos(x)**2 - sin(y)**2`.'
