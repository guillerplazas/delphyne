          2. Apply sin_add with x=y=x to expand sin(2x) = sin(x)*cos(x) + cos(x)*sin(x) = 2*sin(x)*cos(x)
          3. Apply cos_add with x=y=x to expand cos(2x) = cos(x)*cos(x) - sin(x)*sin(x) = cos^2(x) - sin^2(x)
          4. Substitute into step 1: sin(3x) = (2*sin(x)*cos(x))*cos(x) + (cos^2(x) - sin^2(x))*sin(x)
