                          - \(2\sin(a)\cos(a)=1\),
                          - \(\cos(a)^2-\sin(a)^2=0\), so \(\cos(a)^2=\sin(a)^2\), and together with \(2\sin(a)\cos(a)=1\) this forces \(\sin(a)=\cos(a)\).
