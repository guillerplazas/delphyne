              ```yaml
              1:
                - ["sin(x)", "2*sin(x/2)*cos(x/2)"]
                - {rule: sin_add, vars: {x: "x/2", y: "x/2"}}
              2:
                - ["2*sin(x/2)*cos(x/2)", "sin(x)"]
                - {sym: 1}
              ```
        - role: user
