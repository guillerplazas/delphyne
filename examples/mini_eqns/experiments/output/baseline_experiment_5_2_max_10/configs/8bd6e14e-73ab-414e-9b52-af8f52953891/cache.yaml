                - {rule: sin_halfpi, vars: {}}
              4:
                - ["-sin(-pi/6)", "sin(pi/6)"]
                - {rule: sin_neg, vars: {x: "pi/6"}}
              5:
                - ["cos(pi/2-pi/6)", "sin(pi/6)"]
                - {trans: [1, 2, 3, 4]}

