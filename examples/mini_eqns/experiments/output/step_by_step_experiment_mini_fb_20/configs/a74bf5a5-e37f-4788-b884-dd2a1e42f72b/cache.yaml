          ```
          1. Apply sin_add with x=2x, y=x to express sin(3x) = sin(2x)cos(x) + cos(2x)sin(x)
          2. Apply sin_add with x=y=x to express sin(2x) = 2*sin(x)*cos(x)
          3. Apply cos_add with x=y=x to express cos(2x) = cos^2(x) - sin^2(x)
          4. Substitute into sin(3x): sin(3x) = 2*sin(x)*cos(x)*cos(x) + (cos^2(x) - sin^2(x))*sin(x)
             which simplifies to sin(3x) = 3*sin(x)*cos^2(x) - sin^3(x)
          5. Use cos^2(x) = 1 - sin^2(x) (Pythagorean identity) to get sin(3x) = 3*sin(x) - 4*sin^3(x)
          6. Rearrange: 4*sin^3(x) = 3*sin(x) - sin(3x) → sin^3(x) = (3*sin(x) - sin(3x))/4
          7. Conclude.
          ```
