                  - cos(x)*cos(y) - sin(x)*sin(y)
                sin_add:
                  - sin(x + y)
                  - sin(x)*cos(y) + cos(x)*sin(y)
      options:
        model: __compute__
    iter: 2
  output:
    outputs:
      - content: |
          feedback: 'Unequal terms: ''cos(x+y) * cos(x-y)'' and ''cos(x+y)'''
          step: 6
