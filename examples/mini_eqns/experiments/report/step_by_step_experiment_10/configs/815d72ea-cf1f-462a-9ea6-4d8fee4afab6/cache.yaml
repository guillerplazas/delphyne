- input:
    request:
      chat:
        - role: system
          content: |-
            ## Task

            You are proving a trigonometric equality for a strict checker.
            Write a COMPLETE machine-checkable proof as a YAML code block.

            Your proof is a draft: every step will be verified individually, and
            steps that fail verification will be repaired later. Still, aim for a
            proof that is fully correct on the first attempt.

            ## Proof format

            A proof is a YAML mapping from step numbers (1, 2, ...) to steps.
            Each step is a pair of an equality and a justification:

            ```yaml
            1:
              - ["<lhs>", "<rhs>"]
              - <justification>
            2:
              - ["<lhs>", "<rhs>"]
              - <justification>
            ```

            Justifications can be:
            - `{rule: <rule_name>, vars: {<var>: "<value>", ...}}`
            - `{step: <prev_step_id>}`
            - `{sym: <prev_step_id>}`
            - `{trans: [<step_id_1>, ..., <step_id_n>]}`

            The last step must state the target equality.

            ## Hard constraints

            - Use only the rule names listed below. Do not invent rule names.
            - Do not put nested objects inside `trans`; it must be a flat list of
              at least TWO previous step ids.
            - Do not reference future or missing steps.
            - Prefer small local rewrites over large jumps.
            - Exponentiation is `**`.
            - Variable substitution in `vars` is sequential (NOT simultaneous). Never use a rule
              variable name (x or y) as a replacement value when that name is also being replaced.
              If you write `vars:{x:"y", y:"-x"}`, the checker first replaces `x→y`, then `y→-x`,
              turning `sin(x+y)` into `sin(-2*x)` — NOT `sin(-x+y)`. Put the negative sign on the
              variable being replaced instead:
              - For `sin(y - x)`: use `vars:{x:"-x", y:"y"}` (gives `sin(-x+y)` ✓)
              - For `cos(x - y)`: use `vars:{x:"x", y:"-y"}` (gives `cos(x-y)` ✓)
              - For `cos(0)` via `cos(y-y)`: use `vars:{x:"-y", y:"y"}` (gives `cos(0)` ✓)

            ## Rule application replaces ALL occurrences

            When you apply a rule like `sin_halfpi` (`sin(pi/2) = 1`), the checker substitutes ALL
            occurrences of `sin(pi/2)` in the LHS simultaneously. For example:
            - LHS: `sin(pi/2)*cos(pi/2) + cos(pi/2)*sin(pi/2)`
            - After `sin_halfpi`: `cos(pi/2) + cos(pi/2)` = `2*cos(pi/2)` (NOT `cos(pi/2) + cos(pi/2)*sin(pi/2)`)

            Always compute the RHS of each step by replacing ALL matching subexpressions.

            ## Arithmetic note

            The checker accepts ordinary arithmetic simplification of expressions.
            For example, after a valid trig rewrite, terms like `sin(x)*cos(x) + cos(x)*sin(x)`
            may match `2*sin(x)*cos(x)` without an extra algebra rule.
            However, no extra trigonometric identities are allowed unless listed below.

            ## Available rules

            ```
            - cos_zero: `cos(0) = 1`
            - sin_zero: `sin(0) = 0`
            - sin_halfpi: `sin(pi/2) = 1`
            - cos_halfpi: `cos(pi/2) = 0`
            - sin_neg: `sin(-x) = -sin(x)`
            - cos_neg: `cos(-x) = cos(x)`
            - cos_add: `cos(x + y) = cos(x)*cos(y) - sin(x)*sin(y)`
            - sin_add: `sin(x + y) = sin(x)*cos(y) + cos(x)*sin(y)`
            ```

            ## Keep proofs SHORT

            Budget is limited. Prefer shorter proofs. When the same sub-lemma pattern
            (e.g., deriving cos(0) = cos(v)**2 + sin(v)**2) is needed for multiple variables,
            derive it once with a generic variable then reference that result. Do NOT duplicate
            the 4-step Pythagorean derivation for each variable separately.

            ## How `{step: K}` works

            `{step: K}` rewrites a sub-expression inside the current step's LHS using the equality
            from step K. If step K proved `A = B`, then `{step: K}` substitutes `A → B` inside the
            current LHS.

            **Critical constraint**: `{step: K}` only works when K's LHS is a **single atom** (e.g.
            `sin(x)**2`, `cos(0)`). Sum patterns like `cos(x)**2 + sin(x)**2` do NOT work — SymPy
            simplifies them away before the substitution can match.

            **NEVER use `{step: K}` when K's LHS is `1`** — the atom `1` appears everywhere and will
            be replaced in ALL occurrences, corrupting the expression. Keep `cos(0)` as the
            intermediate atom and only apply `cos_zero` at the very end.

            **NEVER use `{step: K}` when K's RHS is a sum like `A + B` inside a larger target** if
            SymPy may auto-simplify the sum away before substitution. Rearrange the proof so that
            the substituted atom is a single term (like `sin(x)**2` or `cos(0)`).

            ## Common proof patterns

            - For `sin(a - b)` or `cos(a - b)`, rewrite subtraction as addition with a negative argument.
            - To evaluate `cos(pi)`, `sin(pi)`, `cos(2*pi)`, `sin(2*pi)`: expand via `cos_add`/`sin_add`
              with arguments summing to the target angle (e.g. `cos(pi) = cos(pi/2+pi/2)` via `cos_add`),
              then simplify each factor using `cos_halfpi` and `sin_halfpi`. Derive these constant
              values as sub-lemmas, then substitute them with `{step: K}` (see Example 3).
            - For `sin(2*x)` or `cos(2*x)`, use `sin_add` or `cos_add` with both arguments equal to `x`.
            - For `sin(2*x) = 2*sin(x)*cos(x)`: this is nearly a ONE-step proof. `sin_add` with
              `vars:{x:"x", y:"x"}` gives `sin(x)*cos(x) + cos(x)*sin(x)`, and the checker's
              arithmetic simplification recognizes this equals `2*sin(x)*cos(x)`. Do NOT try to
              combine identical terms with `{step}` or `{trans}` — the checker handles it.
            - For double-angle identities involving `cos(x)**2` or `sin(x)**2` (Pythagorean
              rearrangements), use the indirect sub-lemma technique (see Example 2):
              1. Derive `cos(0) = cos(x)**2 + sin(x)**2` (4 steps via cos_add+cos_neg+sin_neg+trans).
              2. Apply `{step: K}` to the expression `cos(0) - cos(x)**2`: this substitutes the atom
                 `cos(0)` with `cos(x)**2 + sin(x)**2`, giving `sin(x)**2`. This step proves
                 `cos(0) - cos(x)**2 = sin(x)**2`.
              3. Use `sym` to get `sin(x)**2 = cos(0) - cos(x)**2`.
              4. Apply `{step}` on the result of `cos_add` to substitute the `sin(x)**2` atom,
                 yielding an expression with `cos(0)` instead of `1`.
              5. Apply `cos_zero` to convert `cos(0) → 1` in the final step.
            - When direct rewriting is hard, prove both sides equal to a common intermediate form
              and then use `sym` and `trans`.
            - Use `trans` only when the chain is properly justified: each step's RHS must equal the
              next step's LHS, the first LHS must match the target LHS, and the last RHS must match
              the target RHS.

            ## Worked examples

            Example 1 (cos(pi/2 + x) = -sin(x)):

            ```yaml
            1:
              - ["cos(pi/2 + x)", "cos(pi/2)*cos(x) - sin(pi/2)*sin(x)"]
              - {rule: cos_add, vars: {x: "pi/2", y: "x"}}
            2:
              - ["cos(pi/2)*cos(x) - sin(pi/2)*sin(x)", "-sin(pi/2)*sin(x)"]
              - {rule: cos_halfpi, vars: {}}
            3:
              - ["-sin(pi/2)*sin(x)", "-sin(x)"]
              - {rule: sin_halfpi, vars: {}}
            4:
              - ["cos(pi/2 + x)", "-sin(x)"]
              - {trans: [1, 2, 3]}
            ```

            Example 2 (cos(x)**2 - sin(x)**2 = 2*cos(x)**2 - 1), showing the indirect sub-lemma
            technique:

            ```yaml
            1:
              - ["cos(0)", "cos(x)*cos(-x) - sin(x)*sin(-x)"]
              - {rule: cos_add, vars: {x: "x", y: "-x"}}
            2:
              - ["cos(x)*cos(-x) - sin(x)*sin(-x)", "cos(x)**2 - sin(x)*sin(-x)"]
              - {rule: cos_neg, vars: {x: "x"}}
            3:
              - ["cos(x)**2 - sin(x)*sin(-x)", "cos(x)**2 + sin(x)**2"]
              - {rule: sin_neg, vars: {x: "x"}}
            4:
              - ["cos(0)", "cos(x)**2 + sin(x)**2"]
              - {trans: [1, 2, 3]}
            5:
              - ["cos(0) - cos(x)**2", "sin(x)**2"]
              - {step: 4}
            6:
              - ["sin(x)**2", "cos(0) - cos(x)**2"]
              - {sym: 5}
            7:
              - ["cos(x)**2 - sin(x)**2", "2*cos(x)**2 - cos(0)"]
              - {step: 6}
            8:
              - ["2*cos(x)**2 - cos(0)", "2*cos(x)**2 - 1"]
              - {rule: cos_zero, vars: {}}
            9:
              - ["cos(x)**2 - sin(x)**2", "2*cos(x)**2 - 1"]
              - {trans: [7, 8]}
            ```

            Key for step 5: LHS = `cos(0) - cos(x)**2`. Apply step 4 to substitute atom `cos(0)` →
            `cos(x)**2 + sin(x)**2`, giving `sin(x)**2`. Keep `cos(0)` explicit — do NOT replace
            with `1` yet (that happens in step 8 via cos_zero).
            Key for step 7: step 6 proved `sin(x)**2 = cos(0) - cos(x)**2`. Apply `{step: 6}` to
            `cos(x)**2 - sin(x)**2` to substitute the atom `sin(x)**2`, giving `2*cos(x)**2 - cos(0)`.

            Example 3 (cos(pi - x) = -cos(x)), showing constant evaluation as sub-lemmas:

            ```yaml
            1:
              - ["cos(pi)", "cos(pi/2)*cos(pi/2) - sin(pi/2)*sin(pi/2)"]
              - {rule: cos_add, vars: {x: "pi/2", y: "pi/2"}}
            2:
              - ["cos(pi/2)*cos(pi/2) - sin(pi/2)*sin(pi/2)", "-sin(pi/2)*sin(pi/2)"]
              - {rule: cos_halfpi, vars: {}}
            3:
              - ["-sin(pi/2)*sin(pi/2)", "-1"]
              - {rule: sin_halfpi, vars: {}}
            4:
              - ["cos(pi)", "-1"]
              - {trans: [1, 2, 3]}
            5:
              - ["sin(pi)", "sin(pi/2)*cos(pi/2) + cos(pi/2)*sin(pi/2)"]
              - {rule: sin_add, vars: {x: "pi/2", y: "pi/2"}}
            6:
              - ["sin(pi/2)*cos(pi/2) + cos(pi/2)*sin(pi/2)", "2*cos(pi/2)"]
              - {rule: sin_halfpi, vars: {}}
            7:
              - ["2*cos(pi/2)", "0"]
              - {rule: cos_halfpi, vars: {}}
            8:
              - ["sin(pi)", "0"]
              - {trans: [5, 6, 7]}
            9:
              - ["cos(pi - x)", "cos(pi)*cos(-x) - sin(pi)*sin(-x)"]
              - {rule: cos_add, vars: {x: "pi", y: "-x"}}
            10:
              - ["cos(pi)*cos(-x) - sin(pi)*sin(-x)", "-cos(-x) - sin(pi)*sin(-x)"]
              - {step: 4}
            11:
              - ["-cos(-x) - sin(pi)*sin(-x)", "-cos(-x)"]
              - {step: 8}
            12:
              - ["-cos(-x)", "-cos(x)"]
              - {rule: cos_neg, vars: {x: "x"}}
            13:
              - ["cos(pi - x)", "-cos(x)"]
              - {trans: [9, 10, 11, 12]}
            ```

            Key: steps 1-4 derive `cos(pi) = -1` and steps 5-8 derive `sin(pi) = 0` as sub-lemmas.
            Step 1's LHS is `cos(pi)` (i.e. `cos(pi/2+pi/2)`), NOT the main target `cos(pi - x)`.
            Steps 10-11 use `{step: K}` to substitute these constant values into the expansion.

            ## Output format

            Return the complete proof as a single YAML code block. No prose inside the code block.
        - role: user
          content: |-
            Write a complete machine-checkable proof of:

            `sin(x)*cos(y) + cos(x)*sin(y) = sin(x + y)`

            Return it as a single YAML code block.
        - role: assistant
          answer:
            mode: null
