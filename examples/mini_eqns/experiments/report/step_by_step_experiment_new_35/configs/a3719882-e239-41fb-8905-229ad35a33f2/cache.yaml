      chat:
        - role: user
          content: |
            fun: check
            args:
              eq:
                - sin(4*x)
                - cos(x)*(4*sin(x) - 8*sin(x)**3)
              proof:
                1:
                  - - sin(4*x)
                    - sin(2*x)*cos(2*x) + cos(2*x)*sin(2*x)
                  - rule: sin_add
                    vars:
                      x: 2*x
                      y: 2*x
                2:
                  - - sin(2*x)
                    - sin(x)*cos(x) + cos(x)*sin(x)
                  - rule: sin_add
                    vars:
                      x: x
                      y: x
                3:
                  - - cos(2*x)
                    - cos(x)**2 - sin(x)**2
                  - rule: cos_add
                    vars:
                      x: x
                      y: x
                4:
                  - - cos(0)
                    - cos(x)*cos(-x) - sin(x)*sin(-x)
                  - rule: cos_add
                    vars:
                      x: x
                      y: -x
                5:
                  - - cos(x)*cos(-x) - sin(x)*sin(-x)
                    - cos(x)**2 - sin(x)*sin(-x)
                  - rule: cos_neg
                    vars:
                      x: x
              rules:
                cos_zero:
                  - cos(0)
                  - '1'
                sin_zero:
                  - sin(0)
                  - '0'
                sin_halfpi:
                  - sin(pi/2)
                  - '1'
                cos_halfpi:
                  - cos(pi/2)
                  - '0'
                sin_neg:
                  - sin(-x)
                  - -sin(x)
                cos_neg:
                  - cos(-x)
                  - cos(x)
                cos_add:
                  - cos(x + y)
                  - cos(x)*cos(y) - sin(x)*sin(y)
                sin_add:
                  - sin(x + y)
                  - sin(x)*cos(y) + cos(x)*sin(y)
      options:
        model: __compute__
    iter: 2
  output:
    outputs:
      - content: |
          feedback: The proof does not end with the equation to be proved.
          step: null
