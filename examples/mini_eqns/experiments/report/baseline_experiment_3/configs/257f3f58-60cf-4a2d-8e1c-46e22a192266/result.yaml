                          We first derive the identity
                          \[
                          \cos^2 x+\sin^2 x=1
                          \]
                          from the allowed rules:

                          \[
                          \cos(x+(-x))
                          = \cos(x)\cos(-x)-\sin(x)\sin(-x)
                          = \cos^2 x+\sin^2 x.
                          \]
                          But also \(x+(-x)=0\), so
                          \[
                          \cos(x+(-x))=\cos(0)=1.
                          \]
                          Hence \(\cos^2 x+\sin^2 x=1\), so \(\cos^2 x=1-\sin^2 x\).

                          Now expand \(\sin(3x)\):
                          \[
                          \sin(3x)=\sin(x+2x)=\sin x\cos(2x)+\cos x\sin(2x).
                          \]
                          Using the addition formulas again,
                          \[
                          \cos(2x)=\cos^2 x-\sin^2 x,\qquad \sin(2x)=2\sin x\cos x.
                          \]
                          So
                          \[
                          \sin(3x)
                          = \sin x(\cos^2 x-\sin^2 x)+\cos x(2\sin x\cos x)
                          = 3\sin x\cos^2 x-\sin^3 x.
                          \]
                          Now substitute \(\cos^2 x=1-\sin^2 x\):
                          \[
                          \sin(3x)
                          =3\sin x(1-\sin^2 x)-\sin^3 x
                          =3\sin x-4\sin^3 x.
                          \]
                          Rearranging gives
