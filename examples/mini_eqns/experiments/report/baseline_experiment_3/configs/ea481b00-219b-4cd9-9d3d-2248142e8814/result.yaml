                            - {sym: 12}

                          14:
                            - ["2*sin(x)*cos(x)**2 + (cos(x)**2 - sin(x)**2)*sin(x)", "3*sin(x) - 4*sin(x)**3"]
                            - {step: 13}

                          15:
                            - ["sin(3*x)", "3*sin(x) - 4*sin(x)**3"]
                            - {trans: [6, 14]}
                          ```
