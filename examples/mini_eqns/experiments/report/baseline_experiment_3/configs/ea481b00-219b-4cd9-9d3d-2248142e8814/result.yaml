                            - ["sin(3*x)", "sin(2*x)*cos(x) + cos(2*x)*sin(x)"]
                            - {rule: sin_add, vars: {x: "2*x", y: "x"}}

                          2:
                            - ["sin(2*x)", "2*sin(x)*cos(x)"]
                            - {rule: sin_add, vars: {x: "x", y: "x"}}

                          3:
                            - ["cos(2*x)", "cos(x)**2 - sin(x)**2"]
                            - {rule: cos_add, vars: {x: "x", y: "x"}}

                          4:
                            - ["sin(2*x)*cos(x) + cos(2*x)*sin(x)", "2*sin(x)*cos(x)**2 + cos(2*x)*sin(x)"]
                            - {step: 2}

                          5:
                            - ["2*sin(x)*cos(x)**2 + cos(2*x)*sin(x)", "2*sin(x)*cos(x)**2 + (cos(x)**2 - sin(x)**2)*sin(x)"]
                            - {step: 3}

                          6:
                            - ["sin(3*x)", "2*sin(x)*cos(x)**2 + (cos(x)**2 - sin(x)**2)*sin(x)"]
                            - {trans: [1, 4, 5]}

                          7:
                            - ["cos(x + (-x))", "1"]
                            - {rule: cos_zero, vars: {}}

                          8:
                            - ["cos(x + (-x))", "cos(x)*cos(-x) - sin(x)*sin(-x)"]
                            - {rule: cos_add, vars: {x: "x", y: "-x"}}

                          9:
                            - ["cos(x)*cos(-x) - sin(x)*sin(-x)", "cos(x)**2 - sin(x)*sin(-x)"]
                            - {rule: cos_neg, vars: {x: "x"}}

                          10:
                            - ["cos(x)**2 - sin(x)*sin(-x)", "cos(x)**2 + sin(x)**2"]
                            - {rule: sin_neg, vars: {x: "x"}}

                          11:
