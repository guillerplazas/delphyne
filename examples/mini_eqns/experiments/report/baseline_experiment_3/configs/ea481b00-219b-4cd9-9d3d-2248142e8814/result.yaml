                        content: |-
                          We expand `sin(3x)` with the addition formula, then rewrite `sin(2x)` and `cos(2x)` using the same formulas with equal angles:

                          \[
                          \sin(3x)=\sin(2x+x)=\sin(2x)\cos x+\cos(2x)\sin x.
                          \]

                          Also,
                          \[
                          \sin(2x)=\sin(x+x)=\sin x\cos x+\cos x\sin x=2\sin x\cos x,
                          \]
                          and
                          \[
                          \cos(2x)=\cos(x+x)=\cos^2x-\sin^2x.
                          \]

                          So
                          \[
                          \sin(3x)=2\sin x\cos^2x+(\cos^2x-\sin^2x)\sin x.
                          \]

                          Now we need the identity \(\cos^2x+\sin^2x=1\), but we must derive it from the allowed rules. Start from
                          \[
                          \cos(x+(-x))=\cos(0)=1.
                          \]
                          Using `cos_add`,
                          \[
                          \cos(x+(-x))=\cos x\cos(-x)-\sin x\sin(-x).
                          \]
                          Then `cos_neg` and `sin_neg` give
                          \[
                          \cos x\cos(-x)-\sin x\sin(-x)=\cos^2x+\sin^2x.
                          \]
                          Hence
                          \[
                          \cos^2x+\sin^2x=1.
                          \]

                          Using this in \(3\sin x(\cos^2x+\sin^2x)-4\sin^3x\), we get
                          \[
                          3\sin x-4\sin^3x.
                          \]
                          But
                          \[
                          3\sin x(\cos^2x+\sin^2x)-4\sin^3x
                          =3\sin x\cos^2x-\sin^3x
                          =2\sin x\cos^2x+(\cos^2x-\sin^2x)\sin x.
                          \]
                          So the previous expression for \(\sin(3x)\) is exactly \(3\sin x-4\sin^3x\).

                          ```yaml
