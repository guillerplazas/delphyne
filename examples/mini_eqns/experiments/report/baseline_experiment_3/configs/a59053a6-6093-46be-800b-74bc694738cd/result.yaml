                          We first derive the complementary-angle identities from the addition formulas:

                          - \(\cos(\pi/2-y)=\sin(y)\)
                          - \(\sin(\pi/2-y)=\cos(y)\)

                          Then
                          \[
                          \sin((\pi/2-y)+y)=\sin(\pi/2)=1.
                          \]
                          Expanding the left-hand side with `sin_add` gives
                          \[
                          \sin(\pi/2-y)\cos y+\cos(\pi/2-y)\sin y
                          = \cos^2 y+\sin^2 y.
                          \]
                          So \(\cos^2 y+\sin^2 y=1\). Similarly, \(\cos^2 x+\sin^2 x=1\).

                          Now expand the target:
                          \[
                          \cos(x+y)\cos(x-y)
                          = (\cos x\cos y-\sin x\sin y)(\cos x\cos y+\sin x\sin y)
                          = \cos^2 x\cos^2 y-\sin^2 x\sin^2 y.
                          \]
                          Using
                          \[
                          \cos^2 y = 1-\sin^2 y,\qquad \sin^2 x = 1-\cos^2 x,
                          \]
                          this becomes
