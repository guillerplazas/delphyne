                  prefix:
                    - kind: oracle
                      answer:
                        mode: null
                        content: |-
                          We prove the identity by expanding the two cosine terms and then using the Pythagorean identity
                          \[
                          \cos(t)^2+\sin(t)^2=1,
                          \]
                          which itself can be derived from the allowed rules by expanding \(\cos(t-t)\).

                          First, for any \(t\),
                          \[
                          \cos(t-t)=\cos(t)\cos(-t)-\sin(t)\sin(-t)=\cos(t)^2+\sin(t)^2.
                          \]
                          Since \(\cos(t-t)=\cos(0)=1\), we get
                          \[
                          \cos(t)^2+\sin(t)^2=1.
                          \]
                          We will use this for \(t=y\) and \(t=x\).

                          Now expand the left-hand side:
                          \[
                          \cos(x+y)\cos(x-y)
                          = (\cos x\cos y-\sin x\sin y)\bigl(\cos x\cos y+\sin x\sin y\bigr).
                          \]
                          Arithmetic simplification gives
                          \[
                          (\cos x\cos y-\sin x\sin y)(\cos x\cos y+\sin x\sin y)
                          = \cos(x)^2(\cos(y)^2+\sin(y)^2)-\sin(y)^2(\sin(x)^2+\cos(x)^2).
                          \]
                          Using \(\cos(y)^2+\sin(y)^2=1\) and \(\sin(x)^2+\cos(x)^2=1\), this becomes
                          \[
                          \cos(x)^2-\sin(y)^2.
                          \]
                          So
