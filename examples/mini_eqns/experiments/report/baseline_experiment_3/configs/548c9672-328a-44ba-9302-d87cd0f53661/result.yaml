              - First derive, for any angle, \(1=\cos^2+\sin^2\) from
                \[
                \cos(0)=\cos(t+(-t))=\cos(t)\cos(-t)-\sin(t)\sin(-t)=\cos(t)^2+\sin(t)^2.
                \]
                Hence \(\sin(t)^2=1-\cos(t)^2\).

              - Then expand:
                \[
                \sin(x+y)=\sin x\cos y+\cos x\sin y,
                \]
                \[
                \sin(y-x)=\sin(y+(-x))=\sin y\cos x-\cos y\sin x.
                \]

