          We use the addition formula for sine on both factors of the left-hand side, and the identity
          \[
          1=\cos(t)^2+\sin(t)^2
          \]
          for \(t=x\) and \(t=y\), derived from `cos_add` applied to \(t+(-t)\).

          First, for \(x\):
          \[
          \cos(x+(-x))
          = \cos(x)\cos(-x)-\sin(x)\sin(-x)
          = \cos(x)^2+\sin(x)^2.
          \]
          Since \(x+(-x)=0\) and \(\cos(0)=1\), we get
          \[
          1=\cos(x)^2+\sin(x)^2.
          \]
          Similarly,
          \[
          1=\cos(y)^2+\sin(y)^2.
          \]

          Next expand the left-hand side:
          \[
          \sin(x+y)=\sin(x)\cos(y)+\cos(x)\sin(y),
          \]
          and
          \[
          \sin(y-x)=\sin(y+(-x))
          =\sin(y)\cos(-x)+\cos(y)\sin(-x)
          =\sin(y)\cos(x)-\cos(y)\sin(x).
          \]
          Hence
          \[
          \sin(x+y)\sin(y-x)
          =(\sin x\cos y+\cos x\sin y)(\sin y\cos x-\cos y\sin x),
          \]
          which simplifies arithmetically to
          \[
          \cos(x)^2\sin(y)^2-\sin(x)^2\cos(y)^2.
          \]

          Now rewrite the right-hand side:
          \[
          \cos(x)^2-\cos(y)^2
          =\cos(x)^2(\cos(y)^2+\sin(y)^2)-\cos(y)^2
          \]
          using \(1=\cos(y)^2+\sin(y)^2\), and then
          \[
          \cos(x)^2(\cos(y)^2+\sin(y)^2)-\cos(y)^2
          \]
          becomes, using \(1=\cos(x)^2+\sin(x)^2\),
          \[
          \cos(x)^2\sin(y)^2-\sin(x)^2\cos(y)^2.
          \]

          So both sides are equal to the same expression, and therefore
          \[
          \sin(x+y)\sin(y-x)=\cos(x)^2-\cos(y)^2.
          \]

