                          \cos(0)=\cos(y+(-y))
                          =\cos y\cos(-y)-\sin y\sin(-y)
                          =\cos(y)^2+\sin(y)^2.
                          \]
                          Since `cos_zero` gives \(\cos(0)=1\), we get
                          \[
                          1=\cos(y)^2+\sin(y)^2.
                          \]

                          Similarly for \(x\):
                          \[
                          1=\cos(x)^2+\sin(x)^2.
                          \]

