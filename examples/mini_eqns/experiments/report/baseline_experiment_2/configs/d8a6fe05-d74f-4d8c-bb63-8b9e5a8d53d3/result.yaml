                          \cos(x-y)=\cos(x)\cos(y)+\sin(x)\sin(y).
                          \]

                          Thus
                          \[
                          \cos(x+y)\cos(x-y)
                          =(\cos x\cos y-\sin x\sin y)(\cos x\cos y+\sin x\sin y),
                          \]
                          which simplifies to
                          \[
                          \cos(x)^2\cos(y)^2-\sin(x)^2\sin(y)^2.
                          \]

                          Now derive the Pythagorean identities. Since \(y+(-y)=0\), `cos_add` gives
                          \[
                          \cos(0)=\cos(y)\cos(-y)-\sin(y)\sin(-y),
                          \]
                          and then `cos_neg` and `sin_neg` turn this into
                          \[
                          \cos(0)=\cos(y)^2+\sin(y)^2.
                          \]
                          Using `cos_zero`, we get
                          \[
                          1=\cos(y)^2+\sin(y)^2.
                          \]
                          Similarly,
                          \[
                          1=\cos(x)^2+\sin(x)^2.
                          \]

                          Finally,
                          \[
                          \cos(x)^2-\sin(y)^2
                          =
                          \cos(x)^2(\cos(y)^2+\sin(y)^2)-\sin(y)^2(\cos(x)^2+\sin(x)^2),
                          \]
                          since each parenthesis equals \(1\). This simplifies to
                          \[
                          \cos(x)^2\cos(y)^2-\sin(x)^2\sin(y)^2.
                          \]

                          So both sides are equal to the same expression, proving the identity.

