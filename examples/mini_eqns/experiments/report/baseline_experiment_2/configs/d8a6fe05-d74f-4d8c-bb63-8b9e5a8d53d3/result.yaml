            content: |-
              We prove the identity by expanding the left-hand side and then using the derived Pythagorean identities
              \[
              \cos(t)^2+\sin(t)^2=1
              \]
              for \(t=x\) and \(t=y\).

              First expand each cosine:

              - \(\cos(x+y)=\cos x\cos y-\sin x\sin y\) by `cos_add`.
              - \(\cos(x-y)=\cos(x+(-y))=\cos x\cos(-y)-\sin x\sin(-y)\), and then using
                `cos_neg` and `sin_neg`,
                \[
                \cos(x-y)=\cos x\cos y+\sin x\sin y.
                \]

              So
              \[
              \cos(x+y)\cos(x-y)
              =(\cos x\cos y-\sin x\sin y)(\cos x\cos y+\sin x\sin y).
              \]
              By polynomial simplification, this is
              \[
              \cos(x)^2\cos(y)^2-\sin(x)^2\sin(y)^2.
              \]

              Now derive the Pythagorean identities from the allowed rules.

              For \(y\):
              \[
              \cos(0)=\cos(y+(-y))
              =\cos y\cos(-y)-\sin y\sin(-y)
              =\cos(y)^2+\sin(y)^2.
              \]
              Since `cos_zero` gives \(\cos(0)=1\), we get
              \[
              1=\cos(y)^2+\sin(y)^2.
              \]

              Similarly for \(x\):
              \[
              1=\cos(x)^2+\sin(x)^2.
              \]

              Now rewrite
              \[
              \cos(x)^2-\sin(y)^2
              \]
              by replacing each \(1\) with the corresponding sum:
              \[
              \cos(x)^2\bigl(\cos(y)^2+\sin(y)^2\bigr)-\sin(y)^2\bigl(\cos(x)^2+\sin(x)^2\bigr).
              \]
              After polynomial simplification, this becomes
              \[
              \cos(x)^2\cos(y)^2-\sin(x)^2\sin(y)^2.
              \]

              Thus both sides are equal to the same expression, so
              \[
              \cos(x+y)\cos(x-y)=\cos(x)^2-\sin(y)^2.
              \]

