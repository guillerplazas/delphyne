            content: |-
              We expand `sin(3*x)` using the addition formula, then reduce everything to expressions in `sin(x)`.

              First,
              \[
              \sin(3x)=\sin(2x+x)=\sin(2x)\cos(x)+\cos(2x)\sin(x).
              \]

              Next,
              \[
              \sin(2x)=\sin(x+x)=\sin(x)\cos(x)+\cos(x)\sin(x)=2\sin(x)\cos(x),
              \]
              and
              \[
              \cos(2x)=\cos(x+x)=\cos^2(x)-\sin^2(x).
              \]

              So
              \[
              \sin(3x)=2\sin(x)\cos^2(x)+(\cos^2(x)-\sin^2(x))\sin(x)
              =3\sin(x)\cos^2(x)-\sin^3(x).
              \]

              Now we need the Pythagorean identity. Using the allowed rules:
              \[
              \cos(0)=1,
              \]
              and also
              \[
              \cos(x-x)=\cos(x)\cos(-x)-\sin(x)\sin(-x)=\cos^2(x)+\sin^2(x).
              \]
              Since `x-x=0`, this gives
              \[
              \cos^2(x)+\sin^2(x)=1,
              \]
              hence
              \[
              \cos^2(x)=1-\sin^2(x).
              \]

              Substitute this into the expression above:
              \[
              3\sin(x)\cos^2(x)-\sin^3(x)
              =3\sin(x)(1-\sin^2(x))-\sin^3(x)
              =3\sin(x)-4\sin^3(x).
              \]

              Therefore,
              \[
              \sin(3x)=3\sin(x)-4\sin(x)^3.
              \]

