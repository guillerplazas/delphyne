              We first derive the Pythagorean identity from the allowed rules, then use it to rewrite `cos(2*x)` as `1 - 2*sin(x)**2`.

              Informally:

              1. From the addition formula,
                 \[
                 \cos(x+(-x))=\cos(x)\cos(-x)-\sin(x)\sin(-x).
                 \]
              2. Using `cos(-x)=cos(x)` and `sin(-x)=-sin(x)`, this becomes
                 \[
                 \cos(0)=\cos(x)^2+\sin(x)^2.
                 \]
              3. Since `cos(0)=1`, we get
                 \[
                 1=\cos(x)^2+\sin(x)^2,
                 \]
                 hence
                 \[
                 \cos(x)^2-\sin(x)^2 = 1-2\sin(x)^2.
                 \]
              4. Also, by the addition formulas,
                 \[
                 \sin(2x)=2\sin(x)\cos(x), \qquad \cos(2x)=\cos(x)^2-\sin(x)^2.
                 \]
                 Therefore
                 \[
                 \cos(2x)=1-2\sin(x)^2.
                 \]
              5. Now expand `sin(4*x)`:
                 \[
                 \sin(4x)=\sin(2x+2x)=2\sin(2x)\cos(2x).
                 \]
              6. Substitute the formulas for `sin(2x)` and `cos(2x)`:
                 \[
                 \sin(4x)=2(2\sin(x)\cos(x))(1-2\sin(x)^2)
                 = \cos(x)\bigl(4\sin(x)-8\sin(x)^3\bigr).
                 \]

