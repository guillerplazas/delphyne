                          We use the addition formulas and derive the needed identity
                          \[
                          \cos(x)^2+\sin(x)^2=1
                          \]
                          from the allowed rules.

                          Informally:

                          1. Expand \(\sin(3x)=\sin(2x+x)\):
                             \[
                             \sin(3x)=\sin(2x)\cos(x)+\cos(2x)\sin(x).
                             \]

                          2. Expand \(\sin(2x)\) and \(\cos(2x)\):
                             \[
                             \sin(2x)=2\sin(x)\cos(x),\qquad
                             \cos(2x)=\cos(x)^2-\sin(x)^2.
                             \]
                             Substituting these gives
                             \[
                             \sin(3x)=3\sin(x)\cos(x)^2-\sin(x)^3.
                             \]

                          3. Now derive \(\cos(x)^2+\sin(x)^2=1\):
                             \[
                             \cos(x-x)=\cos(x)\cos(-x)-\sin(x)\sin(-x)
                             \]
                             by `cos_add`, and then use `cos_neg` and `sin_neg` to rewrite the right-hand side as
                             \[
                             \cos(x)^2+\sin(x)^2.
                             \]
                             But also \(\cos(x-x)=\cos(0)=1\), so
                             \[
                             \cos(x)^2+\sin(x)^2=1.
                             \]
                             Hence
                             \[
                             \cos(x)^2=1-\sin(x)^2.
                             \]

                          4. Substitute this into \(3\sin(x)\cos(x)^2-\sin(x)^3\):
                             \[
                             3\sin(x)(1-\sin(x)^2)-\sin(x)^3
                             =3\sin(x)-4\sin(x)^3.
                             \]

                          Therefore,
                          \[
                          \sin(3x)=3\sin(x)-4\sin(x)^3.
                          \]

