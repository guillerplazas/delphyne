          We expand the two cosine factors:

          \[
          \cos(x+y)=\cos(x)\cos(y)-\sin(x)\sin(y),
          \]
          and
          \[
          \cos(x-y)=\cos(x+(-y))=\cos(x)\cos(y)+\sin(x)\sin(y),
          \]
          using `cos_add`, `cos_neg`, and `sin_neg`.

          So
          \[
          \cos(x+y)\cos(x-y)
          =
          (\cos x\cos y-\sin x\sin y)(\cos x\cos y+\sin x\sin y),
          \]
          which simplifies algebraically to
          \[
          \cos(x)^2\cos(y)^2-\sin(x)^2\sin(y)^2.
          \]

          Now we need the identity \(1=\cos(t)^2+\sin(t)^2\), derived only from the allowed rules.

          For \(t=y\):
          \[
          \sin\!\left(\frac\pi2-y\right)=\sin\!\left(\frac\pi2+(-y)\right)
          =\sin\!\left(\frac\pi2\right)\cos(-y)+\cos\!\left(\frac\pi2\right)\sin(-y)=\cos(y),
          \]
          and
          \[
          \cos\!\left(\frac\pi2-y\right)=\cos\!\left(\frac\pi2+(-y)\right)
          =\cos\!\left(\frac\pi2\right)\cos(-y)-\sin\!\left(\frac\pi2\right)\sin(-y)=\sin(y).
          \]
          Then
          \[
          \sin\!\left(\left(\frac\pi2-y\right)+y\right)
          =
          \sin\!\left(\frac\pi2-y\right)\cos(y)+\cos\!\left(\frac\pi2-y\right)\sin(y)
          =
          \cos(y)^2+\sin(y)^2.
          \]
          Since \(\left(\frac\pi2-y\right)+y=\frac\pi2\), this gives
          \[
          1=\cos(y)^2+\sin(y)^2.
          \]
          The same argument gives
          \[
          1=\cos(x)^2+\sin(x)^2.
          \]

          Using \( \cos(y)^2 = 1-\sin(y)^2 \), we rewrite
          \[
          \cos(x)^2\cos(y)^2-\sin(x)^2\sin(y)^2
          =
          \cos(x)^2(1-\sin(y)^2)-\sin(x)^2\sin(y)^2.
          \]
          This simplifies to
          \[
          \cos(x)^2-\sin(y)^2(\cos(x)^2+\sin(x)^2),
          \]
          and with \(1=\cos(x)^2+\sin(x)^2\), we obtain
          \[
          \cos(x)^2-\sin(y)^2.
          \]

          Hence
          \[
          \cos(x+y)\cos(x-y)=\cos(x)^2-\sin(y)^2.
          \]

