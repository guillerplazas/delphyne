              We can prove the identity by adding `pi/2` four times and using the addition formulas.

              First,
              \[
              \cos(x+\pi/2)
              = \cos(x)\cos(\pi/2)-\sin(x)\sin(\pi/2)
              = 0-\sin(x)
              = -\sin(x).
              \]

              Also,
              \[
              \sin(x+\pi/2)
              = \sin(x)\cos(\pi/2)+\cos(x)\sin(\pi/2)
              = 0+\cos(x)
              = \cos(x).
              \]

              Now add another `pi/2`:
              \[
              \cos(x+\pi)
              = \cos((x+\pi/2)+\pi/2)
              = \cos(x+\pi/2)\cos(\pi/2)-\sin(x+\pi/2)\sin(\pi/2)
              = 0-\sin(x+\pi/2)
              = -\cos(x).
              \]

              Similarly,
              \[
              \sin(x+\pi)
              = \sin((x+\pi/2)+\pi/2)
              = \sin(x+\pi/2)\cos(\pi/2)+\cos(x+\pi/2)\sin(\pi/2)
              = 0+\cos(x+\pi/2)
              = -\sin(x).
              \]

              Next,
              \[
              \sin(x+3\pi/2)
              = \sin((x+\pi)+\pi/2)
              = \sin(x+\pi)\cos(\pi/2)+\cos(x+\pi)\sin(\pi/2)
              = 0+\cos(x+\pi)
              = -\cos(x).
              \]

              Finally,
              \[
              \cos(x+2\pi)
              = \cos((x+3\pi/2)+\pi/2)
              = \cos(x+3\pi/2)\cos(\pi/2)-\sin(x+3\pi/2)\sin(\pi/2)
              = 0-\sin(x+3\pi/2)
              = -(-\cos(x))
              = \cos(x).
              \]

