                          Expand the two cosine terms first:
                          \[
                          \cos(x-y)=\cos x\cos y+\sin x\sin y,
                          \qquad
                          \cos(x+y)=\cos x\cos y-\sin x\sin y.
                          \]
                          Hence
                          \[
                          \cos(x+y)\cos(x-y)
                          =(\cos x\cos y-\sin x\sin y)(\cos x\cos y+\sin x\sin y)
                          =\cos^2x\cos^2y-\sin^2x\sin^2y.
                          \]

                          Now we derive the Pythagorean identity from the allowed rules. Using
                          \[
                          \cos(0)=1,\qquad \cos(t+(-t))=\cos t\cos(-t)-\sin t\sin(-t),
                          \]
                          together with \(\cos(-t)=\cos t\) and \(\sin(-t)=-\sin t\), we get
                          \[
                          \cos^2 t+\sin^2 t=1.
                          \]
                          Applying this for \(t=y\) and \(t=x\), we have
                          \[
                          \cos^2 y+\sin^2 y=1,\qquad \cos^2 x+\sin^2 x=1.
                          \]

