                        content: |-
                          Expand the left-hand side with the cosine addition formula:
                          \[
                          \cos(x-y)=\cos x\cos y+\sin x\sin y,\qquad
                          \cos(x+y)=\cos x\cos y-\sin x\sin y.
                          \]
                          Hence
                          \[
                          \cos(x+y)\cos(x-y)
                          =(\cos x\cos y-\sin x\sin y)(\cos x\cos y+\sin x\sin y)
                          =\cos(x)^2\cos(y)^2-\sin(x)^2\sin(y)^2.
                          \]

                          So it remains to show that
                          \[
                          \cos(x)^2-\sin(y)^2
                          =\cos(x)^2\cos(y)^2-\sin(x)^2\sin(y)^2.
                          \]
                          For that, we derive \(\sin(t)^2+\cos(t)^2=1\) from the allowed rules.

                          Using `cos_add` and `sin_add` at \(\pi/2-t\), together with `cos_halfpi`, `sin_halfpi`, `cos_neg`, and `sin_neg`, we get
                          \[
                          \cos(\pi/2-t)=\sin t,\qquad \sin(\pi/2-t)=\cos t.
                          \]
                          Then
                          \[
                          \sin(t)^2+\cos(t)^2
                          =\sin t\cos(\pi/2-t)+\cos t\sin(\pi/2-t)
                          =\sin(\pi/2)=1.
                          \]
                          Applying this for \(t=x\) and \(t=y\), we obtain
                          \[
                          \sin(x)^2+\cos(x)^2=1,\qquad \sin(y)^2+\cos(y)^2=1.
                          \]

                          Now substitute these into the right-hand side:
                          \[
                          \cos(x)^2-\sin(y)^2
                          =\cos(x)^2(\sin(y)^2+\cos(y)^2)-\sin(y)^2(\sin(x)^2+\cos(x)^2)
                          =\cos(x)^2\cos(y)^2-\sin(x)^2\sin(y)^2.
                          \]

                          Thus both sides are equal to the same expression, so
                          \[
                          \cos(x+y)\cos(x-y)=\cos(x)^2-\sin(y)^2.
                          \]

