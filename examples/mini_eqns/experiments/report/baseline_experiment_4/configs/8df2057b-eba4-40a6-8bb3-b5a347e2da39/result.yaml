                      answer:
                        mode: null
                        content: |-
                          We expand the left-hand side with the addition formula:
                          \[
                          \sin(x+y)=\sin x\cos y+\cos x\sin y,
                          \]
                          and
                          \[
                          \sin(y-x)=\sin(y+(-x))=\sin y\cos(-x)+\cos y\sin(-x)=\sin y\cos x-\cos y\sin x.
                          \]
                          Therefore
                          \[
                          \sin(x+y)\sin(y-x)
                          =(\sin x\cos y+\cos x\sin y)(\sin y\cos x-\cos y\sin x),
                          \]
                          which simplifies algebraically to
                          \[
                          \cos^2 x\,\sin^2 y-\sin^2 x\,\cos^2 y.
                          \]

                          Now we derive the Pythagorean identity from the allowed rules. Using
                          \[
                          \cos(t+(-t))=\cos t\cos(-t)-\sin t\sin(-t)
                          \]
                          together with \(\cos(-t)=\cos t\), \(\sin(-t)=-\sin t\), and \(\cos(0)=1\), we get
                          \[
                          \cos^2 t+\sin^2 t=1.
                          \]
                          Applying this for \(t=y\) and \(t=x\), we have
                          \[
                          \cos^2 y+\sin^2 y=1,\qquad \cos^2 x+\sin^2 x=1.
                          \]

                          Then
                          \[
                          \cos^2 x-\cos^2 y
                          =\cos^2 x(\cos^2 y+\sin^2 y)-\cos^2 y(\cos^2 x+\sin^2 x),
                          \]
                          which simplifies algebraically to
                          \[
                          \cos^2 x\,\sin^2 y-\sin^2 x\,\cos^2 y.
                          \]

                          So both sides are equal to the same expression, hence
                          \[
