                        content: |-
                          We can derive the identity from the triple-angle formula for sine, proved only with the allowed addition rules.

                          First,
                          \[
                          \sin(2x)=\sin(x+x)=\sin x\cos x+\cos x\sin x=2\sin x\cos x,
                          \]
                          and
                          \[
                          \cos(2x)=\cos(x+x)=\cos^2 x-\sin^2 x.
                          \]

                          Now expand \(\sin(3x)\):
                          \[
                          \sin(3x)=\sin(2x+x)=\sin(2x)\cos x+\cos(2x)\sin x.
                          \]
                          Substituting the two identities above gives
                          \[
                          \sin(3x)=2\sin x\cos^2 x+(\cos^2 x-\sin^2 x)\sin x
                          =3\sin x\cos^2 x-\sin^3 x.
                          \]

                          Next we derive \(\cos^2 x=1-\sin^2 x\). Using
                          \[
                          \cos(0)=1
                          \]
                          and
                          \[
                          \cos(x+(-x))=\cos x\cos(-x)-\sin x\sin(-x),
                          \]
                          together with \(\cos(-x)=\cos x\) and \(\sin(-x)=-\sin x\), we get
                          \[
                          1=\cos^2 x+\sin^2 x,
                          \]
                          hence
                          \[
                          \cos^2 x=1-\sin^2 x.
                          \]

