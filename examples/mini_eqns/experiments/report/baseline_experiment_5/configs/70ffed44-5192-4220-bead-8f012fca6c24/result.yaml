              Using `cos_neg` and `sin_neg`, the right-hand side becomes
              `cos(x)**2 + sin(x)**2`.
              Hence `1 = cos(x)**2 + sin(x)**2`, so
              `cos(x)**2 - sin(x)**2 = 1 - 2*sin(x)**2`.
              Therefore
              `cos(2*x) = 1 - 2*sin(x)**2`.

              Substituting into `sin(4*x) = 4*sin(x)*cos(x)*cos(2*x)` gives
              `sin(4*x) = 4*sin(x)*cos(x)*(1 - 2*sin(x)**2) = cos(x)*(4*sin(x) - 8*sin(x)**3)`.

