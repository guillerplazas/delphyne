              `sin(4*x) = sin(2*x + 2*x) = 2*sin(2*x)*cos(2*x)` by `sin_add`.

              Also,
              `sin(2*x) = sin(x + x) = 2*sin(x)*cos(x)`,
              so
              `sin(4*x) = 4*sin(x)*cos(x)*cos(2*x)`.

              Next,
              `cos(2*x) = cos(x + x) = cos(x)**2 - sin(x)**2` by `cos_add`.

              To rewrite this in terms of `sin(x)`, we prove
              `1 = cos(x)**2 + sin(x)**2` from the allowed rules:
