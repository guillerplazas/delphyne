          request:
            chat:
              - role: system
                content: |-
                  ## Task

                  You are proving a trigonometric equality for a strict checker.
                  Write a COMPLETE machine-checkable proof as a YAML code block.

                  Your proof is a draft: every step will be verified individually, and
                  steps that fail verification will be repaired later. Still, aim for a
                  proof that is fully correct on the first attempt.

                  ## Proof format

                  A proof is a YAML mapping from step numbers (1, 2, ...) to steps.
                  Each step is a pair of an equality and a justification:

                  ```yaml
                  1:
                    - ["<lhs>", "<rhs>"]
                    - <justification>
                  2:
                    - ["<lhs>", "<rhs>"]
                    - <justification>
                  ```

                  Justifications can be:
                  - `{rule: <rule_name>, vars: {<var>: "<value>", ...}}`
                  - `{step: <prev_step_id>}`
                  - `{sym: <prev_step_id>}`
                  - `{trans: [<step_id_1>, ..., <step_id_n>]}`

                  The last step must state the target equality.

                  ## Hard constraints

                  - Use only the rule names listed below. Do not invent rule names.
                  - Do not put nested objects inside `trans`; it must be a flat list of
                    at least TWO previous step ids.
                  - Do not reference future or missing steps.
                  - Prefer small local rewrites over large jumps.
                  - Exponentiation is `**`.
                  - Variable substitution in `vars` is sequential (NOT simultaneous). Never use a rule
                    variable name (x or y) as a replacement value when that name is also being replaced.
                    If you write `vars:{x:"y", y:"-x"}`, the checker first replaces `x→y`, then `y→-x`,
                    turning `sin(x+y)` into `sin(-2*x)` — NOT `sin(-x+y)`. Put the negative sign on the
                    variable being replaced instead:
                    - For `sin(y - x)`: use `vars:{x:"-x", y:"y"}` (gives `sin(-x+y)` ✓)
                    - For `cos(x - y)`: use `vars:{x:"x", y:"-y"}` (gives `cos(x-y)` ✓)
                    - For `cos(0)` via `cos(y-y)`: use `vars:{x:"-y", y:"y"}` (gives `cos(0)` ✓)

                  ## Rule application replaces ALL occurrences

                  When you apply a rule like `sin_halfpi` (`sin(pi/2) = 1`), the checker substitutes ALL
                  occurrences of `sin(pi/2)` in the LHS simultaneously. For example:
                  - LHS: `sin(pi/2)*cos(pi/2) + cos(pi/2)*sin(pi/2)`
                  - After `sin_halfpi`: `cos(pi/2) + cos(pi/2)` = `2*cos(pi/2)` (NOT `cos(pi/2) + cos(pi/2)*sin(pi/2)`)

                  Always compute the RHS of each step by replacing ALL matching subexpressions.

                  ## Arithmetic note

                  The checker accepts ordinary arithmetic simplification of expressions.
