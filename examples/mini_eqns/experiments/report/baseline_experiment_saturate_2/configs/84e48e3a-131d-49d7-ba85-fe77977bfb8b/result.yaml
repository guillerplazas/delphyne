            content: |-
              We expand `sin(4*x)` using the addition formula twice:

              - `sin(4*x) = sin(2*x + 2*x) = 2*sin(2*x)*cos(2*x)`.
              - `sin(2*x) = sin(x+x) = 2*sin(x)*cos(x)`.
              - `cos(2*x) = cos(x+x) = cos(x)**2 - sin(x)**2`.

              So
              \[
              \sin(4x)=4\sin(x)\cos(x)\bigl(\cos(x)^2-\sin(x)^2\bigr).
              \]

              Now we need to turn `cos(x)**2 - sin(x)**2` into `1 - 2*sin(x)**2`. For that, we derive
              \[
              \cos(x)^2+\sin(x)^2=1
              \]
              from the allowed rules:

              - `cos(0)=1`.
              - Also `cos(x+(-x)) = cos(x)*cos(-x) - sin(x)*sin(-x)`.
              - Using `cos(-x)=cos(x)` and `sin(-x)=-sin(x)`, this becomes
                `cos(0) = cos(x)**2 + sin(x)**2`.

              Hence `cos(x)**2 + sin(x)**2 = 1`, so by polynomial simplification,
              \[
              \cos(x)^2-\sin(x)^2 = 1-2\sin(x)^2.
              \]
              Therefore
              \[
              4\sin(x)\cos(x)(\cos(x)^2-\sin(x)^2)
              =4\sin(x)\cos(x)(1-2\sin(x)^2)
              =\cos(x)\bigl(4\sin(x)-8\sin(x)^3\bigr).
              \]

