            content: |-
              We use the double-angle formula for cosine, then derive the Pythagorean identity from the allowed rules.

              First,
              \[
              \cos(2x)=\cos(x+x)=\cos^2(x)-\sin^2(x).
              \]

              So it remains to show that
              \[
              \cos^2(x)-\sin^2(x)=1-2\sin^2(x).
              \]
              For that, we prove
              \[
              \cos^2(x)+\sin^2(x)=1.
              \]

              Indeed,
              \[
              \cos(x-x)=\cos(x)\cos(-x)-\sin(x)\sin(-x)
              \]
              by `cos_add`. Then using `cos_neg` and `sin_neg`,
              \[
              \cos(x)\cos(-x)-\sin(x)\sin(-x)=\cos^2(x)+\sin^2(x).
              \]
              But also, since \(x-x=0\),
              \[
              \cos(x-x)=\cos(0)=1
              \]
              by `cos_zero` modulo arithmetic simplification. Hence
              \[
              \cos^2(x)+\sin^2(x)=1.
              \]

              Now substitute this into
              \[
              \cos^2(x)-\sin^2(x)
              = (\cos^2(x)+\sin^2(x)) - 2\sin^2(x)
              = 1 - 2\sin^2(x).
              \]

