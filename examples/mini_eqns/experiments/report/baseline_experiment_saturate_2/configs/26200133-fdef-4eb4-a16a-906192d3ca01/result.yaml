                          \[
                          \cos(2x)=\cos(x+x)=\cos^2(x)-\sin^2(x).
                          \]

                          So it remains to show that
                          \[
                          \cos^2(x)-\sin^2(x)=1-2\sin^2(x).
                          \]
                          For that, we first derive the identity
                          \[
                          \cos^2(x)+\sin^2(x)=1
                          \]
                          from the allowed rules:

                          \[
                          \cos(0)=1
                          \]
                          by `cos_zero`, and also
                          \[
                          \cos(0)=\cos(x+(-x))=\cos(x)\cos(-x)-\sin(x)\sin(-x)
                          =\cos^2(x)+\sin^2(x),
                          \]
                          using `cos_add`, `cos_neg`, and `sin_neg`.

                          Then substituting \(\cos^2(x)+\sin^2(x)=1\) into
                          \[
                          \cos^2(x)-\sin^2(x)
                          \]
                          gives
                          \[
                          \cos^2(x)-\sin^2(x)=1-2\sin^2(x).
                          \]

                          Hence,
                          \[
                          \cos(2x)=1-2\sin^2(x).
