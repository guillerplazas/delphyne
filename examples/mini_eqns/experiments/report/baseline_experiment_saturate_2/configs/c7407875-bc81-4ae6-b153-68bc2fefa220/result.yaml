            content: |-
              We can prove the identity by rewriting `pi - x` as `pi/2 + (pi/2 - x)` and then using the addition formulas.

              Informally:

              \[
              \sin(\pi - x)=\sin\!\left(\frac{\pi}{2}+\left(\frac{\pi}{2}-x\right)\right).
              \]

              Applying the sine addition formula,

              \[
              \sin\!\left(\frac{\pi}{2}+\left(\frac{\pi}{2}-x\right)\right)
              =
              \sin(\pi/2)\cos(\pi/2-x)+\cos(\pi/2)\sin(\pi/2-x).
              \]

              Now use `sin(pi/2)=1` and `cos(pi/2)=0`, so this becomes

              \[
              \cos(\pi/2-x).
              \]

              It remains to show that `cos(pi/2 - x) = sin(x)`. Write `pi/2 - x` as `pi/2 + (-x)` and apply the cosine addition formula:

              \[
              \cos(\pi/2-x)=\cos(\pi/2+(-x))
              =
              \cos(\pi/2)\cos(-x)-\sin(\pi/2)\sin(-x).
              \]

              Using `cos(pi/2)=0`, `sin(pi/2)=1`, and `sin(-x)=-sin(x)`, this simplifies to

              \[
              0-1\cdot(-\sin(x))=\sin(x).
              \]

              So indeed,

              \[
              \sin(\pi-x)=\sin(x).
              \]

