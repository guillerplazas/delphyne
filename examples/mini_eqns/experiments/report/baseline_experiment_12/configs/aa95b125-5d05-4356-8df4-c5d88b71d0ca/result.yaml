              \[
              \sin(2\pi+x)=\sin(\pi+(\pi+x))=\sin(\pi)\cos(\pi+x)+\cos(\pi)\sin(\pi+x)=-\sin(\pi+x),
              \]
              and again
              \[
              \sin(\pi+x)=\sin(\pi)\cos(x)+\cos(\pi)\sin(x)=-\sin(x).
              \]
              So \(\sin(2\pi+x)=-(-\sin x)=\sin x\).

