                  1. rule:cos_add vars:{x:"x", y:"x"} → cos(x)**2 - sin(x)**2
                  2. rule:cos_add vars:{x:"x", y:"-x"} → cos(x)*cos(-x) - sin(x)*sin(-x)
                  3. rule:cos_neg vars:{x:"x"} → cos(x)**2 - sin(x)*sin(-x)
                  4. rule:sin_neg vars:{x:"x"} → cos(x)**2 + sin(x)**2
                  5. trans:[2,3,4] → cos(0) = cos(x)**2 + sin(x)**2
                  6. sym:[5] → cos(x)**2 + sin(x)**2 = cos(0)
                  7. rule:cos_zero → 1
                  8. trans:[6,7] → cos(x)**2 + sin(x)**2 = 1
                  9. step:[8] → 2*cos(x)**2 - (cos(x)**2 + sin(x)**2) = 2*cos(x)**2 - 1
                  10. trans:[1,9] → cos(2*x) = 2*cos(x)**2 - 1
                  ```
                  Note for step 9: `cos(x)**2 - sin(x)**2` equals `2*cos(x)**2 - (cos(x)**2 + sin(x)**2)`
                  by arithmetic, so the checker accepts the chain from step 1 through step 9.
