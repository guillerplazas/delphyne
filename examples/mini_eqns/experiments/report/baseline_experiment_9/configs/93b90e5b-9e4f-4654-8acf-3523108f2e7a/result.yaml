              - `sin(pi) = 0`
              - `cos(pi) = -1`

              Then apply the same formulas to `pi + pi = 2*pi` to get
              - `sin(2*pi) = 0`
              - `cos(2*pi) = 1`

              Finally, expand `sin(2*pi + x)` with `sin_add` and substitute these values:
              `sin(2*pi+x) = sin(2*pi)*cos(x) + cos(2*pi)*sin(x) = 0*cos(x) + 1*sin(x) = sin(x)`.

              ```yaml
              1:
                - ["sin(pi)", "0"]
                - {rule: sin_add, vars: {x: "pi/2", y: "pi/2"}}

              2:
                - ["cos(pi)", "-1"]
                - {rule: cos_add, vars: {x: "pi/2", y: "pi/2"}}

              3:
                - ["sin(2*pi)", "sin(pi)*cos(pi) + cos(pi)*sin(pi)"]
                - {rule: sin_add, vars: {x: "pi", y: "pi"}}

