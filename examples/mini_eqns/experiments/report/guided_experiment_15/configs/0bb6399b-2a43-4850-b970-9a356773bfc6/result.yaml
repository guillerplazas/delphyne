                        content: |-
                          We expand the left-hand side using the addition formula, then derive the Pythagorean relation from `cos(0)=1` and use it to simplify.

                          Informally:

                          1. Expand
                             - `sin(x + y) = sin(x)*cos(y) + cos(x)*sin(y)`
                             - `sin(y - x) = sin(y + (-x)) = sin(y)*cos(x) - cos(y)*sin(x)`

                          2. Multiply:
                             \[
                             \sin(x+y)\sin(y-x)
                             = (\sin x\cos y+\cos x\sin y)(\sin y\cos x-\cos y\sin x)
                             = \cos^2 x\,\sin^2 y-\sin^2 x\,\cos^2 y.
                             \]

                          3. Derive `sin(t)^2 = 1 - cos(t)^2` from
                             - `cos(t + (-t)) = cos(t)cos(-t) - sin(t)sin(-t)`
                             - `cos(0)=1`, `cos(-t)=cos(t)`, `sin(-t)=-sin(t)`

                             Hence `1 = cos(t)^2 + sin(t)^2`, so `sin(t)^2 = 1 - cos(t)^2`.

                          4. Apply this for `t=y` and `t=x`:
