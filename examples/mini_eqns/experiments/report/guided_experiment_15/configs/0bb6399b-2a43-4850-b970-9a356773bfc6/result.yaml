                          \ `sin(t)**2 = 1 - cos(t)**2`, which we must derive from the allowed rules.\n\
                          \nFor any `t`, by `cos_add` with `t` and `-t`,\n- `cos(t + (-t)) = cos(t)*cos(-t)\
