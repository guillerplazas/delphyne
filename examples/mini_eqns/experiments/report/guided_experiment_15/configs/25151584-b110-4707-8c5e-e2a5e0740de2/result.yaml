                        content: |-
                          We expand the left-hand side and rewrite the right-hand side to the same polynomial expression.

                          First,
                          - `cos(x + y) = cos(x)*cos(y) - sin(x)*sin(y)` by `cos_add`.
                          - For `cos(x - y)`, write it as `cos(x + (-y))`:
                            - `cos(x - y) = cos(x)*cos(-y) - sin(x)*sin(-y)` by `cos_add`,
                            - `cos(-y) = cos(y)` by `cos_neg`,
                            - `sin(-y) = -sin(y)` by `sin_neg`,
                            so `cos(x - y) = cos(x)*cos(y) + sin(x)*sin(y)`.

                          Therefore
                          `cos(x + y)*cos(x - y)`
                          becomes
                          `(cos(x)*cos(y) - sin(x)*sin(y))*(cos(x)*cos(y) + sin(x)*sin(y))`,
                          which simplifies algebraically to
                          `cos(x)**2*cos(y)**2 - sin(x)**2*sin(y)**2`.

                          Now we show the same for the right-hand side. From
                          `cos(0) = 1`
                          and
                          `cos(y + (-y)) = cos(y)*cos(-y) - sin(y)*sin(-y)`,
                          together with `cos(-y)=cos(y)` and `sin(-y)=-sin(y)`, we get
                          `1 = cos(y)**2 + sin(y)**2`.

                          Similarly, using `x` instead of `y`, we get
                          `1 = cos(x)**2 + sin(x)**2`.

