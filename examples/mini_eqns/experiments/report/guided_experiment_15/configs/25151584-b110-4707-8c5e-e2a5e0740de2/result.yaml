                `cos(x - y) = cos(x)*cos(-y) - sin(x)*sin(-y)`.
              - Then use `cos(-y) = cos(y)` and `sin(-y) = -sin(y)` to get
                `cos(x - y) = cos(x)*cos(y) + sin(x)*sin(y)`.

              So
              `cos(x + y)*cos(x - y) = cos(x + y)*(cos(x)*cos(y) + sin(x)*sin(y))`.

              Now expand `cos(x + y)`:
              `cos(x + y) = cos(x)*cos(y) - sin(x)*sin(y)`.

              Hence
              `cos(x + y)*cos(x - y)`
              becomes
              `(cos(x)*cos(y) - sin(x)*sin(y))*(cos(x)*cos(y) + sin(x)*sin(y))`,
              which simplifies algebraically to
              `cos(x)**2*cos(y)**2 - sin(x)**2*sin(y)**2`.

              Now we show the right-hand side equals the same expression.

              From `cos(y + (-y)) = cos(0) = 1`, expanding with `cos_add` gives
              `1 = cos(y)**2 + sin(y)**2`.

              Similarly, from `cos(x + (-x)) = 1`, we get
              `1 = cos(x)**2 + sin(x)**2`,
              hence
              `sin(x)**2 = 1 - cos(x)**2`.

              Substitute this into the common intermediate form:
              `cos(x)**2*cos(y)**2 - sin(x)**2*sin(y)**2`
