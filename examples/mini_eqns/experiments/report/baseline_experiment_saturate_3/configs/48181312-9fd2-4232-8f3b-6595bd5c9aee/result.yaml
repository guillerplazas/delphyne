              \cos(2x)=\cos(x+x)=\cos^2(x)-\sin^2(x).
              \]
              Substituting these into the expression for \(\sin(3x)\) gives
              \[
              \sin(3x)=2\sin(x)\cos^2(x)+(\cos^2(x)-\sin^2(x))\sin(x)
              =3\sin(x)\cos^2(x)-\sin^3(x).
              \]

              Now we derive \(\cos^2(x)=1-\sin^2(x)\) from the allowed rules. Using
              \[
              \cos(0)=\cos(x+(-x))=\cos(x)\cos(-x)-\sin(x)\sin(-x),
              \]
              together with \(\cos(-x)=\cos(x)\), \(\sin(-x)=-\sin(x)\), and \(\cos(0)=1\), we get
              \[
              1=\cos^2(x)+\sin^2(x),
              \]
              hence
              \[
              \cos^2(x)=1-\sin^2(x).
              \]
              Substitute this into the previous expression:
              \[
              \sin(3x)=3\sin(x)(1-\sin^2(x))-\sin^3(x)=3\sin(x)-4\sin^3(x).
              \]

