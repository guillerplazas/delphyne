            mode: null
            content: |-
              We expand `sin(4*x)` using the addition formula, then expand `sin(2*x)` and `cos(2*x)` similarly.

              \[
              \sin(4x)=\sin(2x+2x)=2\sin(2x)\cos(2x).
              \]

              Also,
              \[
              \sin(2x)=\sin(x+x)=2\sin(x)\cos(x),
              \]
              and
              \[
              \cos(2x)=\cos(x+x)=\cos^2(x)-\sin^2(x).
              \]

              So
              \[
              \sin(4x)=4\sin(x)\cos(x)(\cos^2(x)-\sin^2(x)).
              \]

              Now we derive the Pythagorean identity from the allowed rules:
              \[
              \cos(0)=1,
              \]
              and
              \[
              \cos(x+(-x))=\cos(x)\cos(-x)-\sin(x)\sin(-x)=\cos^2(x)+\sin^2(x).
              \]
              Since \(x+(-x)=0\), this gives
              \[
              1=\cos^2(x)+\sin^2(x).
              \]

              Hence
              \[
              \cos^2(x)-\sin^2(x)=(1-\sin^2(x))-\sin^2(x)=1-2\sin^2(x),
              \]
              so
              \[
              4\sin(x)\cos(x)(\cos^2(x)-\sin^2(x))
              =4\sin(x)\cos(x)(1-2\sin^2(x))
              =\cos(x)\bigl(4\sin(x)-8\sin^3(x)\bigr).
              \]

              Therefore,
              \[
              \sin(4*x)=\cos(x)*(4\sin(x)-8\sin(x)^3).
              \]

