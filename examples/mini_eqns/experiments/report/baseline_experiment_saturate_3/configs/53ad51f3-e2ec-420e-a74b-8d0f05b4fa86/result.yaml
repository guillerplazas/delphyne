              \cos(\pi+x)=\cos(\pi)\cos(x)-\sin(\pi)\sin(x).
              \]
              So it remains to compute \(\cos(\pi)\) and \(\sin(\pi)\).

              Using \(\pi=\pi/2+\pi/2\):

              - \(\cos(\pi)=\cos(\pi/2+\pi/2)=\cos(\pi/2)\cos(\pi/2)-\sin(\pi/2)\sin(\pi/2)=0\cdot 0-1\cdot 1=-1\).
