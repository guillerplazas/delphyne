              Here is a proof using only the permitted rewriting rules and algebraic simplification:

              1. First, derive a Pythagorean identity from `cos(0)`:
                 - `cos(0) = 1` by `cos_zero`
                 - `cos(0) = cos(x)*cos(-x) - sin(x)*sin(-x)` by `cos_add`
                 - `cos(x)*cos(-x) - sin(x)*sin(-x) = cos(x)**2 + sin(x)**2` by `cos_neg` and `sin_neg`
                 So `1 = cos(x)**2 + sin(x)**2`.

              2. Next, use angle addition for `sin(3*x) = sin(2*x + x)`:
                 - `sin(3*x) = sin(2*x)*cos(x) + cos(2*x)*sin(x)` by `sin_add`
                 - `sin(2*x) = sin(x)*cos(x) + cos(x)*sin(x)` by `sin_add`
                 - `cos(2*x) = cos(x)**2 - sin(x)**2` by `cos_add`

              3. Substituting these into the expression for `sin(3*x)` and simplifying gives:
                 - `sin(3*x) = 3*sin(x)*cos(x)**2 - sin(x)**3`

              4. Using `cos(x)**2 = 1 - sin(x)**2` from step 1, we get:
                 - `sin(3*x) = 3*sin(x)*(1 - sin(x)**2) - sin(x)**3`
                 - `sin(3*x) = 3*sin(x) - 4*sin(x)**3`

