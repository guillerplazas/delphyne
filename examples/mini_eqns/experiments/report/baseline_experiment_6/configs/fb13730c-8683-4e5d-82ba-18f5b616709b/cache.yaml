              However, the second step uses property `cos(pi/2-x) = sin(x)`, which is not part of the allowed set of rules. Thus, we provide a longer derivation that uses `cos_add`.

              ```
              cos(pi/2-pi/6)
              = cos(pi/2+(-pi/6))
              = cos(pi/2)*cos(-pi/6) - sin(pi/2)*sin(-pi/6)
              = -sin(-pi/6)
              = sin(pi/6)
