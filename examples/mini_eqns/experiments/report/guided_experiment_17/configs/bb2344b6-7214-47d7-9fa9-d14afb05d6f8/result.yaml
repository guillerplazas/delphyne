                        content: |-
                          We can prove this by expanding `sin(2*pi + x)` with the addition formula and then evaluating the constants `sin(2*pi)` and `cos(2*pi)` from the standard half-pi identities.

                          First,
                          \[
                          \sin(2\pi + x)=\sin(2\pi)\cos(x)+\cos(2\pi)\sin(x).
                          \]
                          So it remains to show `sin(2*pi) = 0` and `cos(2*pi) = 1`.

                          Using `pi = pi/2 + pi/2`, we get:
                          - `cos(pi) = cos(pi/2 + pi/2) = cos(pi/2)*cos(pi/2) - sin(pi/2)*sin(pi/2) = -1`
                          - `sin(pi) = sin(pi/2 + pi/2) = sin(pi/2)*cos(pi/2) + cos(pi/2)*sin(pi/2) = 0`

                          Then expand `sin(2*pi) = sin(pi + pi)` and `cos(2*pi) = cos(pi + pi)`:
                          - `sin(2*pi) = sin(pi)*cos(pi) + cos(pi)*sin(pi) = 0`
                          - `cos(2*pi) = cos(pi)*cos(pi) - sin(pi)*sin(pi) = 1`

                          Substituting these into the expansion gives:
                          \[
                          \sin(2\pi + x)=0\cdot \cos(x)+1\cdot \sin(x)=\sin(x).
                          \]

