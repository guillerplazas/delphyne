            content: |-
              We expand both sine factors, then use the identities
              `sin(t)**2 = 1 - cos(t)**2`, which we derive from `cos(0)=1` and the addition formula for `cos(t+(-t))`.

              Informally:

              1. From
                 `cos(x+(-x)) = cos(x)cos(-x) - sin(x)sin(-x)`,
                 together with `cos(-x)=cos(x)` and `sin(-x)=-sin(x)`, we get
                 `cos(0) = cos(x)**2 + sin(x)**2`.
                 Since `cos(0)=1`, this gives
                 `cos(x)**2 + sin(x)**2 = 1`, hence
                 `sin(x)**2 = 1 - cos(x)**2`.

              2. Similarly,
                 `cos(y)**2 + sin(y)**2 = 1`, hence
                 `sin(y)**2 = 1 - cos(y)**2`.

              3. Expand the left-hand side:
                 `sin(x+y) = sin(x)cos(y) + cos(x)sin(y)`,
                 and
                 `sin(y-x) = sin(y)cos(x) - cos(y)sin(x)`.

                 Therefore
                 ```
                 sin(x+y)sin(y-x)
                 = (sin(x)cos(y) + cos(x)sin(y))(sin(y)cos(x) - cos(y)sin(x))
                 = cos(x)**2 sin(y)**2 - sin(x)**2 cos(y)**2.
                 ```

              4. Now substitute
                 `sin(y)**2 = 1 - cos(y)**2` and
                 `sin(x)**2 = 1 - cos(x)**2`:
                 ```
                 cos(x)**2 sin(y)**2 - sin(x)**2 cos(y)**2
                 = cos(x)**2(1 - cos(y)**2) - (1 - cos(x)**2)cos(y)**2
                 = cos(x)**2 - cos(y)**2.
                 ```

              So `sin(x + y)*sin(y - x) = cos(x)**2 - cos(y)**2`.

