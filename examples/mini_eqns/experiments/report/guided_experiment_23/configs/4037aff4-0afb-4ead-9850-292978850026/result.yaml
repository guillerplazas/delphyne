                      answer:
                        mode: null
                        content: |-
                          Use the addition formula on both cosine factors.

                          \[
                          \cos(x+y)=\cos x\cos y-\sin x\sin y
                          \]

                          and

                          \[
                          \cos(x-y)=\cos(x+(-y))
                          =\cos x\cos(-y)-\sin x\sin(-y)
                          =\cos x\cos y+\sin x\sin y
                          \]

                          using `cos_neg` and `sin_neg`.

                          So the left-hand side becomes

                          \[
                          \cos(x+y)\cos(x-y)
                          =(\cos x\cos y-\sin x\sin y)(\cos x\cos y+\sin x\sin y)
                          =\cos(x)^2\cos(y)^2-\sin(x)^2\sin(y)^2.
                          \]

                          Now derive the Pythagorean identity from the allowed rules:
                          \[
                          \cos(0)=\cos(t+(-t))
                          =\cos t\cos(-t)-\sin t\sin(-t)
                          =\cos(t)^2+\sin(t)^2,
                          \]
                          and since `cos(0)=1`, we get
                          \[
                          1=\cos(t)^2+\sin(t)^2.
                          \]

                          Applying this for \(t=x\) and \(t=y\), we have
                          \[
                          1=\cos(x)^2+\sin(x)^2,\qquad 1=\cos(y)^2+\sin(y)^2.
                          \]

                          Then
                          \[
                          \cos(x)^2-\sin(y)^2
                          =\cos(x)^2(\cos(y)^2+\sin(y)^2)-\sin(y)^2
                          =\cos(x)^2\cos(y)^2-\sin(x)^2\sin(y)^2.
                          \]

                          So both sides are equal to the same expression, proving
                          \[
                          \cos(x+y)\cos(x-y)=\cos(x)^2-\sin(y)^2.
                          \]

