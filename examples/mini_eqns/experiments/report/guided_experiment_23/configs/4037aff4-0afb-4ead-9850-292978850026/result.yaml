                          We expand the two cosine factors on the left, and derive the Pythagorean identities from the allowed addition/negation rules.

                          First,
                          - `cos(x - y) = cos(x + (-y)) = cos(x)*cos(y) + sin(x)*sin(y)`
                          - `cos(x + y) = cos(x)*cos(y) - sin(x)*sin(y)`

                          So
                          \[
                          \cos(x+y)\cos(x-y)
                          = (\cos x\cos y-\sin x\sin y)(\cos x\cos y+\sin x\sin y)
                          = \cos(x)^2\cos(y)^2-\sin(x)^2\sin(y)^2.
                          \]

                          Next, derive `1 = cos(t)^2 + sin(t)^2` from the rules:
                          - `cos(0) = 1`
                          - `cos(t + (-t)) = cos(t)cos(-t) - sin(t)sin(-t) = cos(t)^2 + sin(t)^2`

                          Applying this for `t = x` and `t = y`, we get
                          - `1 = cos(x)^2 + sin(x)^2`
                          - `1 = cos(y)^2 + sin(y)^2`

                          Now rewrite the right-hand side:
                          \[
                          \cos(x)^2-\sin(y)^2
                          = \cos(x)^2 - \sin(y)^2(\cos(x)^2+\sin(x)^2)
                          = \cos(x)^2(\cos(y)^2+\sin(y)^2) - \sin(y)^2(\cos(x)^2+\sin(x)^2)
                          \]
                          which simplifies polynomially to
                          \[
                          \cos(x)^2\cos(y)^2-\sin(x)^2\sin(y)^2.
                          \]

