            - Use only the rule names listed below.
            - Do not invent algebraic macro-rules.
            - Do not mention unsupported shortcuts such as "difference of squares" or
              "Pythagorean substitution".
            - Arithmetic simplification is allowed implicitly by the checker, but every
              trigonometric fact must come from the listed rules or from previous steps.

            ## Available rules

            ```
            - cos_zero: `cos(0) = 1`
            - sin_zero: `sin(0) = 0`
            - sin_halfpi: `sin(pi/2) = 1`
            - cos_halfpi: `cos(pi/2) = 0`
            - sin_neg: `sin(-x) = -sin(x)`
            - cos_neg: `cos(-x) = cos(x)`
            - cos_add: `cos(x + y) = cos(x)*cos(y) - sin(x)*sin(y)`
            - sin_add: `sin(x + y) = sin(x)*cos(y) + cos(x)*sin(y)`
            ```

            ## Output format

            Return a numbered list inside a code block.
            Each item must name an allowed move and the local goal.
            Keep it concise.

            Example:

            ```
            1. rule:sin_add vars:{x:"a", y:"b"} goal: expand sin(a+b)
            2. rule:sin_halfpi goal: simplify sin(pi/2)
            3. rule:cos_halfpi goal: simplify cos(pi/2)
            4. trans:[1,2,3] goal: conclude the target equality
            ```
        - role: user
          content: |-
            Sketch a verifier-compatible proof plan for:

            `cos(pi/3) = sin(pi/6)`
