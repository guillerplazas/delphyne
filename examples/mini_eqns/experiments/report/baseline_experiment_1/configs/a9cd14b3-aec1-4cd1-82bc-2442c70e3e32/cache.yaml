              ```yaml
              1:
                - ["cos(pi/3)", "cos(pi/2)*cos(-pi/6) - sin(pi/2)*sin(-pi/6)"]
                - {rule: cos_add, vars: {x: "pi/2", y: "-pi/6"}}
              2:
                - ["cos(pi/2)*cos(-pi/6) - sin(pi/2)*sin(-pi/6)", "-sin(pi/2)*sin(-pi/6)"]
                - {rule: cos_halfpi, vars: {}}
              3:
                - ["-sin(pi/2)*sin(-pi/6)", "-sin(-pi/6)"]
                - {rule: sin_halfpi, vars: {}}
              4:
                - ["-sin(-pi/6)", "sin(pi/6)"]
                - {rule: sin_neg, vars: {x: "pi/6"}}
              5:
                - ["cos(pi/3)", "sin(pi/6)"]
                - {trans: [1, 2, 3, 4]}
              ```
        - role: user
          content: 'Prove the following equality: `2*sin(x/2)*cos(x/2) = sin(x)`.'
        - role: assistant
          answer:
            mode: null
            content: |-
              It is easier to start with the right-hand side here:

              ```
              sin(x)
              = sin(x/2+x/2)
              = sin(x/2)*cos(x/2) + cos(x/2)*sin(x/2)
              = 2*sin(x/2)*cos(x/2)
              ```

              The first and last steps are just elementary simplifications so the only real rule to apply here is `sin_add`.

              ```yaml
              1:
                - ["sin(x)", "2*sin(x/2)*cos(x/2)"]
                - {rule: sin_add, vars: {x: "x/2", y: "x/2"}}
              2:
                - ["2*sin(x/2)*cos(x/2)", "sin(x)"]
                - {sym: 1}
              ```
        - role: user
          content: 'Prove the following equality: `sin(3*x) = 3*sin(x) - 4*sin(x)**3`.'
      options:
        model: gpt-5.4
        temperature: 1.0
    iter: 1
  output:
    outputs:
      - content: |-
          Use angle addition twice.

          First expand:
          - `sin(3*x) = sin(2*x + x)`
          - `= sin(2*x)cos(x) + cos(2*x)sin(x)`

          Then expand:
          - `sin(2*x) = sin(x+x) = 2*sin(x)cos(x)`
          - `cos(2*x) = cos(x+x) = cos(x)**2 - sin(x)**2`

          Substituting:
          - `sin(3*x) = 2*sin(x)cos(x)**2 + (cos(x)**2 - sin(x)**2)sin(x)`
          - `= 3*sin(x)cos(x)**2 - sin(x)**3`

          Using `cos(x)**2 = 1 - sin(x)**2`, this becomes
          - `sin(3*x) = 3*sin(x) - 4*sin(x)**3`.

          But this last identity is not derivable from the allowed rules, because we do not have the Pythagorean identity `sin(x)**2 + cos(x)**2 = 1` among the permitted rewriting rules. Therefore this equality cannot be proved from the given rule set alone.
