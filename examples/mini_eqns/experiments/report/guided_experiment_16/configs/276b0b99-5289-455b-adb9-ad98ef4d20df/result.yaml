                          \[
                          \sin(\pi)=\sin\left(\frac{\pi}{2}+\frac{\pi}{2}\right)
                          =\sin(\pi/2)\cos(\pi/2)+\cos(\pi/2)\sin(\pi/2)
                          =0+0=0.
                          \]

