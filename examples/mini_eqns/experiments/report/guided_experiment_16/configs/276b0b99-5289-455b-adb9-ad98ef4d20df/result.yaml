                          \[
                          \cos(\pi)=\cos\left(\frac{\pi}{2}+\frac{\pi}{2}\right)
                          =\cos(\pi/2)\cos(\pi/2)-\sin(\pi/2)\sin(\pi/2)
                          =0-1=-1.
                          \]

