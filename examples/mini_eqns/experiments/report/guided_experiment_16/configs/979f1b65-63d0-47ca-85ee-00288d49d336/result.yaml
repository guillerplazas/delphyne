              - `cos(t - t) = 1` by `cos_zero`
              - also `cos(t - t) = cos(t)*cos(-t) - sin(t)*sin(-t) = cos(t)**2 + sin(t)**2`

              Hence `1 = cos(t)**2 + sin(t)**2`. We use this for `t = x` and `t = y`.

              Then the right-hand side becomes
              `cos(x)**2 - sin(y)**2
               = cos(x)**2*(cos(y)**2 + sin(y)**2) - sin(y)**2*(cos(x)**2 + sin(x)**2)`
              which simplifies algebraically to
              `cos(x)**2*cos(y)**2 - sin(x)**2*sin(y)**2`.

