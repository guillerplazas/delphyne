                          \ = c*cy + s*sy`,\n  by `cos_neg` and `sin_neg`.\n\nSo\n`cos(x + y)*cos(x -\
                          \ y) = (c*cy - s*sy)(c*cy + s*sy) = c**2*cy**2 - s**2*sy**2`.\n\nNow derive\
                          \ the Pythagorean identities from the allowed rules.  \nFrom `cos(0) = 1` and\n\
                          `cos(y + (-y)) = cos(y)cos(-y) - sin(y)sin(-y)`,\ntogether with `cos(-y)=cos(y)`\
                          \ and `sin(-y)=-sin(y)`, we get\n`cos(y)**2 + sin(y)**2 = 1`.\n\nSimilarly,\
                          \ using `x + (-x)`, we get\n`cos(x)**2 + sin(x)**2 = 1`.\n\nThen\n`c**2*cy**2\
                          \ - s**2*sy**2\n = c**2*(1 - sy**2) - s**2*sy**2\n = c**2 - (c**2 + s**2)*sy**2\n\
                          \ = c**2 - sy**2`.\n\nHence\n`cos(x + y)*cos(x - y) = cos(x)**2 - sin(y)**2`.\n\
