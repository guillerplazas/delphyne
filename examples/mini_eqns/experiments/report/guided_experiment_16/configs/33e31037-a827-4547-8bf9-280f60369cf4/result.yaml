                  prefix:
                    - kind: oracle
                      answer:
                        mode: null
                        content: |-
                          Use the addition formulas on both sine factors.

                          First,
                          - `sin(x + y) = sin(x)*cos(y) + cos(x)*sin(y)`.
                          - `sin(y - x) = sin(y + (-x)) = sin(y)*cos(-x) + cos(y)*sin(-x) = sin(y)*cos(x) - cos(y)*sin(x)`.

                          So
                          `sin(x + y)*sin(y - x)` becomes
                          `(sin(x)*cos(y) + cos(x)*sin(y))*(sin(y)*cos(x) - cos(y)*sin(x))`,
                          which simplifies to
                          `cos(x)**2*sin(y)**2 - sin(x)**2*cos(y)**2`.

                          Now we need the Pythagorean identity. Since only the basic rules are allowed, we derive it from the addition formulas:
                          - `cos(pi/2 - t) = sin(t)`
                          - `sin(pi/2 - t) = cos(t)`

                          Hence
                          `1 = sin(pi/2) = sin(t + (pi/2 - t))
                          = sin(t)*cos(pi/2 - t) + cos(t)*sin(pi/2 - t)
                          = sin(t)**2 + cos(t)**2`.

                          Applying this for `t = x` and `t = y`, we get
                          `1 = sin(x)**2 + cos(x)**2` and `1 = sin(y)**2 + cos(y)**2`.

                          Therefore
                          `cos(x)**2 - cos(y)**2
                          = cos(x)**2*(sin(y)**2 + cos(y)**2) - cos(y)**2*(sin(x)**2 + cos(x)**2)
                          = cos(x)**2*sin(y)**2 - sin(x)**2*cos(y)**2`.

                          So both sides are equal to the same expression, proving the identity.

