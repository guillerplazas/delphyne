                - ["2*sin(x/2)*cos(x/2)", "sin(x)"]
                - {sym: 1}
              ```
        - role: user
          content: 'Prove the following equality: `sin(x + y)*sin(y - x) = cos(x)**2 - cos(y)**2`.'
