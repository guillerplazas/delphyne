# Demonstrations for the guided interactive strategy

- strategy: prove_equality_guided
  args:
    equality: ["cos(pi/3)", "sin(pi/6)"]
  tests:
    - run | success
  queries:
    - query: ProveEqualityGuided
      args:
        equality: ["cos(pi/3)", "sin(pi/6)"]
        prefix: []
      answers:
        - answer: |
            A good pattern here is subtraction via addition plus negation:

            ```
            cos(pi/3)
            = cos(pi/2 + (-pi/6))
            = cos(pi/2)*cos(-pi/6) - sin(pi/2)*sin(-pi/6)
            = -sin(-pi/6)
            = sin(pi/6)
            ```

            The first and last equalities use only arithmetic simplification, while the trigonometric work is done by `cos_add`, `cos_halfpi`, `sin_halfpi`, and `sin_neg`.

            ```yaml
            1:
              - ["cos(pi/3)", "cos(pi/2)*cos(-pi/6) - sin(pi/2)*sin(-pi/6)"]
              - {rule: cos_add, vars: {x: "pi/2", y: "-pi/6"}}
            2:
              - ["cos(pi/2)*cos(-pi/6) - sin(pi/2)*sin(-pi/6)", "-sin(pi/2)*sin(-pi/6)"]
              - {rule: cos_halfpi, vars: {}}
            3:
              - ["-sin(pi/2)*sin(-pi/6)", "-sin(-pi/6)"]
              - {rule: sin_halfpi, vars: {}}
            4:
              - ["-sin(-pi/6)", "sin(pi/6)"]
              - {rule: sin_neg, vars: {x: "pi/6"}}
            5:
              - ["cos(pi/3)", "sin(pi/6)"]
              - {trans: [1, 2, 3, 4]}
            ```

- query: ProveEqualityGuided
  args:
    equality: ["cos(pi/3)", "sin(pi/6)"]
    prefix:
      - kind: oracle
        answer:
          mode: null
          content: |
            Let me just propose a simple proof:

            ```yaml
            1:
              - ["cos(pi/3)", "sin(pi/6)"]
              - {rule: cos_halfpi, vars: {}}
            ```
      - kind: feedback
        label: feedback
        meta: "Error at step 1: Rule application failed. Obtained: '0' instead of the expected right-hand side."
  answers:
    - answer: |
        The checker says the selected rule rewrote the left-hand side to `0`, so the fix is to use the subtraction-via-addition pattern instead of `cos_halfpi` directly.

        ```yaml
        1:
          - ["cos(pi/3)", "cos(pi/2)*cos(-pi/6) - sin(pi/2)*sin(-pi/6)"]
          - {rule: cos_add, vars: {x: "pi/2", y: "-pi/6"}}
        2:
          - ["cos(pi/2)*cos(-pi/6) - sin(pi/2)*sin(-pi/6)", "-sin(pi/2)*sin(-pi/6)"]
          - {rule: cos_halfpi, vars: {}}
        3:
          - ["-sin(pi/2)*sin(-pi/6)", "-sin(-pi/6)"]
          - {rule: sin_halfpi, vars: {}}
        4:
          - ["-sin(-pi/6)", "sin(pi/6)"]
          - {rule: sin_neg, vars: {x: "pi/6"}}
        5:
          - ["cos(pi/3)", "sin(pi/6)"]
          - {trans: [1, 2, 3, 4]}
        ```

- strategy: prove_equality_guided
  args:
    equality: ["sin(2*x)", "2*sin(x)*cos(x)"]
  tests:
    - run | success
  queries:
    - query: ProveEqualityGuided
      args:
        equality: ["sin(2*x)", "2*sin(x)*cos(x)"]
        prefix: []
      answers:
        - answer: |
            This is the double-angle pattern: expand `sin(2*x)` as `sin(x + x)` and let the checker simplify the resulting polynomial expression.

            ```yaml
            1:
              - ["sin(2*x)", "2*sin(x)*cos(x)"]
              - {rule: sin_add, vars: {x: "x", y: "x"}}
            ```

- query: ProveEqualityGuided
  args:
    equality: ["sin(2*x)", "2*sin(x)*cos(x)"]
    prefix:
      - kind: oracle
        answer:
          mode: null
          content: |
            I will use the double-angle pattern, but my notation is sloppy:

            ```yaml
            1:
              - ["sin(2*x)", "2*sin(x)*cos(x)"]
              - {rule: sin_add, vars: {x: "[x]", y: "x"}}
            ```
      - kind: feedback
        label: feedback
        meta: "Error at step 1: Invalid term syntax: '[x]'. Use standard mathematical notation like 'sin(x)' and '**' for exponentiation."
  answers:
    - answer: |
        The fix is purely syntactic: replace bracket notation with ordinary Python-style expressions.

        ```yaml
        1:
          - ["sin(2*x)", "2*sin(x)*cos(x)"]
          - {rule: sin_add, vars: {x: "x", y: "x"}}
        ```
