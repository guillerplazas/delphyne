# Demonstrations for the sketch-guided step-by-step strategy
# NOTE: demo problems must NOT appear in the benchmark (htps.txt).

- strategy: prove_step_by_step
  args:
    equality: ["cos(pi/2 + x)", "-sin(x)"]
  tests:
    - run | success

  queries:
    # Phase 1: Sketch generation
    - query: GenerateProofSketch
      args:
        equality: ["cos(pi/2 + x)", "-sin(x)"]
      answers:
        - answer: |
            ```
            1. rule:cos_add vars:{x:"pi/2", y:"x"} → cos(pi/2)*cos(x) - sin(pi/2)*sin(x)
            2. rule:cos_halfpi → -sin(pi/2)*sin(x)
            3. rule:sin_halfpi → -sin(x)
            4. trans:[1,2,3] → cos(pi/2 + x) = -sin(x)
            ```

    # Phase 2: Step 1 (empty partial proof)
    - query: ProposeNextStep
      args:
        equality: ["cos(pi/2 + x)", "-sin(x)"]
        sketch: |
          1. rule:cos_add vars:{x:"pi/2", y:"x"} → cos(pi/2)*cos(x) - sin(pi/2)*sin(x)
          2. rule:cos_halfpi → -sin(pi/2)*sin(x)
          3. rule:sin_halfpi → -sin(x)
          4. trans:[1,2,3] → cos(pi/2 + x) = -sin(x)
        partial_proof: {}
        current_sub_goal: null
        prefix: []
      answers:
        - answer: |
            ```yaml
            1:
              - ["cos(pi/2 + x)", "cos(pi/2)*cos(x) - sin(pi/2)*sin(x)"]
              - {rule: cos_add, vars: {x: "pi/2", y: "x"}}
            ```

    # Step 2
    - query: ProposeNextStep
      args:
        equality: ["cos(pi/2 + x)", "-sin(x)"]
        sketch: |
          1. rule:cos_add vars:{x:"pi/2", y:"x"} → cos(pi/2)*cos(x) - sin(pi/2)*sin(x)
          2. rule:cos_halfpi → -sin(pi/2)*sin(x)
          3. rule:sin_halfpi → -sin(x)
          4. trans:[1,2,3] → cos(pi/2 + x) = -sin(x)
        partial_proof:
          1:
            - ["cos(pi/2 + x)", "cos(pi/2)*cos(x) - sin(pi/2)*sin(x)"]
            - {rule: cos_add, vars: {x: "pi/2", y: "x"}}
        current_sub_goal: null
        prefix: []
      answers:
        - answer: |
            ```yaml
            2:
              - ["cos(pi/2)*cos(x) - sin(pi/2)*sin(x)", "-sin(pi/2)*sin(x)"]
              - {rule: cos_halfpi, vars: {}}
            ```

    # Step 3
    - query: ProposeNextStep
      args:
        equality: ["cos(pi/2 + x)", "-sin(x)"]
        sketch: |
          1. rule:cos_add vars:{x:"pi/2", y:"x"} → cos(pi/2)*cos(x) - sin(pi/2)*sin(x)
          2. rule:cos_halfpi → -sin(pi/2)*sin(x)
          3. rule:sin_halfpi → -sin(x)
          4. trans:[1,2,3] → cos(pi/2 + x) = -sin(x)
        partial_proof:
          1:
            - ["cos(pi/2 + x)", "cos(pi/2)*cos(x) - sin(pi/2)*sin(x)"]
            - {rule: cos_add, vars: {x: "pi/2", y: "x"}}
          2:
            - ["cos(pi/2)*cos(x) - sin(pi/2)*sin(x)", "-sin(pi/2)*sin(x)"]
            - {rule: cos_halfpi, vars: {}}
        current_sub_goal: null
        prefix: []
      answers:
        - answer: |
            ```yaml
            3:
              - ["-sin(pi/2)*sin(x)", "-sin(x)"]
              - {rule: sin_halfpi, vars: {}}
            ```

    # Step 4: trans completes the proof
    - query: ProposeNextStep
      args:
        equality: ["cos(pi/2 + x)", "-sin(x)"]
        sketch: |
          1. rule:cos_add vars:{x:"pi/2", y:"x"} → cos(pi/2)*cos(x) - sin(pi/2)*sin(x)
          2. rule:cos_halfpi → -sin(pi/2)*sin(x)
          3. rule:sin_halfpi → -sin(x)
          4. trans:[1,2,3] → cos(pi/2 + x) = -sin(x)
        partial_proof:
          1:
            - ["cos(pi/2 + x)", "cos(pi/2)*cos(x) - sin(pi/2)*sin(x)"]
            - {rule: cos_add, vars: {x: "pi/2", y: "x"}}
          2:
            - ["cos(pi/2)*cos(x) - sin(pi/2)*sin(x)", "-sin(pi/2)*sin(x)"]
            - {rule: cos_halfpi, vars: {}}
          3:
            - ["-sin(pi/2)*sin(x)", "-sin(x)"]
            - {rule: sin_halfpi, vars: {}}
        current_sub_goal: null
        prefix: []
      answers:
        - answer: |
            ```yaml
            4:
              - ["cos(pi/2 + x)", "-sin(x)"]
              - {trans: [1, 2, 3]}
            ```


- strategy: prove_step_by_step
  args:
    equality: ["sin(x)*cos(y) + cos(x)*sin(y)", "sin(x + y)"]
  tests:
    - run | success
  queries:
    - query: GenerateProofSketch
      args:
        equality: ["sin(x)*cos(y) + cos(x)*sin(y)", "sin(x + y)"]
      answers:
        - answer: |
            ```
            1. rule:sin_add vars:{x:"x", y:"y"} → sin(x)*cos(y) + cos(x)*sin(y)
            2. sym:[1] → sin(x)*cos(y) + cos(x)*sin(y) = sin(x + y)
            ```
    - query: ProposeNextStep
      args:
        equality: ["sin(x)*cos(y) + cos(x)*sin(y)", "sin(x + y)"]
        sketch: |
          1. rule:sin_add vars:{x:"x", y:"y"} → sin(x)*cos(y) + cos(x)*sin(y)
          2. sym:[1] → sin(x)*cos(y) + cos(x)*sin(y) = sin(x + y)
        partial_proof: {}
        current_sub_goal: null
        prefix: []
      answers:
        - answer: |
            ```yaml
            1:
              - ["sin(x + y)", "sin(x)*cos(y) + cos(x)*sin(y)"]
              - {rule: sin_add, vars: {x: "x", y: "y"}}
            ```
    - query: ProposeNextStep
      args:
        equality: ["sin(x)*cos(y) + cos(x)*sin(y)", "sin(x + y)"]
        sketch: |
          1. rule:sin_add vars:{x:"x", y:"y"} → sin(x)*cos(y) + cos(x)*sin(y)
          2. sym:[1] → sin(x)*cos(y) + cos(x)*sin(y) = sin(x + y)
        partial_proof:
          1:
            - ["sin(x + y)", "sin(x)*cos(y) + cos(x)*sin(y)"]
            - {rule: sin_add, vars: {x: "x", y: "y"}}
        current_sub_goal: null
        prefix: []
      answers:
        - answer: |
            ```yaml
            2:
              - ["sin(x)*cos(y) + cos(x)*sin(y)", "sin(x + y)"]
              - {sym: 1}
            ```


# Example with indirect sub-lemma technique (non-benchmark problem):
# prove cos(0) = cos(x)**2 + sin(x)**2, derive sin(x)**2 = cos(0) - cos(x)**2,
# then substitute the sin(x)**2 atom and finalize with cos_zero.
- strategy: prove_step_by_step
  args:
    equality: ["cos(x)**2 - sin(x)**2", "2*cos(x)**2 - 1"]
  tests:
    - run | success

  queries:
    - query: GenerateProofSketch
      args:
        equality: ["cos(x)**2 - sin(x)**2", "2*cos(x)**2 - 1"]
      answers:
        - answer: |
            ```
            1. rule:cos_add vars:{x:"x", y:"-x"} → cos(x)*cos(-x) - sin(x)*sin(-x)
            2. rule:cos_neg vars:{x:"x"} → cos(x)**2 - sin(x)*sin(-x)
            3. rule:sin_neg vars:{x:"x"} → cos(x)**2 + sin(x)**2
            4. trans:[1,2,3] → cos(0) = cos(x)**2 + sin(x)**2
            5. step:[4] → cos(0) - cos(x)**2 = sin(x)**2
            6. sym:[5] → sin(x)**2 = cos(0) - cos(x)**2
            7. step:[6] → 2*cos(x)**2 - cos(0)
            8. rule:cos_zero → 2*cos(x)**2 - 1
            9. trans:[7,8] → cos(x)**2 - sin(x)**2 = 2*cos(x)**2 - 1
            ```

    - query: ProposeNextStep
      args:
        equality: ["cos(x)**2 - sin(x)**2", "2*cos(x)**2 - 1"]
        sketch: |
          1. rule:cos_add vars:{x:"x", y:"-x"} → cos(x)*cos(-x) - sin(x)*sin(-x)
          2. rule:cos_neg vars:{x:"x"} → cos(x)**2 - sin(x)*sin(-x)
          3. rule:sin_neg vars:{x:"x"} → cos(x)**2 + sin(x)**2
          4. trans:[1,2,3] → cos(0) = cos(x)**2 + sin(x)**2
          5. step:[4] → cos(0) - cos(x)**2 = sin(x)**2
          6. sym:[5] → sin(x)**2 = cos(0) - cos(x)**2
          7. step:[6] → 2*cos(x)**2 - cos(0)
          8. rule:cos_zero → 2*cos(x)**2 - 1
          9. trans:[7,8] → cos(x)**2 - sin(x)**2 = 2*cos(x)**2 - 1
        partial_proof: {}
        current_sub_goal: "cos(0) = cos(x)**2 + sin(x)**2"
        prefix: []
      answers:
        - answer: |
            ```yaml
            1:
              - ["cos(0)", "cos(x)*cos(-x) - sin(x)*sin(-x)"]
              - {rule: cos_add, vars: {x: "x", y: "-x"}}
            ```

    - query: ProposeNextStep
      args:
        equality: ["cos(x)**2 - sin(x)**2", "2*cos(x)**2 - 1"]
        sketch: |
          1. rule:cos_add vars:{x:"x", y:"-x"} → cos(x)*cos(-x) - sin(x)*sin(-x)
          2. rule:cos_neg vars:{x:"x"} → cos(x)**2 - sin(x)*sin(-x)
          3. rule:sin_neg vars:{x:"x"} → cos(x)**2 + sin(x)**2
          4. trans:[1,2,3] → cos(0) = cos(x)**2 + sin(x)**2
          5. step:[4] → cos(0) - cos(x)**2 = sin(x)**2
          6. sym:[5] → sin(x)**2 = cos(0) - cos(x)**2
          7. step:[6] → 2*cos(x)**2 - cos(0)
          8. rule:cos_zero → 2*cos(x)**2 - 1
          9. trans:[7,8] → cos(x)**2 - sin(x)**2 = 2*cos(x)**2 - 1
        partial_proof:
          1:
            - ["cos(0)", "cos(x)*cos(-x) - sin(x)*sin(-x)"]
            - {rule: cos_add, vars: {x: "x", y: "-x"}}
        current_sub_goal: "cos(0) = cos(x)**2 + sin(x)**2"
        prefix: []
      answers:
        - answer: |
            ```yaml
            2:
              - ["cos(x)*cos(-x) - sin(x)*sin(-x)", "cos(x)**2 - sin(x)*sin(-x)"]
              - {rule: cos_neg, vars: {x: "x"}}
            ```

    - query: ProposeNextStep
      args:
        equality: ["cos(x)**2 - sin(x)**2", "2*cos(x)**2 - 1"]
        sketch: |
          1. rule:cos_add vars:{x:"x", y:"-x"} → cos(x)*cos(-x) - sin(x)*sin(-x)
          2. rule:cos_neg vars:{x:"x"} → cos(x)**2 - sin(x)*sin(-x)
          3. rule:sin_neg vars:{x:"x"} → cos(x)**2 + sin(x)**2
          4. trans:[1,2,3] → cos(0) = cos(x)**2 + sin(x)**2
          5. step:[4] → cos(0) - cos(x)**2 = sin(x)**2
          6. sym:[5] → sin(x)**2 = cos(0) - cos(x)**2
          7. step:[6] → 2*cos(x)**2 - cos(0)
          8. rule:cos_zero → 2*cos(x)**2 - 1
          9. trans:[7,8] → cos(x)**2 - sin(x)**2 = 2*cos(x)**2 - 1
        partial_proof:
          1:
            - ["cos(0)", "cos(x)*cos(-x) - sin(x)*sin(-x)"]
            - {rule: cos_add, vars: {x: "x", y: "-x"}}
          2:
            - ["cos(x)*cos(-x) - sin(x)*sin(-x)", "cos(x)**2 - sin(x)*sin(-x)"]
            - {rule: cos_neg, vars: {x: "x"}}
        current_sub_goal: "cos(0) = cos(x)**2 + sin(x)**2"
        prefix: []
      answers:
        - answer: |
            ```yaml
            3:
              - ["cos(x)**2 - sin(x)*sin(-x)", "cos(x)**2 + sin(x)**2"]
              - {rule: sin_neg, vars: {x: "x"}}
            ```

    - query: ProposeNextStep
      args:
        equality: ["cos(x)**2 - sin(x)**2", "2*cos(x)**2 - 1"]
        sketch: |
          1. rule:cos_add vars:{x:"x", y:"-x"} → cos(x)*cos(-x) - sin(x)*sin(-x)
          2. rule:cos_neg vars:{x:"x"} → cos(x)**2 - sin(x)*sin(-x)
          3. rule:sin_neg vars:{x:"x"} → cos(x)**2 + sin(x)**2
          4. trans:[1,2,3] → cos(0) = cos(x)**2 + sin(x)**2
          5. step:[4] → cos(0) - cos(x)**2 = sin(x)**2
          6. sym:[5] → sin(x)**2 = cos(0) - cos(x)**2
          7. step:[6] → 2*cos(x)**2 - cos(0)
          8. rule:cos_zero → 2*cos(x)**2 - 1
          9. trans:[7,8] → cos(x)**2 - sin(x)**2 = 2*cos(x)**2 - 1
        partial_proof:
          1:
            - ["cos(0)", "cos(x)*cos(-x) - sin(x)*sin(-x)"]
            - {rule: cos_add, vars: {x: "x", y: "-x"}}
          2:
            - ["cos(x)*cos(-x) - sin(x)*sin(-x)", "cos(x)**2 - sin(x)*sin(-x)"]
            - {rule: cos_neg, vars: {x: "x"}}
          3:
            - ["cos(x)**2 - sin(x)*sin(-x)", "cos(x)**2 + sin(x)**2"]
            - {rule: sin_neg, vars: {x: "x"}}
        current_sub_goal: "cos(0) = cos(x)**2 + sin(x)**2"
        prefix: []
      answers:
        - answer: |
            ```yaml
            4:
              - ["cos(0)", "cos(x)**2 + sin(x)**2"]
              - {trans: [1, 2, 3]}
            ```

    # Step 5: apply step 4 (cos(0) = cos(x)**2+sin(x)**2) to "cos(0) - cos(x)**2":
    # substitutes cos(0) atom → cos(x)**2+sin(x)**2, giving sin(x)**2.
    - query: ProposeNextStep
      args:
        equality: ["cos(x)**2 - sin(x)**2", "2*cos(x)**2 - 1"]
