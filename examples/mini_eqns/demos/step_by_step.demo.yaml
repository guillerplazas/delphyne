# Demonstrations for the draft-and-repair strategy
# NOTE: demo problems must NOT appear in the benchmark (htps.txt).
#
# The three demonstrations cover the three code paths of the strategy:
# 1. The draft verifies outright (zero repair calls).
# 2. A draft step fails verification and is repaired.
# 3. The draft is exhausted before the proof is complete (extension).

# Demo 1: the draft verifies outright. The only LLM call is the draft.
- strategy: prove_step_by_step
  args:
    equality: ["sin(x)*cos(y) + cos(x)*sin(y)", "sin(x + y)"]
  tests:
    - run | success

  queries:
    - query: GenerateProofDraft
      args:
        equality: ["sin(x)*cos(y) + cos(x)*sin(y)", "sin(x + y)"]
        prefix: []
      answers:
        - answer: |
            ```yaml
            1:
              - ["sin(x + y)", "sin(x)*cos(y) + cos(x)*sin(y)"]
              - {rule: sin_add, vars: {x: "x", y: "y"}}
            2:
              - ["sin(x)*cos(y) + cos(x)*sin(y)", "sin(x + y)"]
              - {sym: 1}
            ```

# Demo 2: draft step 2 cites the wrong rule (sin_halfpi instead of
# cos_halfpi). Steps 1, 3 and 4 replay for free; only step 2 needs one
# repair call.
- strategy: prove_step_by_step
  args:
    equality: ["cos(pi/2 + x)", "-sin(x)"]
  tests:
    - run | success

  queries:
    - query: GenerateProofDraft
      args:
        equality: ["cos(pi/2 + x)", "-sin(x)"]
        prefix: []
      answers:
        - answer: |
            ```yaml
            1:
              - ["cos(pi/2 + x)", "cos(pi/2)*cos(x) - sin(pi/2)*sin(x)"]
              - {rule: cos_add, vars: {x: "pi/2", y: "x"}}
            2:
              - ["cos(pi/2)*cos(x) - sin(pi/2)*sin(x)", "-sin(pi/2)*sin(x)"]
              - {rule: sin_halfpi, vars: {}}
            3:
              - ["-sin(pi/2)*sin(x)", "-sin(x)"]
              - {rule: sin_halfpi, vars: {}}
            4:
              - ["cos(pi/2 + x)", "-sin(x)"]
              - {trans: [1, 2, 3]}
            ```

    - query: RepairProofStep
      args:
        equality: ["cos(pi/2 + x)", "-sin(x)"]
        draft:
          1:
            - ["cos(pi/2 + x)", "cos(pi/2)*cos(x) - sin(pi/2)*sin(x)"]
            - {rule: cos_add, vars: {x: "pi/2", y: "x"}}
          2:
            - ["cos(pi/2)*cos(x) - sin(pi/2)*sin(x)", "-sin(pi/2)*sin(x)"]
            - {rule: sin_halfpi, vars: {}}
          3:
            - ["-sin(pi/2)*sin(x)", "-sin(x)"]
            - {rule: sin_halfpi, vars: {}}
          4:
            - ["cos(pi/2 + x)", "-sin(x)"]
            - {trans: [1, 2, 3]}
        verified_proof:
          1:
            - ["cos(pi/2 + x)", "cos(pi/2)*cos(x) - sin(pi/2)*sin(x)"]
            - {rule: cos_add, vars: {x: "pi/2", y: "x"}}
        step_id: 2
        failed_step:
          - ["cos(pi/2)*cos(x) - sin(pi/2)*sin(x)", "-sin(pi/2)*sin(x)"]
          - {rule: sin_halfpi, vars: {}}
        error: "Error at step 2: Rule application failed. Obtained: '-sin(x) + cos(pi/2)*cos(x)' instead of the expected right-hand side."
        prefix: []
      answers:
        - answer: |
            ```yaml
            2:
              - ["cos(pi/2)*cos(x) - sin(pi/2)*sin(x)", "-sin(pi/2)*sin(x)"]
              - {rule: cos_halfpi, vars: {}}
            ```

# Demo 3: the draft is correct but stops before the closing trans step.
# All three draft steps replay for free; the repair model is then asked
# to extend the proof with the final step.
- strategy: prove_step_by_step
  args:
    equality: ["cos(pi/2 + x)", "-sin(x)"]
  tests:
    - run | success

  queries:
    - query: GenerateProofDraft
      args:
        equality: ["cos(pi/2 + x)", "-sin(x)"]
        prefix: []
      answers:
        - answer: |
            ```yaml
            1:
              - ["cos(pi/2 + x)", "cos(pi/2)*cos(x) - sin(pi/2)*sin(x)"]
              - {rule: cos_add, vars: {x: "pi/2", y: "x"}}
            2:
              - ["cos(pi/2)*cos(x) - sin(pi/2)*sin(x)", "-sin(pi/2)*sin(x)"]
              - {rule: cos_halfpi, vars: {}}
            3:
              - ["-sin(pi/2)*sin(x)", "-sin(x)"]
              - {rule: sin_halfpi, vars: {}}
            ```

    - query: RepairProofStep
      args:
        equality: ["cos(pi/2 + x)", "-sin(x)"]
        draft:
          1:
            - ["cos(pi/2 + x)", "cos(pi/2)*cos(x) - sin(pi/2)*sin(x)"]
            - {rule: cos_add, vars: {x: "pi/2", y: "x"}}
          2:
            - ["cos(pi/2)*cos(x) - sin(pi/2)*sin(x)", "-sin(pi/2)*sin(x)"]
            - {rule: cos_halfpi, vars: {}}
          3:
            - ["-sin(pi/2)*sin(x)", "-sin(x)"]
            - {rule: sin_halfpi, vars: {}}
        verified_proof:
          1:
            - ["cos(pi/2 + x)", "cos(pi/2)*cos(x) - sin(pi/2)*sin(x)"]
            - {rule: cos_add, vars: {x: "pi/2", y: "x"}}
          2:
            - ["cos(pi/2)*cos(x) - sin(pi/2)*sin(x)", "-sin(pi/2)*sin(x)"]
            - {rule: cos_halfpi, vars: {}}
          3:
            - ["-sin(pi/2)*sin(x)", "-sin(x)"]
            - {rule: sin_halfpi, vars: {}}
        step_id: 4
        failed_step: null
        error: "The draft is exhausted but the proof does not end with the target equality yet."
        prefix: []
      answers:
        - answer: |
            ```yaml
            4:
              - ["cos(pi/2 + x)", "-sin(x)"]
              - {trans: [1, 2, 3]}
            ```
