    current_book: '### pitfalls

      - [rocq-00001] When `Hf : forall x, f x = polynomial x` and `Hx : f x <= 0`,
      use `rewrite Hf in Hx` to expose the polynomial before invoking `nra`; merely
      specializing `Hf` does not connect it to `Hx`.


      - [rocq-00005] When applying a recurrence hypothesis whose predecessor uses
      truncated subtraction, first prove the exact natural-number equality (for example,
      `((2 * S k + 1) - 2)%nat = 2 * k + 1` by `simpl; lia`), then rewrite with that
      equality before applying the hypothesis so its indices unify.


      - [rocq-00006] Under an active `R_scope`, annotate natural-number indices,
      arithmetic, and order conditions with `%nat` (for example, `(1 < n)%nat`);
      reserve `INR` and unannotated arithmetic for real-valued conclusions to avoid
      coercion and comparison-type errors.


      - [rocq-00010] Do not obtain a successor product bound by multiplying an induction
      hypothesis such as `prod_n a (S n) <= 1` by an arbitrary nonnegative factor:
      that factor may exceed `1`. An induction proof must retain a bound parameterized
      by the total sum or average.


      - [rocq-00016] For real equations involving a single reciprocal `1 / x`, after
      proving `x <> 0`, multiply explicitly by `x` and expose the inverse identity
      with `unfold Rdiv` and `assert (x * / x = 1) by exact (Rinv_r x Hx)`; then
      use `ring` and `nra` on the resulting polynomial equation instead of relying
      on `field_simplify` to normalize it.


      - [rocq-00018] For bounded natural searches involving `Nat.lcm` or `Nat.gcd`,
      avoid broad `vm_compute`, `compute`, or `simpl [Nat.gcd]`, since recursive
      evaluation can stack-overflow; reduce only explicitly closed numeral cases,
      using `change` to expose a known numeral equality when needed.


      - [rocq-00025] A closed cast such as `INR 4` is not necessarily definitionally
      convertible to `(4 : R)`, so `change` may fail. First prove an explicit equality,
      for example with `cbv [INR]; ring`, and rewrite with that equality before applying
      real arithmetic.



      ### tactics

      - [rocq-00002] For an induction hypothesis relating recursive `sum_f` expressions,
      if `rewrite IH` fails after `simpl`, use `change` to expose the successor case
      explicitly as `sum_f ... n + f n = sum_f ... n + g n + S n`; then apply `rewrite
      IH; lia`.


      - [rocq-00003] For goals over `nat` with hypotheses such as `(n - 1) * n *
      (n + 1) = k` and a successor or exact-value conclusion, use `intros` followed
      by `nia`; it can handle the nonlinear products and truncated subtraction directly.


      - [rocq-00004] For closed `nat` equalities built from executable finite-list
      operations such as `seq`, `filter`, boolean predicates, and `fold_right`, try
      `vm_compute`; use `reflexivity` afterward if the resulting definitional equality
      is not closed automatically.


      - [rocq-00011] Before using `nra` in AM-GM base or successor cases, unfold
      or rewrite the relevant `sum_n` and `prod_n` expressions, including base cases
      such as `sum_n a 0` and `prod_n a 1`, and prove any required `INR n <> 0` denominator
      condition; `nra` cannot reason through opaque recursive definitions or supply
      the global inequality.


      - [rocq-00012] For a real goal `0 <= t^2` where `Rle_0_sqr` does not unify
      directly, use `replace (t^2) with (t * t) by ring; apply Rle_0_sqr`; use `ring`
      separately for completing-square identities before finishing the resulting
      linear inequality with `lra`.


      - [rocq-00017] To turn `Rabs t = 1` into a sign disjunction, destruct `(Rle_or_lt
      0 t)`; in the nonnegative branch rewrite with `Rabs_pos_eq t H`, and in the
      negative branch rewrite with `Rabs_left t H`, yielding `t = 1 \/ t = -1` by
