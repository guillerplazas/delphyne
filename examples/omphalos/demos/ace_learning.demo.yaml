          '
        helpful: 0
        harmful: 0
      - id: rocq-00025
        section: pitfalls
        content: 'A closed cast such as `INR 4` is not necessarily definitionally
          convertible to `(4 : R)`, so `change` may fail. First prove an explicit
          equality, for example with `cbv [INR]; ring`, and rewrite with that equality
