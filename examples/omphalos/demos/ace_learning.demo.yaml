      - [rocq-00013] For positivity of a recursive real product whose successor factor
      is `1 + / d`, prove `0 < d` with `Rmult_pos_pos`, obtain `0 < / d` via `Rinv_0_lt_compat`,
      prove the factor with `lra`, and finish the product with `apply Rmult_pos_pos;
      assumption`; `nra` does not infer positivity through opaque recursive products.


      - [rocq-00014] For natural-number product bounds, use `Nat.mul_le_mono` to
      combine factor inequalities such as `3 <= y` and `2 <= z`, and use `Nat.mul_le_mono_nonneg_r`
      to multiply an established inequality by a nonnegative factor; provide the
      premises in the lemma''s expected order instead of guessing a multiplication-monotonicity
