      - [rocq-00020] For instantiated recurrence equations containing closed casts
      and natural sums, use `cbv [INR]` to evaluate the casts, then normalize each
      index explicitly with `replace (a + b)%nat with c%nat in H by reflexivity`;
      after these rewrites, `lra` can solve the resulting linear real-equation chain.


      - [rocq-00021] For an explicit `Ensemble` built from nested `Add`, first unfold
      `Add` and rewrite membership using the corresponding `Empty_set`, `Singleton`,
      and `Union` equivalences; once the resulting disjunctions and `False` cases
      are exposed, use `intuition; lia`. For cardinality, apply `card_add` layer
      by layer, prove each freshness premise by unfolding `In` and `Add` and inverting
