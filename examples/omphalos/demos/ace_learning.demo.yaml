      - [rocq-00014] For natural-number product bounds, use `Nat.mul_le_mono` to
      combine factor inequalities such as `3 <= y` and `2 <= z`, and use `Nat.mul_le_mono_nonneg_r`
      to multiply an established inequality by a nonnegative factor; provide the
