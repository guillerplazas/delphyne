      informal_statement: "Two different prime numbers between $4$ and $18$ are chosen.\
        \ When their sum is\n   subtracted from their product, which of the following\
        \ numbers could be obtained?\n\n   $\\textbf{(A)}\\ 22 \\qquad\\textbf{(B)}\\\
        \ 60 \\qquad\\textbf{(C)}\\ 119 \\qquad\\textbf{(D)}\\\n   180 \\qquad\\textbf{(E)}\\\
        \ 231$ Show that it is \\textbf{(C) }119."
      informal_proof: "Any two prime numbers between 4 and 18 have an odd product\
        \ and an even sum. Any odd\n   number minus an even number is an odd number,\
        \ so we can eliminate A, B, and D. Since\n   the highest two prime numbers\
        \ we can pick are 13 and 17, the highest number we can\n   make is $(13)(17)-(13+17)\
        \ = 221 - 30 = 191$. Thus, we can eliminate E. So, the answer\n   must be\
        \ $\\textbf{(C) }119$."
      imports: 'Require Import ZArith.

        Require Import Nat.

        Require Import PArith.

        Require Import Arith.

