# Demonstration of the standard baseline `prove_theorem_standard`.
#
# The standard baseline has ONE action: propose a complete proof body as
# a fenced code block. Pytanque verifies it. If verification fails, the
# error feedback (failing tactic, error message, remaining goals) is fed
# back to the LLM and it revises. The loop terminates on success or when
# the feedback budget is exhausted.
#
# The demo below sources its query answers from the trace recorded in
# `commands/prove_one_standard.exec.yaml` (refreshed via
# `make regen-command-caches`). That trace is for
# `algebra_sqineq_4bap1lt4bsqpap1sq`, which the standard baseline does
# NOT solve on this seed (it exhausts the 4-request budget). The demo
# therefore uses `tests: - run` (without `| success`) — it documents
# the verifier-loop shape, not the outcome.
#
# See `demos/agentic.demo.yaml` for parallel demos of the agentic
# baseline (same problem, with tool calls, solved by both toolsets).

- demonstration: standard_dev_smoke
  strategy: prove_theorem_standard
  args:
    problem_file: "miniF2F/valid/algebra/algebra_sqineq_4bap1lt4bsqpap1sq.v"
    theorem_name: "algebra_sqineq_4bap1lt4bsqpap1sq"
  tests:
    - run
  using:
    - command: commands/prove_one_standard.exec.yaml
  queries: []
