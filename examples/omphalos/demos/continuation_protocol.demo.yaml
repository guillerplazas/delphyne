- demonstration: continuation-suffix
  strategy: demonstrate_continuation
  args:
    spec: &id001
      file: /home/guille/anaconda3/envs/guille/delphyne/examples/omphalos/miniF2F/valid/amc/amc12a_2003_p1.v
      theorem_name: amc12a_2003_p1
      theorem_statement: ":\n    sum_f (fun n => 2*n+2) 2003 - sum_f (fun n => 2*n+1)\
        \ 2003 = 2003"
      informal_statement: "What is the difference between the sum of the first $2003$\
        \ even counting numbers and\n   the sum of the first $2003$ odd counting numbers?\
        \ \n\n   $ \\mathrm{(A) \\ } 0\\qquad \\mathrm{(B) \\ } 1\\qquad \\mathrm{(C)\
        \ \\ } 2\\qquad \\mathrm{(D)\n   \\ } 2003\\qquad \\mathrm{(E) \\ } 4006 $\
        \ Show that it is \\mathrm{(D)}\\ 2003."
      informal_proof: "The first $2003$ even counting numbers are $2,4,6,...,4006$.\
        \ \n\n   The first $2003$ odd counting numbers are $1,3,5,...,4005$. \n\n\
        \   Thus, the problem is asking for the value of $(2+4+6+...+4006)-(1+3+5+...+4005)$.\
        \ \n\n   $(2+4+6+...+4006)-(1+3+5+...+4005) = (2-1)+(4-3)+(6-5)+...+(4006-4005)\
        \ $ \n\n   $= 1+1+1+...+1 = \\mathrm{(D)}\\ 2003$"
      imports: 'Require Import Coq.Lists.List.

        Import ListNotations.'
      definitions: ''
    prefix: &id002
    - intros n.
    expected:
    - intros n.
    - lia.
  tests:
  - run | success
  queries:
  - query: ContinueVerifiedProof
    args:
      spec: *id001
      available_skills: {}
      verified_prefix: intros n.
    answers:
    - answer:
        mode: suffix
        script: lia.
      example: false
