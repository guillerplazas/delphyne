      theorem_statement: |-
        (n : nat) :
          123 * n + 17 = 39500 -> n = 321
      informal_statement: |-
        When 39,500 is divided by an integer $n$, the quotient is 123 and the remainder is
           17. Find $n$. Show that it is 321.
