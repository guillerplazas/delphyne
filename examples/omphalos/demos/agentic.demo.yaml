# --- Standalone few-shot examples (not strategy demos) ---
# One compact problem -> correct-proof pair per demonstrated problem.
# These are the only answers with `example: true`: they enter the
# few-shot example database and are prepended to every
# `ProposeProofScriptAgentic` prompt. The proofs were verified
# against Rocq via pytanque (plain `check`, no assistance).

- demonstration: fewshot_algebra_binomnegdiscrineq
  query: ProposeProofScriptAgentic
  args:
    spec:
      file: /home/guille/anaconda3/envs/guille/delphyne/examples/omphalos/miniF2F/valid/algebra/algebra_binomnegdiscrineq_10alt28asqp1.v
      theorem_name: algebra_binomnegdiscrineq_10alt28asqp1
      theorem_statement: |-
        :
          forall a : R, 10 * a <= 28 * a^2 + 1
      informal_statement: For any real number a, show that $10a \leq 28a^2 + 1$.
      informal_proof: |-
        It suffices to show $0\leq 28a^2 - 10a + 1$.
           First, consider completing the square for $28a^2 - 10a$ and observe that $(a -
           \frac{5}{28})^2 = a^2 - \frac{10}{28}a + (5/28)^2$.
           Since $0\leq (a - \frac{5}{28})^2$, we have $0\leq a^2 - \frac{10}{28}a + (5/28)^2$.
           Multiplying by 28 and simplifying terms gives $0\leq 28*a^2 - 10*a + (25/28)$.
           Since $25/28 < 1$, the result follows.
      imports: |-
        Require Import Reals.
        Open Scope R_scope.
    available_skills:
      rocq-phrasebook: Common math-to-Rocq translations.
      proof-templates: Structured proof skeletons for common patterns in Rocq.
      tactics-reference: Comprehensive tactics reference for Rocq theorem proving.
      tactic-patterns: Quick reference for choosing tactics based on goal structure.
      compilation-errors: Error-by-error guidance for Rocq compilation errors. Read this first for
        any build error.
      compiler-guided-repair: Quick reference for compiler-guided proof repair. Escalation-only —
        not first-pass.
      coq-stdlib-guide: Navigation guide for the Coq standard library and common packages.
    toolset: rich
    turn_budget: 32
    prefix: []
  answers:
    - answer: |-
        Completing the square: $28a^2 - 10a + 1 = 28(a - 5/28)^2 + 3/28 > 0$.
        The square-nonnegativity assert makes the goal linear-arithmetic-free
        for `nra`.
        ```rocq
        intros a.
        assert (Hsq : 0 <= (28 * a - 5) * (28 * a - 5)) by apply Rle_0_sqr.
        replace (a ^ 2) with (a * a) by ring.
        nra.
        ```
      example: true

- demonstration: fewshot_induction_sum_odd
  query: ProposeProofScriptAgentic
  args:
    spec:
      file: /home/guille/anaconda3/envs/guille/delphyne/examples/omphalos/miniF2F/valid/induction/induction_sum_odd.v
      theorem_name: induction_sum_odd
      theorem_statement: |-
        : forall n : nat,
          n > 0 ->
          sum_n (fun k => 2 * k + 1) n = n * n
      informal_statement: Show that for positive integer $n$, $\sum_{k=0}^{n-1} (2k + 1) = n^2$.
      informal_proof: |-
        We show the result by induction on $n$. The result is trivial for $n=1$. Let us
           assume it is true for $n \geq 1$.
           We have that $\sum_{k=0}^{(n+1)-1} (2k + 1) = \sum_{k=0}^{n-1} (2k + 1) + (2n + 1)$.
           The induction hypothesis tells us that $\sum_{k=0}^{n-1} (2k + 1) = n^2$. So
           $\sum_{k=0}^{(n+1)-1} (2k + 1) = n^2 + 2n +1 = (n+1)^2$ and the result is true for
           $n+1$.
           By induction, we conclude that the result is true for all positive integer $n$.
      imports: Require Import Coq.Arith.Arith.
    available_skills:
      rocq-phrasebook: Common math-to-Rocq translations.
      proof-templates: Structured proof skeletons for common patterns in Rocq.
      tactics-reference: Comprehensive tactics reference for Rocq theorem proving.
      tactic-patterns: Quick reference for choosing tactics based on goal structure.
      compilation-errors: Error-by-error guidance for Rocq compilation errors. Read this first for
        any build error.
      compiler-guided-repair: Quick reference for compiler-guided proof repair. Escalation-only —
        not first-pass.
      coq-stdlib-guide: Navigation guide for the Coq standard library and common packages.
    toolset: rich
    turn_budget: 32
    prefix: []
  answers:
    - answer: |-
        Induction on `n`; the base case contradicts `n > 0`, the step case
        splits on whether the predecessor is zero, then the induction
        hypothesis plus `nia` closes the arithmetic.
        ```rocq
        intros n Hn.
        induction n as [|n IH].
        - lia.
        - destruct n as [|m].
          + simpl. lia.
          + assert (H : S m > 0) by lia.
            specialize (IH H).
            simpl in *. nia.
        ```
      example: true

