# Demonstrations of the agentic baseline `prove_theorem_agentic`.
#
# The agentic baseline extends the standard one with TWO tools:
#
# - `ReadSkill(skill_name)` — load a curated Rocq skill reference (the
#   markdown content lands in chat history). Surfaces general tactic
#   guidance, proof templates, error-message families, stdlib pointers.
#
# - `SearchRocq(command)` — run a Rocq introspection command (`Search …`,
#   `Check …`, `Print …`, `About …`, `SearchPattern …`) against the
#   problem's initial proof state and return Rocq's output.
#
# The LLM has three actions: propose a proof, call `ReadSkill`, or call
# `SearchRocq`. It allocates its request budget across them at its own
# discretion.
#
# The single demo below is a strategy demo that replays the cached
# successful agentic run on `algebra_sqineq_4bap1lt4bsqpap1sq`. The
# trace at `commands/cache/prove_one_agentic.exec.yaml` uses BOTH
# `ReadSkill` and `SearchRocq` and closes the proof in 5 turns —
# inspect that file directly to see the full conversation, the
# concrete tool-call YAML shape, and the resulting tool-result
# messages.
#
# (Standalone `QueryDemo` entries showing just a tool-call answer in
# isolation are intentionally NOT included here: OpenAI's API requires
# any assistant message carrying `tool_calls` to be immediately
# followed by tool-result messages, so single-turn tool-call examples
# break few-shot injection. Use the strategy trace above to see the
# complete tool-call -> tool-result handshake.)

- demonstration: agentic_dev_smoke
  strategy: prove_theorem_agentic
  args:
    problem_file: "miniF2F/valid/algebra/algebra_sqineq_4bap1lt4bsqpap1sq.v"
    theorem_name: "algebra_sqineq_4bap1lt4bsqpap1sq"
  tests:
    - run | success
  using:
    - command: commands/cache/prove_one_agentic.exec.yaml
  queries: []
