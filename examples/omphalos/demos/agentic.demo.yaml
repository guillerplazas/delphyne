# Demonstrations of the agentic baseline `prove_theorem_agentic`.
#
# The agentic baseline extends the standard one with exploration
# tools, selected by the `toolset` strategy argument:
#
# - `"rich"` (canonical): `ReadSkill` (curated Rocq references) +
#   `InspectAt` (replay a tactic prefix, then run an introspection
#   command at the resulting state) + `TryAutomation` (probe each
#   remaining subgoal with a battery of cheap closing tactics).
# - `"core"`: `ReadSkill` + `SearchRocq` (introspection at the initial
#   state only); structural exploration happens through partial
#   proposals.
#
# Verification on the agentic side is automation-assisted
# (`check_proof_assisted`): probe results land in the feedback, and if
# every remaining goal is routine the verifier finishes the proof.
#
# The demonstrated problems (`algebra_binomnegdiscrineq_10alt28asqp1`
# and `induction_sum_odd`) are deliberately chosen from OUTSIDE all
# three benchmark partitions (`benchmarks/{train,validation,test}.txt`
# — asserted in `experiments/common/miniF2F_bench.py`), so demonstrations and
# evaluation
# problems never overlap. They are the SAME two problems as
# `demos/standard.demo.yaml` — the only difference between the
# baselines' demonstrations is the tool calls and agentic elements.
# All strategy demos assert `run | success` and are fully
# materialized (every LLM answer, tool call and `__Computation__`
# result pinned; `example: false` on the trace answers, which are
# regression-test material, not prompt content).
#
# Few-shot prompting: the two standalone query demonstrations at the
# END of this file (label `fewshot_*`) carry `example: true` and are
# injected into every `ProposeProofScriptAgentic` prompt — one
# compact problem -> correct-proof pair per demo problem.
#
# Regenerate after changing prompts / strategy code:
#   make regen-command-caches
#   (restore the `using:` sources, drop the materialized query entries)
#   python -m tools.data.materialize_demo demos/agentic.demo.yaml --drop-using

