      equality. Check which variable pair each helper premise requires.
    target: b13
    rules: '[{"alias": "b1", "id": "rocq-00001", "section": "pitfalls", "content":
      "When `Hf : forall x, f x = polynomial x` and `Hx : f x <= 0`, use `rewrite
      Hf in Hx` to expose the polynomial before invoking `nra`; merely specializing
      `Hf` does not connect it to `Hx`.\n"}, {"alias": "b2", "id": "rocq-00002",
      "section": "tactics", "content": "For an induction hypothesis relating recursive
      `sum_f` expressions, if `rewrite IH` fails after `simpl`, use `change` to expose
      the successor case explicitly as `sum_f ... n + f n = sum_f ... n + g n + S
      n`; then apply `rewrite IH; lia`.\n"}, {"alias": "b3", "id": "rocq-00003",
      "section": "tactics", "content": "For goals over `nat` with hypotheses such
      as `(n - 1) * n * (n + 1) = k` and a successor or exact-value conclusion, use
      `intros` followed by `nia`; it can handle the nonlinear products and truncated
      subtraction directly.\n"}, {"alias": "b4", "id": "rocq-00004", "section": "tactics",
      "content": "For closed `nat` equalities built from executable finite-list operations
      such as `seq`, `filter`, boolean predicates, and `fold_right`, try `vm_compute`;
      use `reflexivity` afterward if the resulting definitional equality is not closed
      automatically.\n"}, {"alias": "b5", "id": "rocq-00005", "section": "pitfalls",
      "content": "When applying a recurrence hypothesis whose predecessor uses truncated
      subtraction, first prove the exact natural-number equality (for example, `((2
      * S k + 1) - 2)%nat = 2 * k + 1` by `simpl; lia`), then rewrite with that equality
      before applying the hypothesis so its indices unify.\n"}, {"alias": "b6", "id":
      "rocq-00006", "section": "pitfalls", "content": "Under an active `R_scope`,
      annotate natural-number indices, arithmetic, and order conditions with `%nat`
      (for example, `(1 < n)%nat`); reserve `INR` and unannotated arithmetic for
      real-valued conclusions to avoid coercion and comparison-type errors.\n"},
      {"alias": "b7", "id": "rocq-00007", "section": "lemmas", "content": "For nat
      modulo goals, explicitly instantiate `Nat.div_mod_eq x y`; rewrite a hypothesis
      `x mod y = r` to obtain `x = y * (x / y) + r`, then use `nia` for the resulting
      arithmetic. When the dividend is normalized as `r + q * m`, use `Nat.Div0.mod_add`
      first and simplify the remaining `r mod m`.\n"}, {"alias": "b8", "id": "rocq-00009",
      "section": "strategy", "content": "For finite nonnegative real sequences with
      a fixed-sum product goal, prove the stronger normalized inequality `prod_n
      a n <= (sum_n a n / INR n)^n` first, preserving an arbitrary sum or average
      throughout the induction; specialize to `sum_n a n = INR n` only afterward.\n"},
      {"alias": "b9", "id": "rocq-00010", "section": "pitfalls", "content": "Do not
      obtain a successor product bound by multiplying an induction hypothesis such
      as `prod_n a (S n) <= 1` by an arbitrary nonnegative factor: that factor may
      exceed `1`. An induction proof must retain a bound parameterized by the total
      sum or average.\n"}, {"alias": "b10", "id": "rocq-00011", "section": "tactics",
      "content": "Before using `nra` in AM-GM base or successor cases, unfold or
      rewrite the relevant `sum_n` and `prod_n` expressions, including base cases
      such as `sum_n a 0` and `prod_n a 1`, and prove any required `INR n <> 0` denominator
      condition; `nra` cannot reason through opaque recursive definitions or supply
      the global inequality.\n"}, {"alias": "b11", "id": "rocq-00012", "section":
      "tactics", "content": "For a real goal `0 <= t^2` where `Rle_0_sqr` does not
      unify directly, use `replace (t^2) with (t * t) by ring; apply Rle_0_sqr`;
      use `ring` separately for completing-square identities before finishing the
      resulting linear inequality with `lra`.\n"}, {"alias": "b12", "id": "rocq-00013",
      "section": "lemmas", "content": "For positivity of a recursive real product
      whose successor factor is `1 + / d`, prove `0 < d` with `Rmult_pos_pos`, obtain
      `0 < / d` via `Rinv_0_lt_compat`, prove the factor with `lra`, and finish the
      product with `apply Rmult_pos_pos; assumption`; `nra` does not infer positivity
      through opaque recursive products.\n"}, {"alias": "b13", "id": "rocq-00014",
      "section": "lemmas", "content": "For natural-number product bounds, use `Nat.mul_le_mono`
      to combine factor inequalities such as `3 <= y` and `2 <= z`, and use `Nat.mul_le_mono_nonneg_r`
      to multiply an established inequality by a nonnegative factor; provide the
      premises in the lemma''s expected order instead of guessing a multiplication-monotonicity
      API.\n"}, {"alias": "b14", "id": "rocq-00015", "section": "lemmas", "content":
      "To lift a natural bound into `R`, expose the coercion and apply `le_INR`:
      for example, prove `2 <= INR c` with `change INR 2 <= INR c; apply le_INR;
      lia`; for strict positivity of a cast, apply `lt_0_INR` to the natural positivity
      hypothesis rather than using a nonexistent `.mpr` projection.\n"}, {"alias":
      "b15", "id": "rocq-00016", "section": "pitfalls", "content": "For real equations
      involving a single reciprocal `1 / x`, after proving `x <> 0`, multiply explicitly
      by `x` and expose the inverse identity with `unfold Rdiv` and `assert (x *
      / x = 1) by exact (Rinv_r x Hx)`; then use `ring` and `nra` on the resulting
      polynomial equation instead of relying on `field_simplify` to normalize it.\n"},
      {"alias": "b16", "id": "rocq-00017", "section": "tactics", "content": "To turn
      `Rabs t = 1` into a sign disjunction, destruct `(Rle_or_lt 0 t)`; in the nonnegative
      branch rewrite with `Rabs_pos_eq t H`, and in the negative branch rewrite with
      `Rabs_left t H`, yielding `t = 1 \\/ t = -1` by `lra`.\n"}, {"alias": "b17",
      "id": "rocq-00018", "section": "pitfalls", "content": "For bounded natural
      searches involving `Nat.lcm` or `Nat.gcd`, avoid broad `vm_compute`, `compute`,
      or `simpl [Nat.gcd]`, since recursive evaluation can stack-overflow; reduce
      only explicitly closed numeral cases, using `change` to expose a known numeral
      equality when needed.\n"}, {"alias": "b18", "id": "rocq-00019", "section":
      "strategy", "content": "When proving a least witness by finite exclusion, first
      split with `destruct (le_gt_dec bound m) as [Hge | Hlt]`; close the lower-bound
      branch immediately, handle the finitely many numeral cases explicitly under
      `Hlt`, and discharge any residual symbolic successor branch directly from `Hlt`
      rather than using blanket `all:` tactics or unstable numbered selectors.\n"},
      {"alias": "b19", "id": "rocq-00020", "section": "tactics", "content": "For
      instantiated recurrence equations containing closed casts and natural sums,
      use `cbv [INR]` to evaluate the casts, then normalize each index explicitly
      with `replace (a + b)%nat with c%nat in H by reflexivity`; after these rewrites,
      `lra` can solve the resulting linear real-equation chain.\n"}, {"alias": "b20",
      "id": "rocq-00021", "section": "tactics", "content": "For an explicit `Ensemble`
      built from nested `Add`, first unfold `Add` and rewrite membership using the
      corresponding `Empty_set`, `Singleton`, and `Union` equivalences; once the
      resulting disjunctions and `False` cases are exposed, use `intuition; lia`.
      For cardinality, apply `card_add` layer by layer, prove each freshness premise
      by unfolding `In` and `Add` and inverting membership hypotheses, and finish
      the empty base with `card_empty`.\n"}, {"alias": "b21", "id": "rocq-00022",
      "section": "lemmas", "content": "For trigonometric goals involving complementary
      or doubled angles, use the library lemma with the exact goal orientation\u2014such
      as `sin_PI_x` or `sin_2a`, rewriting with it before `reflexivity` when necessary.
      For positivity of `sin x`, apply `sin_gt_0` and prove the bounds `0 < x` and
