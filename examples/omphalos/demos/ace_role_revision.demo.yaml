      \ coercion and comparison-type errors.\n\n- [rocq-00010] Do not obtain a successor\
      \ product bound by multiplying an induction hypothesis such as `prod_n a (S\
      \ n) <= 1` by an arbitrary nonnegative factor: that factor may exceed `1`.\
