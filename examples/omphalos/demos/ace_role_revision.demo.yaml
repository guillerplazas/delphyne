      \ average.\n\n- [rocq-00016] For real equations involving a single reciprocal\
      \ `1 / x`, after proving `x <> 0`, multiply explicitly by `x` and expose the\
      \ inverse identity with `unfold Rdiv` and `assert (x * / x = 1) by exact (Rinv_r\
      \ x Hx)`; then use `ring` and `nra` on the resulting polynomial equation instead\
