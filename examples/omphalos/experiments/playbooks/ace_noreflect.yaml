bullets:
- content: "`Rle_0_sqr r` proves nonnegativity of `r\xB2` (the `Rsqr` notation, definitionally\
    \ `r * r`); when the goal is `0 <= r ^ 2`, first assert `r ^ 2 = r * r` by `ring`,\
    \ rewrite, and apply the lemma."
  harmful: 0
  helpful: 0
  id: rocq-00001
  section: lemmas
- content: 'For a goal of the form `x <= x + s` from `Hs : 0 <= s`, generalize `x`,
    introduce it explicitly, use `apply Rle_trans with (x + 0)`, discharge `x <= x
    + 0` by `rewrite Rplus_0_r; reflexivity`, then apply `Rplus_le_compat_l` to `Hs`.'
  harmful: 0
  helpful: 0
  id: rocq-00002
  section: tactics
- content: For polynomial inequalities supported by a square, assert `0 <= Rsqr t`
    using `Rle_0_sqr`, then `unfold Rsqr in H` before calling `nra`; `nra` may fail
    if asked to prove the square nonnegativity itself.
  harmful: 0
  helpful: 0
  id: rocq-00003
  section: tactics
- content: For a goal of the form `0 <= (x - y) * (x - y)`, apply `Rle_0_sqr` directly;
    the product-shaped square is accepted without first rewriting it to `Rsqr` or
    `x ^ 2`.
  harmful: 0
  helpful: 0
  id: rocq-00004
  section: tactics
- content: '`sqrt_def` proves `sqrt a * sqrt a = a` from `0 <= a`; for concrete nonnegative
    numerals such as `2`, apply `sqrt_def` and discharge the side condition with `lra`.'
  harmful: 0
  helpful: 0
  id: rocq-00005
  section: lemmas
- content: For identities involving reciprocals such as `x * (1 / (2 * x))`, use `field_simplify`;
    expect a generated side goal `x <> 0`, then solve the main polynomial equality
    with `ring` and provide the nonzero hypothesis explicitly with `exact hx0`.
  harmful: 0
  helpful: 0
  id: rocq-00006
  section: tactics
- content: "When a theorem statement already binds its variables and hypotheses in\
    \ the displayed goal, do not call `intros` on them again; Rocq reports errors\
    \ such as \u201Cx is already used.\u201D"
  harmful: 0
  helpful: 0
  id: rocq-00007
  section: pitfalls
- content: For linear equalities over `C`, derive a variable by transitivity through
    a difference of the hypotheses (for example, `((2 * x + e) - (x + e))`), prove
    the algebraic identity with `ring`, then `rewrite` the hypotheses and finish with
    `ring`.
  harmful: 0
  helpful: 0
  id: rocq-00008
  section: tactics
- content: For a concrete `Rabs` goal whose argument is a rational arithmetic expression,
    first assert that the argument equals the intended numeral using `field`, then
    `rewrite` the assertion and apply `Rabs_right`.
  harmful: 0
  helpful: 0
  id: rocq-00009
  section: tactics
- content: In environments importing only `Reals`, `norm_num` may be unavailable;
    use `field` for closed rational equalities and `lra` for the resulting numerical
    nonnegativity side goals.
  harmful: 0
  helpful: 0
  id: rocq-00010
  section: pitfalls
- content: For integer modular arguments, `Z.mod_pos_bound` gives `0 <= a mod b <
    b` from `0 < b`, while `Z.div_mod` gives `a = b * (a / b) + a mod b` from `b <>
    0`; these support finite residue case splits.
  harmful: 0
  helpful: 0
  id: rocq-00011
  section: lemmas
- content: To prove a square modulo a small positive integer has restricted residues,
    use `replace (a ^ 2) with (a * a) by ring`, bound `a mod n`, enumerate its values
    with `lia`, rewrite `a` using `Z.div_mod`, and simplify products with `Z.add_mod`
    and `Z.mul_mod`.
  harmful: 0
  helpful: 0
  id: rocq-00012
  section: tactics
- content: After `simpl` in integer modulo proofs, goals such as `0 mod 3 = 0` may
    remain; close them with `reflexivity` before starting the next bullet. In parser
    environments rejecting `change` or `set`, use `replace` and direct occurrences
    instead.
  harmful: 0
  helpful: 0
  id: rocq-00013
  section: pitfalls
- content: '`Nat.divide d x` unfolds to `exists q, x = q * d`; for concrete divisibility
    goals, provide an explicit witness with `exists` and finish the resulting product
    equality using `simpl` and arithmetic tactics such as `lia`.'
  harmful: 0
  helpful: 0
  id: rocq-00014
  section: lemmas
- content: For inductive goals of the form `forall n, exists k, P n = d * k` where
    the successor expansion adds a polynomial multiple of `d`, destruct the induction
    hypothesis, choose the witness obtained by adding the corresponding quotient term,
    then use `simpl in *; nia` to verify the successor equality.
  harmful: 0
  helpful: 0
  id: rocq-00015
  section: tactics
- content: For natural-power successor steps, use `Nat.pow_add_r a b c`, which rewrites
    `a ^ (b + c)` as `a ^ b * a ^ c`; in this setting it exposes the factor `2^2 =
    4` needed for `nia`.
  harmful: 0
  helpful: 0
  id: rocq-00016
  section: lemmas
- content: 'When the constructed nat witness contains truncated subtraction such as
    `4 * k - 1`, destruct the induction quotient first: the `k = 0` case is usually
    contradictory from the induction equality, while the successor case makes the
    subtraction well behaved and lets `nia` finish.'
  harmful: 0
  helpful: 0
  id: rocq-00017
  section: pitfalls
- content: 'Avoid `simpl in *` when hypotheses contain powers such as `10 ^ n`: it
    may unfold them into large repeated sums and make `nia` fail; preserve powers,
    prove a separate successor identity with `Nat.pow_add_r`, and use an explicit
    arithmetic assertion.'
  harmful: 0
  helpful: 0
  id: rocq-00018
  section: pitfalls
- content: '`Nat.pow_lower_bound a b` proves `1 <= a ^ b` from `a <> 0`; for natural-number
    subtraction in an arithmetic divisibility step, assert this lower bound (discharging
    a concrete nonzero base with `discriminate`) so `nia` can reason about the truncated
    subtraction.'
  harmful: 0
  helpful: 0
  id: rocq-00019
  section: lemmas
- content: 'In a minimal Nat environment, the successor-power identity is `PeanoNat.Nat.pow_succ_r''
    : a ^ S b = a * a ^ b`; use this namespaced lemma rather than searching for unavailable
    `Nat.pow_succ_r` or `Nat.pow_add_r`.'
  harmful: 0
  helpful: 0
  id: rocq-00020
  section: lemmas
- content: For nat induction conclusions containing truncated subtraction `2 ^ (n
    + 1) - (n + 2)`, first prove an auxiliary bound `forall m, m + 2 <= 2 ^ (m + 1)`
    by induction, rewriting the successor power with `PeanoNat.Nat.pow_succ_r'`; specialize
    the bound in the main step and let `nia` finish.
  harmful: 0
  helpful: 0
  id: rocq-00021
  section: tactics
- content: For factorial successor steps in this environment, rewrite `fact (S n)`
    with `Rfunctions.fact_simpl`; common names such as `fact_succ` and `Nat.factorial_succ`
    are unavailable.
  harmful: 0
  helpful: 0
  id: rocq-00022
  section: lemmas
- content: In minimal Nat environments, use the namespaced transitivity lemma `Nat.le_trans`
    rather than unqualified `le_trans`, which may not be in scope.
  harmful: 0
  helpful: 0
  id: rocq-00023
  section: pitfalls
- content: For closed integer arithmetic goals involving concrete powers and `mod`,
    try `vm_compute`; if it leaves a definitional equality, finish with `reflexivity`.
  harmful: 0
  helpful: 0
  id: rocq-00024
  section: tactics
- content: '`Nat.mod_divides a b` has type `b <> 0 -> (a mod b = 0 <-> exists c, a
    = b * c)`; provide the nonzero-modulus premise explicitly and use `proj1` or `proj2`
    rather than relying on unsupported `.1`/`.2` notation.'
  harmful: 0
  helpful: 0
  id: rocq-00025
  section: lemmas
- content: When proving an auxiliary bound by induction, assert it as `forall k, ...`
    and introduce `k` inside the assertion; otherwise induction may retain surrounding
    hypotheses and produce an induction hypothesis requiring those hypotheses as extra
    arguments.
  harmful: 0
  helpful: 0
  id: rocq-00026
  section: pitfalls
- content: For a Nat residue-cycle induction, rewrite successor powers with `Nat.pow_succ_r'`,
    distribute modulo with `Nat.mul_mod`, rewrite the induction hypothesis, then destruct
    the bounded residue `m mod d` and close each concrete branch with `simpl`/`reflexivity`
    (using `Nat.mod_small` when simplification leaves a nontrivial small modulo).
  harmful: 0
  helpful: 0
  id: rocq-00027
  section: tactics
- content: 'For a divisibility hypothesis unfolded as Hq : x = q * d, rewrite Hq and
    apply Nat.mod_mul directly to prove x mod d = 0; do not commute q * d to d * q,
    since Nat.mod_mul matches the quotient factor followed by the modulus.'
  harmful: 0
  helpful: 0
  id: rocq-00028
  section: lemmas
- content: For bounded `nat` digit-style goals with hypotheses containing arithmetic
    equalities and products such as `a * b`, introduce the hypotheses and try `nia`
    directly; it can combine the bounds and equations to derive the target without
    manually rearranging the product.
  harmful: 0
  helpful: 0
  id: rocq-00029
  section: tactics
