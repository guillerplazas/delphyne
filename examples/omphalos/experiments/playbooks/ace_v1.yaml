bullets:
- content: When applying Rle_0_sqr to prove a real square is nonnegative, state the
    fact as 0 <= Rsqr t rather than 0 <= t ^ 2; unfold Rsqr before calling nra so
    the square becomes a polynomial expression.
  harmful: 0
  helpful: 4
  id: rocq-00001
  section: pitfalls
- content: Do not rely on the generic `positivity` tactic for real-square nonnegativity
    when it is not in scope; use `Rle_0_sqr` on an assertion of the form `0 <= Rsqr
    t` instead.
  harmful: 0
  helpful: 0
  id: rocq-00002
  section: pitfalls
- content: When applying `sqrt_def` to rewrite `sqrt a * sqrt a`, first prove `0 <=
    a` and prefer `exact (sqrt_def a ha)` so the generated nonnegativity side goal
    is discharged explicitly.
  harmful: 0
  helpful: 0
  id: rocq-00003
  section: pitfalls
- content: For real identities involving `1 / d`, prove both `0 < d` and `d <> 0`
    separately, then use `field_simplify_eq; nra`; bare `field` may not close the
    resulting inverse assertion.
  harmful: 0
  helpful: 0
  id: rocq-00004
  section: tactics
- content: When the proof body is inserted after theorem binders have already been
    introduced, do not `intros` those variables again, since this causes name-collision
    errors.
  harmful: 0
  helpful: 0
  id: rocq-00005
  section: pitfalls
- content: For linear equalities over `C`, assert an algebraic rearrangement, discharge
    it with `ring`, rewrite the original hypotheses into the assertion, and finish
    numeral normalization with `ring`; use `{ ... }` when the assertion proof needs
    multiple tactics.
  harmful: 0
  helpful: 0
  id: rocq-00006
  section: tactics
- content: For a closed real expression under `Rabs`, first assert its exact numeral
    value and prove the assertion with `field`, rewrite the goal, then apply `Rabs_right`
    (or `Rabs_pos_eq`) and discharge the resulting nonnegativity side condition with
    `lra`.
  harmful: 0
  helpful: 0
  id: rocq-00007
  section: tactics
- content: Do not assume `norm_num` is available for closed real arithmetic when only
    `Reals` is imported; use an explicit equality proved by `field` instead, especially
    before simplifying `Rabs`.
  harmful: 0
  helpful: 0
  id: rocq-00008
  section: pitfalls
- content: For an integer modulus classification, use `Z.mod_pos_bound` to establish
    `0 <= a mod n < n`, then use `lia` to derive the finite disjunction of possible
    residues; do not guess `omega` when it is not imported.
  harmful: 0
  helpful: 1
  id: rocq-00009
  section: lemmas
- content: To replace a modular power by the power of the residue, apply `Z.mod_pow_l`
    after `symmetry`, yielding a goal involving `(a mod n)^k mod n` that can be rewritten
    using the residue case.
  harmful: 0
  helpful: 1
  id: rocq-00010
  section: lemmas
- content: 'After rewriting a modular square to a concrete residue, select the disjunct
    matching its value before `reflexivity`: residue `0` gives `0^2 mod 3 = 0` and
    requires `left`, while residues `1` and `2` give value `1` and require `right`.'
  harmful: 1
  helpful: 0
  id: rocq-00011
  section: pitfalls
- content: 'For `Nat.divide x y`, unfold or inspect the definition when unsure: the
    goal is `exists z, y = z * x`; provide the witness explicitly and finish the resulting
    natural-number equality with `simpl; ring` when appropriate.'
  harmful: 0
  helpful: 3
  id: rocq-00012
  section: lemmas
- content: Do not guess specialized introduction lemmas such as `Nat.divide_intro`;
    if a library lemma is uncertain, inspect the definition first, then destruct the
    natural-number cases and construct the existential witness directly.
  harmful: 0
  helpful: 4
  id: rocq-00013
  section: pitfalls
- content: For integer square case splits modulo 4, residues 0 and 2 yield square
    residue 0 while residues 1 and 3 yield square residue 1; after rewriting and `vm_compute`,
    use `vm_compute; reflexivity` because computation may leave a reflexive equality
    unfinished.
  harmful: 0
  helpful: 1
  id: rocq-00014
  section: pitfalls
- content: For inductive polynomial identities over `nat`, rewrite `S n` as `n + 1`
    with `replace ... by lia`, unfold powers in both the induction hypothesis and
    goal using `cbn [Nat.pow]`, then apply `nia`; provide the explicit existential
    witness before this normalization.
  harmful: 0
  helpful: 4
  id: rocq-00015
  section: tactics
- content: In nat divisibility proofs involving powers, do not construct witnesses
    with expressions such as `4*k - 1`, since truncated subtraction is not algebraically
    reliable; destruct the coefficient into `0` or `S k` and provide an explicit successor
    witness such as `S (S (S (4*k)))`, then normalize with `simpl in Hk |- *; nia`.
  harmful: 0
  helpful: 0
  id: rocq-00016
  section: pitfalls
- content: To rule out a zero coefficient in an equality involving `2^e`, assert `2^e
    <> 0` with `Nat.pow_nonzero` (discharging the base case by `discriminate`), then
    use the resulting contradiction; keep exponent numerals and `replace` expressions
    explicitly in nat scope with `%nat`.
  harmful: 0
  helpful: 2
  id: rocq-00017
  section: lemmas
- content: In Nat.divisibility inductions involving successor powers, avoid a fragile
    `change`; expose the power step with `replace (a ^ S (S n)) with (a * (a ^ S n))
    by reflexivity`, then provide the explicit witness and give `nia` hypotheses such
    as `a ^ S n <> 0` or `0 < a ^ S n` when truncated subtraction is present.
  harmful: 0
  helpful: 1
  id: rocq-00018
  section: tactics
- content: For nat power goals whose exponent is written arithmetically, explicitly
    replace `n + 1 + 1` with `S (n + 1)` by `lia`, then use `simpl; reflexivity`;
    `cbn [Nat.pow]` alone may not expose the required successor-power equality.
  harmful: 0
  helpful: 0
  id: rocq-00019
  section: tactics
- content: When an auxiliary inequality is needed inside an induction but the asserted
    proposition depends on surrounding hypotheses, prove it first as a standalone
    universally quantified fact such as `forall m, m + 2 <= 2 ^ (m + 1)`; this keeps
    the induction hypothesis free of irrelevant implications.
  harmful: 0
  helpful: 0
  id: rocq-00020
  section: strategy
- content: For nat factorial inequalities proved by induction, after handling small
    successor cases, rewrite the current factorial with `Rfunctions.fact_simpl`, prove
    the successor square/product bound using `simpl; lia`, and finish with `Nat.le_trans`
    plus `Nat.mul_le_mono_l` applied to the induction hypothesis.
  harmful: 0
  helpful: 0
  id: rocq-00021
  section: tactics
- content: In successor factorial induction, specialize the induction hypothesis with
    a predecessor bound matching its exact shape (for example, prove `4 <= S (S (S
    (S k)))` before applying it); normalize nested successors and powers with `simpl`
    and use `lia` for the resulting arithmetic instead of relying on `nia` to infer
    nonlinear structure or guessing unavailable names such as `Nat.mul_le_mul_l`.
  harmful: 0
  helpful: 0
  id: rocq-00022
  section: pitfalls
- content: For closed `nat` arithmetic or modulo goals, use `vm_compute` to evaluate
    the expression and append `reflexivity` when computation exposes but does not
    automatically close the final equality.
  harmful: 0
  helpful: 1
  id: rocq-00023
  section: tactics
- content: In nat modular-arithmetic inductions, expose a successor power with `replace
    (a ^ S m) with (a * a ^ m) by reflexivity` before applying `Nat.mul_mod`; discharge
    the nonzero-modulus side condition with `discriminate`, then compute the concrete
    residue with `reflexivity`.
  harmful: 0
  helpful: 1
  id: rocq-00024
  section: tactics
- content: 'For a hypothesis `Hdiv : Nat.divide d a`, use the checked equivalence
    `Nat.mod_divide` in the direction `proj2 (Nat.mod_divide a d ...)` to derive `a
    mod d = 0`; this is cleaner than destructing the existential witness.'
  harmful: 0
  helpful: 0
  id: rocq-00025
  section: lemmas
- content: Do not rewrite a divisibility witness such as `a = k * d` and expect `simpl`
    to prove `(k * d) mod d = 0` for arbitrary `k`; use `Nat.mod_divide`, then combine
    the resulting zero residue with `Nat.add_mod` for contradiction.
  harmful: 0
  helpful: 0
  id: rocq-00026
  section: pitfalls
- content: For proofs combining an auxiliary residue cycle with a later divisibility
    contradiction, establish the cycle first as a standalone `assert` with its own
    induction, introduce the divisibility hypothesis afterward, and isolate branches
    in braces or explicit goal selectors rather than fragile mixed `cut` bullets.
  harmful: 0
  helpful: 0
  id: rocq-00027
  section: strategy
- content: For bounded natural-number digit equations involving products such as `a
    * b`, introduce all implication hypotheses and try `nia` directly; bounds such
    as `1 <= a` often let it eliminate shared variables without manual rewriting or
    a separate nonzero proof.
  harmful: 0
  helpful: 0
  id: rocq-00028
  section: tactics
