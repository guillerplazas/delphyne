bullets:
- content: 'For recursively defined sums at large numeral arguments, avoid direct
    `vm_compute`; prove a closed-form formula by induction and instantiate it at the
    target argument. In successor cases where `rewrite IH` finds no matching subterm
    after `simpl`, use `change` to expose the recursive sum, rewrite with the induction
    hypothesis, and finish the resulting polynomial identity with `nia`.

    '
  harmful: 1
  helpful: 1
  id: rocq-00001
  section: strategy
- content: 'For a natural-number equation involving a concrete product equal to a
    constant, use `nia` to derive a small upper bound, `lia` to turn the bound into
    an explicit finite disjunction, then `destruct` the cases, `subst` the value,
    simplify the equation hypothesis, and close each branch with `lia`. This is useful
    when `interval_cases` or `omega` is unavailable.

    '
  harmful: 0
  helpful: 5
  id: rocq-00002
  section: strategy
- content: 'For polynomial inequalities over `R` that require square nonnegativity,
    explicitly provide each needed fact with `apply pow2_ge_0` before invoking `nra`;
    `nra` can then combine the supplied square facts with the other polynomial inequalities.

    '
  harmful: 0
  helpful: 4
  id: rocq-00003
  section: lemmas
- content: 'For natural-power bounds, use `Nat.pow_le_mono_r` to derive `a^n <= a^m`
    from `n <= m`, and use `Nat.pow_lower_bound` for lower bounds such as `1 <= a^n`;
    these lemmas are useful when deriving exponent-bound contradictions in `nat` goals.

    '
  harmful: 0
  helpful: 0
  id: rocq-00004
  section: lemmas
- content: 'For nat remainder implications such as `n mod 8 = 7 -> n mod 4 = 3`, use
    `Nat.div_mod` to rewrite `n` as `8 * (n / 8) + n mod 8`, substitute the known
    remainder, and simplify with `Nat.add_mod` and `Nat.mul_mod`. If these lemmas
    require a nonzero-modulus premise, prove it separately in an `assert` or tactic
    block, discharging concrete cases with `discriminate` rather than embedding an
    unsupported proof term.

    '
  harmful: 0
  helpful: 1
  id: rocq-00005
  section: lemmas
- content: 'For closed equality goals built from concrete `seq`/`filter` data, executable
    Boolean predicates such as `dividesb`, and a recursive `fold_right`, use `vm_compute`
    followed by `reflexivity`; induction and arithmetic case analysis are unnecessary
    when the entire expression is computable.

    '
  harmful: 0
  helpful: 1
  id: rocq-00006
  section: tactics
- content: 'For goals over `R` with hypotheses forming a linear system, use `lra`
    in `assert` statements to derive explicit variable values, rewrite those values
    into the target, and finish the resulting polynomial or concrete arithmetic with
    `lra` or `norm_num`.

    '
  harmful: 1
  helpful: 8
  id: rocq-00007
  section: tactics
- content: 'For natural-number remainder goals with a concrete nonzero modulus, first
    prove the modulus is nonzero and use `replace ... by nia` to normalize the dividend
    into a linear quotient-plus-multiple form. Then rewrite with `Nat.Div0.mod_add`
    (or with `Nat.mod_eq` when quotient-and-subtraction is more convenient), and finish
    concrete remainder facts with `simpl`, `lia`, or `reflexivity`.

    '
  harmful: 0
  helpful: 0
  id: rocq-00008
  section: lemmas
- content: 'When hypotheses show `A <> 0`, `B <> 0`, and `C <> 0`, prove `A * B *
    C <> 0` by assuming a zero product and applying `Rmult_integral` twice, contradicting
    the corresponding nonzero hypothesis in every branch. If a normalized denominator
    is an expanded polynomial, connect it to the factored product with `replace ...
    by ring`.

    '
  harmful: 0
  helpful: 1
  id: rocq-00009
  section: lemmas
- content: 'For goals `prod_n a n <= 1` from nonnegative entries and `sum_n a n =
    INR n`, first search for or prove a finite AM-GM lemma of the form `prod_n a n
    <= (sum_n a n / INR n)^n`, handle `n = 0` separately, and only then specialize
    the mean to `1`; do not induct directly on the target bound.

    '
  harmful: 0
  helpful: 0
  id: rocq-00010
  section: strategy
- content: 'For nat product equations where nia cannot infer multiplicative monotonicity,
    first derive explicit lower bounds on factors or partial products with lemmas
    such as Nat.mul_le_mono, rewrite the bounds into the full product, and only then
    use nia with the product equation to obtain the contradiction.

    '
  harmful: 1
  helpful: 0
  id: rocq-00011
  section: tactics
- content: 'For positivity over R involving natural powers and inverses, use pow_lt
    with a positive base to prove 0 < a ^ n, Rinv_pos to prove positivity of its inverse,
    and Rmult_lt_0_compat to combine positive factors; provide these facts explicitly
    before calling nra.

    '
  harmful: 1
  helpful: 0
  id: rocq-00012
  section: lemmas
- content: 'When hypotheses over nat are instantiated under Open Scope R_scope, annotate
    numeral arguments explicitly as (0%nat), (1%nat), or another nat numeral; otherwise
    terms such as Hval 1 or u 0 may be inferred as real numerals and produce type
    errors.

    '
  harmful: 1
  helpful: 2
  id: rocq-00013
  section: pitfalls
- content: "Preserve universal hypotheses such as `h\u2080 : forall n, 0 < f n` with\
    \ `pose proof (h\u2080 x)`; `specialize (h\u2080 x)` permanently changes `h\u2080\
    ` into the single proposition `0 < f x`, so later applications like `h\u2080 y`\
    \ fail.\n"
  harmful: 0
  helpful: 0
  id: rocq-00014
  section: pitfalls
- content: 'For goals involving `Rabs t = c`, split on `Rle_dec 0 t`; rewrite the
    nonnegative branch with `Rabs_pos_eq`, and in the negative branch derive `t <=
    0` from the negated decision (often with `nra`) before rewriting with `Rabs_left1`.

    '
  harmful: 0
  helpful: 0
  id: rocq-00015
  section: tactics
- content: 'When an inverse is written syntactically as `1 / x`, first establish `x
    <> 0`, then prove identities such as `x * (1 / x) = 1` with `field_simplify_eq;
    nra`; this is often more reliable than trying to rewrite directly with `Rinv_r`.

    '
  harmful: 0
  helpful: 0
  id: rocq-00016
  section: tactics
- content: 'For large concrete nat expressions involving recursive `Nat.lcm` or powers,
    avoid `vm_compute`, `native_compute`, broad `simpl`, `norm_num`, or `reflexivity`
    on the unreduced expression, since unary normalization can overflow the stack.
    After `subst` exposes a concrete case, use local `replace` steps to evaluate lcm
    terms and expose products; rewrite powers structurally with `Nat.pow_succ_r''`,
    `Nat.pow_0_r`, `Nat.pow_mul_l`, `Nat.pow_mul_r`, or `Nat.pow_add_r`, then finish
    with `nia`.

    '
  harmful: 0
  helpful: 0
  id: rocq-00017
  section: pitfalls
- content: 'For a nat equality `a^m = a^n` with `1 < a`, use `Nat.pow_inj_r` to reduce
    it to `m = n`, supplying the base inequality explicitly (for a concrete base,
    `lia` can usually prove it).

    '
  harmful: 0
  helpful: 0
  id: rocq-00018
  section: lemmas
- content: 'For concrete recurrence equations over `R` containing `INR` numerals and
    computed natural arguments, first assert conversion facts such as `INR 14 = 14`
    by `(simpl; lra)`, rewrite them into the instantiated equations, and use separate
    `replace ... by lra` steps to normalize arguments such as `14 + 38`. Only then
    invoke `lra` on the resulting linear system.

    '
  harmful: 0
  helpful: 0
  id: rocq-00019
  section: tactics
- content: 'After `subst` replaces a natural variable by a concrete numeral in a real-valued
    hypothesis containing `INR`, concrete products, or powers, use `simpl in h` to
    compute that hypothesis, then finish polynomial consequences with `nra`; this
    avoids requiring `norm_num`.

    '
  harmful: 0
  helpful: 0
  id: rocq-00020
  section: tactics
- content: 'For cancelling a common nonzero real denominator from an equality of quotients,
    use `Rdiv_eq_reg_r denominator`, supplying the quotient equality and a separately
    proved `denominator <> 0`; this is often more reliable than broad `field_simplify`.

    '
  harmful: 0
  helpful: 0
  id: rocq-00021
  section: lemmas
- content: 'For logarithm goals, establish the base positivity explicitly: to prove
    `0 < ln a` from `1 < a`, apply `ln_increasing 1 a`, rewrite with `ln_1`, and finish
    with `lra`; for logarithms of powers, use `ln_pow base positivity_proof exponent`,
    with the positivity proof supplied before the exponent.

    '
  harmful: 0
  helpful: 1
  id: rocq-00022
  section: lemmas
- content: 'For goals rewriting `ln (a * b)` over `R`, use `ln_mult a b` with separate
    proofs of `0 < a` and `0 < b`; prove positivity of powers first with `pow_lt`
    and of products with `Rmult_lt_0_compat`.

    '
  harmful: 0
  helpful: 0
  id: rocq-00023
  section: lemmas
- content: 'For closed equalities consisting solely of concrete natural-number arithmetic,

    try `reflexivity` first; definitional reduction can evaluate additions and

    prove the equality without `lia`, `nia`, or computation tactics.

    '
  harmful: 0
  helpful: 0
  id: rocq-00024
  section: tactics
- content: 'For real square-root goals, match and normalize the radicand''s syntactic

    shape before rewriting: use `sqrt_square` for `sqrt (x * x)`, `sqrt_pow2`

    for `sqrt (x ^ 2)` with an explicit `0 <= x` proof, and `pow2_sqrt` after

    proving radicand nonnegativity when an explicit square identity is needed.

    To compare square roots, reduce the radicands to an order comparison and use

    `sqrt_le_1_alt`; for radicands such as `x - x^2`, establish nonnegativity

    separately so `nra` or `lra` can eliminate the resulting square.

    '
  harmful: 0
  helpful: 0
  id: rocq-00025
  section: lemmas
- content: 'For a product-divisibility goal such as `A * d = B`, strengthen the induction

    invariant to `Nat.divide A B` or an explicit quotient equation rather than

    reusing the same existential witness: multiplying factors generally requires

    constructing a new quotient, which `nia` cannot supply automatically.

    '
  harmful: 0
  helpful: 0
  id: rocq-00026
  section: strategy
