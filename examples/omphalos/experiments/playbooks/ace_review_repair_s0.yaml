bullets:
- content: 'For a residue goal of the form `a mod b = c` implying divisibility of
    `a - c`, apply `Zmod_divide_minus` with its independent premises explicitly, for
    example `apply Zmod_divide_minus with (c := c); [lia | exact Hres]`.

    '
  harmful: 0
  helpful: 0
  id: rocq-00001
  section: lemmas
- content: 'For recursively defined sums, especially with polynomial summands, do
    not directly compute a large index because unfolding can overflow the stack. First
    prove a general closed-form lemma by induction, using `change` in the successor
    case to expose the exact recurrence before rewriting with the induction hypothesis;
    let `nia` solve the resulting polynomial arithmetic, then instantiate the lemma.

    '
  harmful: 1
  helpful: 2
  id: rocq-00003
  section: strategy
- content: 'For a nat modulo hypothesis `n mod b = r`, use `Nat.div_mod` with `b <>
    0` to expose a quotient-and-remainder decomposition of `n`; rewrite the known
    remainder, then normalize the resulting modular arithmetic with `Nat.add_mod`
    and `Nat.mul_mod`, using `reflexivity` for concrete remainders and `lia` for arithmetic
    side conditions.

    '
  harmful: 0
  helpful: 2
  id: rocq-00004
  section: lemmas
- content: 'For fully closed nat goals involving concrete `seq`, `filter`, boolean
    predicates, or `fold_right` computations, try `vm_compute`; if normalization leaves
    a definitional equality, finish with `reflexivity`.

    '
  harmful: 1
  helpful: 3
  id: rocq-00005
  section: tactics
- content: 'For recurrences alternating between odd and even indices, prove a paired
    invariant by induction on the common index, containing both values at successive
    odd/even positions; use `lia` to normalize successor and predecessor index expressions
    before applying the induction hypotheses.

    '
  harmful: 0
  helpful: 0
  id: rocq-00006
  section: strategy
- content: 'For goals over `R` whose hypotheses and conclusion are polynomial equalities
    or inequalities, including products and powers, introduce hypotheses with `intros`
    and use `nra`; unlike `lia`, it handles nonlinear normalization. For rational
    expressions such as `(1 / A) * A = 1`, first use `field_simplify_eq`, explicitly
    provide nonzero-denominator hypotheses, unfold definitions introduced with `set`
    if they remain opaque, and then finish the resulting polynomial goal with `nra`.

    '
  harmful: 2
  helpful: 14
  id: rocq-00007
  section: tactics
- content: 'For a nat goal of the form `(a * b) mod b = 0`, arrange the expression
    exactly as `(a * b) mod b` and apply `Nat.mod_mul`; provide `b <> 0` when required,
    then close the resulting definitional equality with `reflexivity`.

    '
  harmful: 0
  helpful: 0
  id: rocq-00008
  section: lemmas
- content: 'For an affine function hypothesis `h0 : forall x, f x = a * x + b`, specialize
    it at every input appearing in the target or arithmetic hypotheses using `rewrite
    (h0 x)` (and `rewrite (h0 x) in H`) before calling `nra`.

    '
  harmful: 0
  helpful: 2
  id: rocq-00009
  section: tactics
- content: 'For a concrete linear-recurrence goal over `R`, instantiate the recurrence
    only at the indices in the required backward chain; simplify the resulting hypotheses
    to normalize successor-based indices, then use `lra` with the known sequence values
    to eliminate intermediate terms.

    '
  harmful: 0
  helpful: 0
  id: rocq-00010
  section: tactics
- content: 'For a real square nonnegativity goal, state it as `0 <= Rsqr t` and apply
    `Rle_0_sqr`; if the surrounding arithmetic uses ordinary products or powers, `unfold
    Rsqr` before calling `nra`, since `Rle_0_sqr` does not apply directly to `(t)^2`.

    '
  harmful: 0
  helpful: 2
  id: rocq-00011
  section: lemmas
- content: 'For reciprocal-power side conditions, prove positivity with `apply Rinv_pos`
    followed by positivity of the denominator; use `Rmult_lt_0_compat` for positive
    products, then provide the resulting positivity hypothesis in a separate `nra`
    step when weakening a stronger bound such as `x < (5 / 2) * (1 - /q)` to `x <
    5 / 2`.

    '
  harmful: 0
  helpful: 1
  id: rocq-00012
  section: lemmas
- content: 'When a nat index is passed to a sequence over `R`, annotate numerals explicitly,
    such as `u (0%nat)` or `u (n : nat)`; with `R_scope` open, an unannotated `u 0`
    can be parsed with the wrong numeral type.

    '
  harmful: 0
  helpful: 0
  id: rocq-00013
  section: pitfalls
- content: 'For infinite-descent proofs of nat-valued function theorems, first isolate
    a well-founded auxiliary lemma with the exact conclusion needed by the induction
    step, such as `exists t, 0 < t /\ f t = k`; recurse on a strictly smaller output
    rather than relying on a lemma that only produces a preimage of `1`.

    '
  harmful: 0
  helpful: 0
  id: rocq-00014
  section: strategy
- content: 'For a positive real `x` with `x <> 1`, use `ln_neq_0 x` directly to prove
    `ln x <> 0`, instead of reconstructing the contradiction through exponential identities.

    '
  harmful: 0
  helpful: 0
  id: rocq-00015
  section: lemmas
- content: 'For reciprocal-order bounds, use `Rle_Rinv_depr x y` to derive `/ y <=
    / x` from `0 < x`, `0 < y`, and `x <= y`; this is the appropriate inverse-monotonicity
    lemma when `Rinv_le` is unavailable.

    '
  harmful: 0
  helpful: 0
  id: rocq-00016
  section: lemmas
- content: 'For goals involving `Nat.lcm 12 m` with a finite bound on symbolic `m`,
    first split the bound into explicit numeral cases rather than broadly unfolding
    `vm_compute`, `simpl`, gcd, or division. Substitute each case equality (for example
    with `subst m`) so it updates the target, reduce `Nat.lcm 12 k` separately by
    controlled computation or `replace ... by reflexivity`, and derive contradictions
    from the resulting concrete arithmetic.

    '
  harmful: 0
  helpful: 1
  id: rocq-00017
  section: strategy
- content: 'For nat power equalities intended for `Nat.pow_inj_r`, normalize both
    sides to a common base first: use `rewrite <- Nat.pow_mul_r` for nested powers
    and `rewrite <- Nat.pow_add_r` when combining products of powers; for concrete
    powers, expose the desired representation with `change` before applying the power-injectivity
    lemma.

    '
  harmful: 0
  helpful: 0
  id: rocq-00018
  section: lemmas
- content: 'When a case split such as `Rmult_integral` produces an impossible branch
    with `Hbzero : b = 0` and `Hbne : b <> 0`, switch to `exfalso` and close it with
    `exact (Hbne Hbzero)`; the resulting `False` does not directly close an arbitrary
    equality goal.

    '
  harmful: 0
  helpful: 0
  id: rocq-00019
  section: pitfalls
- content: 'For mixed nat/real goals where a hypothesis contains terms such as `INR
    (n * n)` or `2 ^ n` and another hypothesis fixes `n` to a numeral, first `subst
    n` and `simpl` the mixed-domain hypothesis; then use `nra` for the remaining polynomial
    real equality.

    '
  harmful: 0
  helpful: 1
  id: rocq-00020
  section: tactics
- content: 'For trigonometric goals, use `Rtrigo_facts.cos_pi_minus` and `Rtrigo_facts.sin_pi_minus`
    to rewrite complements as `cos (PI - t) = - cos t` and `sin (PI - t) = sin t`;
    for positivity, apply `sin_gt_0` after proving `0 < x < PI` using `PI_RGT_0` and
    arithmetic such as `nra`.

    '
  harmful: 0
  helpful: 0
  id: rocq-00021
  section: lemmas
- content: 'For logarithms of positive products or quotients, use `ln_mult` to rewrite
    `ln (a * b)` as `ln a + ln b`; for a quotient, establish an auxiliary identity
    such as `(u / v) * v = u` with `field; lra`, then apply `ln_mult` and finish the
    rearrangement with `lra`.

    '
  harmful: 0
  helpful: 1
  id: rocq-00022
  section: lemmas
- content: 'For a nonlinear nat equation with a small expected solution, first derive
    an upper bound by splitting with `Nat.le_gt_cases`; in the large branch, normalize
    squares to products and use `Nat.mul_le_mono` with duplicated inequalities to
    obtain a square lower bound. Combine that bound with the original equation using
    `lia`, then enumerate the remaining bounded cases.

    '
  harmful: 1
  helpful: 0
  id: rocq-00023
  section: strategy
- content: 'For square-root bounds, use `sqrt_lt_1 x y` with separate premises `0
    <= x`, `0 <= y`, and `x < y` to prove `sqrt x < sqrt y`; use `sqrt_lt_0 x y` to
    convert a square-root inequality back to `x < y` under the corresponding nonnegativity
    premises.

    '
  harmful: 0
  helpful: 0
  id: rocq-00024
  section: lemmas
- content: 'For a positive real `x`, rewrite `ln (x ^ n)` with `ln_pow x Hx n`; after
    `simpl`, concrete exponents expose the corresponding real coefficients so `nra`
    can finish the arithmetic.

    '
  harmful: 0
  helpful: 0
  id: rocq-00025
  section: lemmas
- content: 'For real square-root identities, use `pow2_sqrt t H` when `H : 0 <= t`
    to obtain `(sqrt t)^2 = t`, and use `sqrt_pow2 t H` when `H : 0 <= t` to rewrite
    `sqrt (t^2)` as `t`; `sqrt_pos` alone only supplies nonnegativity of the square
    root.

    '
  harmful: 0
  helpful: 0
  id: rocq-00026
  section: lemmas
- content: 'For a recurrence `Hrec : forall x, f (x + a) = ...`, specialize it separately
    at `x`, `x + a`, or `x - a` as needed; normalize arguments such as `(x - a) +
    a` or `(x + a) + a` with `replace ... by ...` and `ring`, then rewrite the specialized
    recurrence before calling `nra`.

    '
  harmful: 0
  helpful: 0
  id: rocq-00027
  section: tactics
- content: 'For goals asserting divisibility between recursively defined products,
    do not extend an induction witness by multiplying by the next numerator and denominator
    factors; first factor the entire products globally and prove a `Nat.divide` statement,
    since `A | B` does not imply `A * a | B * b`.

    '
  harmful: 0
  helpful: 0
  id: rocq-00028
  section: strategy
