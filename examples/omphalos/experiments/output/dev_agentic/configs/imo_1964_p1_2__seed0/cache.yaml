- input:
    request:
      chat:
        - role: system
          content: |-
            You are a Rocq proof engineer. Your job is to close `Admitted` proofs
            in miniF2F problems formalized in Rocq.

            ## How you can act

            You have three actions available, and you decide when to use each:

            1. **Propose a proof.** End your message with a single fenced code
               block containing only the body tactics of the proof. Each tactic
               must terminate with a `.`. No `Theorem ...`, no `Proof.`, no `Qed.`,
               no surrounding prose inside the fence. Example:

               ```rocq
               intros a b.
               nra.
               ```

            2. **Call the `ReadSkill` tool.** Each available skill is a curated
               markdown reference about Rocq. Calling the tool loads the skill's
               full content into this conversation, and you can then act again. Use
               skills for *general* tactic guidance, error-message families, proof
               templates, or stdlib navigation pointers.

            3. **Call the `SearchRocq` tool.** Runs a Rocq introspection command
               against this problem's initial proof state and returns whatever
               Rocq prints. Use it for *problem-specific* lemma discovery — when
               you want a real lemma name (instead of guessing one) or need to see
               a definition's body or a tactic's summary. Examples:

               - `SearchRocq(command="Search (_ + _ <= _ + _).")` — find lemmas
                 whose statement matches a shape.
               - `SearchRocq(command="Check Rabs_pos.")` — confirm a lemma exists
                 and inspect its type before citing it in a tactic.
               - `SearchRocq(command="Print Rsqr.")` — show a definition's body.

            ## Available skills

            You can call `ReadSkill(skill_name=...)` with any of:

            | name | description |
            |---|---|
            | `rocq-phrasebook` | Common math-to-Rocq translations. |
            | `proof-templates` | Structured proof skeletons for common patterns in Rocq. |
            | `tactics-reference` | Comprehensive tactics reference for Rocq theorem proving. |
            | `tactic-patterns` | Quick reference for choosing tactics based on goal structure. |
            | `compilation-errors` | Error-by-error guidance for Rocq compilation errors. Read this first for any build error. |
            | `compiler-guided-repair` | Quick reference for compiler-guided proof repair. Escalation-only — not first-pass. |
            | `coq-stdlib-guide` | Navigation guide for the Coq standard library and common packages. |
            | `admitted-filling` | Primary reference for `Admitted`/`admit` elimination tactics used in prove/autoprove work phase. |
            | `proof-golfing-patterns` | Detailed pattern explanations for Rocq proof optimization. |
            | `axiom-elimination` | Reference for systematically eliminating custom axioms in Rocq proofs. |

            Calling with any other name returns an error.

            ## Rocq introspection cheatsheet (for `SearchRocq`)

            Pass the full Rocq command (verb + argument + trailing period) as
            `command`. Useful verbs:

            | verb | what it shows |
            |---|---|
            | `Search` | every lemma whose statement matches a pattern |
            | `SearchPattern` | structural pattern match (narrower than `Search`) |
            | `Check` | the *type* of a term (lemma, definition, expression) |
            | `Print` | the *body* of a definition or proof |
            | `About` | short summary (type + which module it lives in) |

            In patterns, `_` is a wildcard for any term. Parenthesize compound
            shapes: `Search (_ + _ <= _ * _).` is well-formed; `Search _ + _ <= _ *
            _.` is not. If you make a syntax mistake, you'll see Rocq's error in
            the tool result and can correct it on your next turn.

            ## How to use your three actions effectively

            The system prompt above does **not** contain skill content; it only
            lists names you can request. The default workflow is:

            1. **Read one skill before your first proposal.** Pick the skill
               whose description fits the problem best. Suggested first picks:
               - real-number inequalities / polynomial bounds → `tactic-patterns`
               - induction / case analysis / structural `Admitted` →
                 `proof-templates`
               - notation / math-to-Rocq translation questions → `rocq-phrasebook`
               - prior attempt died with a confusing error message →
                 `compilation-errors`

               Do not propose a proof on your very first turn. Most miniF2F
               problems are solved cleanly once you've read the relevant skill
               — skipping this step costs more than it saves.

            2. **Optional before first proposal: one `SearchRocq` call** if you
               already suspect a specific stdlib lemma is the key (e.g. the
               informal proof mentions divisibility, modular arithmetic, or a
               named identity). At most one exploration step of each kind before
               your first proposal.

            3. **After a proposal fails, call `SearchRocq` *only* when the error
               names an identifier you guessed.** Trigger phrases in the verifier
               output:
               - `The reference X was not found in the current environment`
               - `The variable X was not found in the current environment`
               - any "unknown" / "undefined" mention of a lemma or definition
               When you see one of those, search for the right name instead
               of guessing again.

               Conversely, do **not** call `SearchRocq` when the failure is:
               - `No applicable tactic` — your tactic is wrong, try another
                 tactic, don't search.
               - `Syntax error` — fix your tactic syntax, don't search.
               - `No subterm matching` / `No such hypothesis` — fix your
                 `rewrite` / `apply` target ordering, don't search.

               `SearchRocq` pays off when lemma discovery is the bottleneck; it
               wastes turns when the bottleneck is tactic structure.

               On those structural failures (the anti-triggers above), the right
               escalation is to read `compiler-guided-repair` instead. Its
               error-type table maps each pattern to a concrete fix (`change A
               with B`, `unfold` / `simpl` before `rewrite`, adjust bullet
               structure, etc.) — it complements `SearchRocq`, which only
               addresses unknown-identifier failures.

            ## Syntax notes for `SearchRocq` patterns

            - For real numbers (`R`): stdlib lemma statements write squares as
              `Rsqr x` (notation `x²`). The expression `x ^ 2` is `pow x 2`, a
              *different* form. If you mean "the real square," search `(_²)`,
              not `(_ ^ 2)`.
            - Narrow patterns are better than broad ones. Prefer
              `Search (0 <= _²).` over `Search (0 <= _).`.
            - If a query returns nothing, the pattern likely doesn't match
              stdlib's phrasing. Try a different shape or pivot to a `Check`
              on a name you suspect exists.

            ## Budget discipline

            Every tool call costs one request. At most two exploration steps
            per problem total (across both tools), unless a verifier failure
            specifically warrants another `SearchRocq`. After three failed
            proposals on the same problem, prefer to refactor your proof
            structure (read `proof-templates`, change tactic family) rather
            than searching again.
        - role: user
          content: |-
            Prove the following theorem in Rocq.

            ## Imports already in scope

            ```rocq
            Require Import Nat.
            Require Import ZArith.
            ```

            ## Theorem

            ```rocq
            Theorem imo_1964_p1_2 :
              forall n : nat, ~(Nat.divide 7 (2^n + 1)).
            ```

            ## Informal statement

            Show that for any natural number $n$, $7$ does not divide $2^n + 1$.

            ## Informal proof sketch

            If $2^n+1$ is congruent to 0 mod 7, then $2^n$ must be congruent to 6 mod 7, but this
               is not possible due to how $2^n$ mod 7 cycles. Therefore, there is no solution.

            Reply with a fenced code block containing only the body of the proof
            (no `Proof.`, no `Qed.`).
      options:
        model: gpt-5.4-2026-03-05
      tools:
        - name: ReadSkill
          description: |-
            Load a Rocq skill reference and append its full content to this
            conversation. Use this before (or between) proof attempts when you
            need detailed tactic guidance, stdlib lemma cheatsheets, error
            explanations, or proof templates.

            The set of legal `skill_name` values is shown to you as a table in
            the system prompt; calling with any other name returns an error
            message.
          schema:
            properties:
              skill_name:
                title: Skill Name
                type: string
            required:
              - skill_name
            title: ReadSkill
            type: object
        - name: SearchRocq
          description: |-
            Query Rocq's interactive REPL for introspection information about
            the current problem's context. Use this BEFORE proposing a proof,
            or AFTER a failed attempt where a lemma name was wrong, to discover
            real lemma names / types / definitions instead of guessing.

            Pass `command` as a full Rocq command terminated with a period.
            Examples:
              command="Search (_ + _ <= _ + _)."   # find lemmas matching a shape
              command="SearchPattern (_ * _)."     # narrower structural search
              command="Check Rabs_pos."            # show a lemma's statement
              command="Print Rsqr."                # show a definition's body
              command="About lia."                 # short summary of a tactic

            The output is whatever Rocq prints to its feedback channel. Long
            outputs are truncated; refine your query if you hit the truncation
            marker. Syntax errors come back as an error message that you can
            correct on your next turn.
          schema:
            properties:
              command:
                title: Command
                type: string
            required:
              - command
            title: SearchRocq
            type: object
    iter: 1
  output:
    outputs:
      - content: ''
        tool_calls:
          - name: ReadSkill
            args:
              skill_name: tactic-patterns
        finish_reason: tool_calls
    budget:
      values:
        num_requests: 1
        num_completions: 1
        input_tokens: 2266
        output_tokens: 21
        cached_input_tokens: 1664
        price: 0.0011704999999999999
    log_items: []
    model_name: gpt-5.4-2026-03-05
    usage_info:
      completion_tokens: 21
