                         '\n'
                         '## Goal Structure Patterns\n'
                         '\n'
                         '### Equality\n'
                         '| Goal | Tactic |\n'
                         '|------|--------|\n'
                         '| `x = x` | `reflexivity` |\n'
                         '| `f x = f y` | `f_equal` / `congr` |\n'
                         '| `x = y` (nat arithmetic) | `lia` / `ring` |\n'
                         '| `x = y` (real arithmetic) | `lra` / `ring` / `field` |\n'
                         '| `x = y` (rewrite needed) | `rewrite H` |\n'
                         '| `x = y` (unfold needed) | `unfold f; simpl` |\n'
                         '\n'
                         '### Universal Quantifier\n'
                         '| Goal | Tactic |\n'
                         '|------|--------|\n'
                         '| `forall x, P x` | `intros x` |\n'
                         '| `forall x y, P x y` | `intros x y` |\n'
                         '\n'
                         '### Existential Quantifier\n'
                         '| Goal | Tactic |\n'
                         '|------|--------|\n'
                         '| `exists x, P x` | `exists witness` |\n'
                         '| `{ x : A | P x }` | `exist witness` |\n'
                         '\n'
                         '### Implication\n'
                         '| Goal | Tactic |\n'
                         '|------|--------|\n'
                         '| `P -> Q` | `intros H` |\n'
                         '| `P -> Q` (with exact proof) | `exact (fun H => ...)` |\n'
                         '\n'
                         '### Conjunction\n'
                         '| Goal | Tactic |\n'
                         '|------|--------|\n'
                         '| `P /\\ Q` | `split` |\n'
                         '| `P /\\ Q /\\ R` | `repeat split` or `split; [|split]` |\n'
                         '\n'
                         '### Disjunction\n'
                         '| Goal | Tactic |\n'
                         '|------|--------|\n'
                         '| `P \\/ Q` (P provable) | `left` |\n'
                         '| `P \\/ Q` (Q provable) | `right` |\n'
                         '\n'
                         '### Negation\n'
                         '| Goal | Tactic |\n'
                         '|------|--------|\n'
                         '| `~P` | `intros H` (then derive `False`) |\n'
                         '| `P` (from `~~P`) | classical logic: `apply NNPP` |\n'
                         '\n'
                         '### Inequality\n'
                         '| Goal | Tactic |\n'
                         '|------|--------|\n'
                         '| `n < m` (nat) | `lia` / `omega` |\n'
                         '| `n <= m` (nat) | `lia` / `omega` |\n'
                         '| `x < y` (R) | `lra` / `nra` |\n'
