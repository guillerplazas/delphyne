                        4 * b * (a + 1) <= 4 * (b * b) + (a + 1) * (a + 1)
                    informal_statement: For any two real numbers a and b, show that $4b(a+1)\leq 4b^2+(a+1)^2$.
                    informal_proof: |-
                      The result comes from $x^2+y^2 \geq 2xy$ for all reals $x,y$, applied to $x=2b$ and
