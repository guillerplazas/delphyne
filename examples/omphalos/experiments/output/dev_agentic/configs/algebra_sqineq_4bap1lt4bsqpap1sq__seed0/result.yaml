                  ### Booleans
                  ```coq
                  destruct b.
                  - (* b = true *) ...
                  - (* b = false *) ...
                  ```

                  ### Option Types
                  ```coq
                  destruct o as [x|].
                  - (* Some x *) ...
                  - (* None *) ...
                  ```

