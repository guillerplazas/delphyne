                         '- (* Base case: n = 0 *) simpl. reflexivity.\n'
                         "- (* Inductive case: n = S n' *) simpl. rewrite IH. reflexivity.\n"
                         '```\n'
                         '\n'
                         '### Lists\n'
                         '```coq\n'
                         "induction l as [|x l' IH].\n"
                         '- (* Base case: l = nil *) simpl. reflexivity.\n'
                         "- (* Inductive case: l = x :: l' *) simpl. rewrite IH. reflexivity.\n"
                         '```\n'
                         '\n'
                         '### Booleans\n'
                         '```coq\n'
                         'destruct b.\n'
                         '- (* b = true *) ...\n'
                         '- (* b = false *) ...\n'
                         '```\n'
                         '\n'
                         '### Option Types\n'
