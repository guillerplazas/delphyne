                  Proof.
                    induction n as [|n' IH].
                    - (* Base case: n = 0 *)
                      admit. (* TODO *)
                    - (* Inductive case: n = S n' *)
                      (* IH : P n' *)
                      admit. (* TODO *)
                  Admitted.
                  ```

                  ## Case Analysis Template

                  ```coq
