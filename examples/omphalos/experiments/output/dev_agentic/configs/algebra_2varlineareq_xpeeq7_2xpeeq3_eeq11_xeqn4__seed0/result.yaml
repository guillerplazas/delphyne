                        (h0 : x + e = 7)
                        (h1 : 2 * x + e = 3) :
                        e = 11 /\ x = -4
                    informal_statement: |-
                      Given two complex numbers x and e, if we assume that $x + e = 7$ and $2x + e = 3$,
                         then show that $e = 11$ and $x=-4$.
                    informal_proof: |-
                      First, $x = 2x + e - (x + e) = 3 - 7 = -4$. Then, substituting $x=-4$ in $x+e=7$, we
                         obtain $e=11$.
                    imports: |-
                      Require Import Reals.
                      Require Import Coquelicot.Coquelicot.
                      Open Scope C_scope.
                  available_skills:
                    rocq-phrasebook: Common math-to-Rocq translations.
                    proof-templates: Structured proof skeletons for common patterns in Rocq.
                    tactics-reference: Comprehensive tactics reference for Rocq theorem proving.
