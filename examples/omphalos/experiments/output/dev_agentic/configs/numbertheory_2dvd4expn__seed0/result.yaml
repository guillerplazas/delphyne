                Structured proof skeletons for common patterns in Rocq.

                ## General Theorem Template

                ```coq
                Theorem theorem_name : forall (x : A), P x.
                Proof.
                  intros x.
                  (* Strategy: [describe approach] *)
                  (* Step 1: [what to prove first] *)
                  admit. (* TODO: fill *)
