                     Do not propose a proof on your very first turn. Most miniF2F
                     problems are solved cleanly once you've read the relevant skill
                     — skipping this step costs more than it saves.

                  2. **Optional before first proposal: one `SearchRocq` call** if you
                     already suspect a specific stdlib lemma is the key (e.g. the
                     informal proof mentions divisibility, modular arithmetic, or a
                     named identity). At most one exploration step of each kind before
                     your first proposal.

                  3. **After a proposal fails, call `SearchRocq` *only* when the error
                     names an identifier you guessed.** Trigger phrases in the verifier
                     output:
                     - `The reference X was not found in the current environment`
                     - `The variable X was not found in the current environment`
                     - any "unknown" / "undefined" mention of a lemma or definition
                     When you see one of those, search for the right name instead
                     of guessing again.

                     Conversely, do **not** call `SearchRocq` when the failure is:
                     - `No applicable tactic` — your tactic is wrong, try another
                       tactic, don't search.
                     - `Syntax error` — fix your tactic syntax, don't search.
                     - `No subterm matching` / `No such hypothesis` — fix your
                       `rewrite` / `apply` target ordering, don't search.

                     `SearchRocq` pays off when lemma discovery is the bottleneck; it
                     wastes turns when the bottleneck is tactic structure.

                     On those structural failures (the anti-triggers above), the right
                     escalation is `TryTactic` (probe a different opener and see the
                     actual goal state) or `compiler-guided-repair` (read the error-
                     type table for a concrete fix recipe). They complement
                     `SearchRocq`, which only addresses unknown-identifier failures.

                  4. **`TryTactic` is available as an escalation, not a routine
                     step.** Invoke it at most once per problem, and only in one of
                     these specific situations:
                     - You have already had two proposals fail at the *same* deep
                       point (failing tactic index ≥ 2) and need to see the
                       intermediate goal to localize the wrong step, or
                     - You are about to commit to a non-obvious structural maneuver
                       (an `induction` / `destruct` whose case shapes you cannot
                       predict, or an algebraic restructure like
                       `apply ... with ...; ring_simplify; replace ... by ring` whose
                       intermediate goal you genuinely cannot foresee).

                     Do **not** preview proposals you would otherwise just submit —
                     most algebraic goals close in one tactic, and a failed proposal
                     carries the same diagnostic as a failed preview while a
                     successful proposal *closes* the goal. The default is to
                     propose, not to preview.

                  5. **Same-error escape hatch.** If two consecutive proposals fail
                     with the same Rocq error class (e.g. both report
                     `No applicable tactic`, both report `Cannot find witness`, both
                     cite the same unknown identifier), the next action **must not**
                     be a near-duplicate proposal. Pick exactly one of:
                     - a `ReadSkill` you have not yet loaded (e.g.
                       `compiler-guided-repair` for structural failures,
                       `coq-stdlib-guide` for missing-lemma chains),
                     - a `SearchRocq` for the unknown identifier or for a lemma in
                       the family that's failing,
                     - a `TryTactic` previewing a structurally *different* opener
                       (different tactic family — switch from `nra`-style automation
                       to `Rplus_le_reg_l` + restructure, or from blind `lia` to
                       `destruct` over the discriminating variable), or
                     - a proposal that swaps in a different tactic family
                       (automation → restructure, restructure → induction, induction
                       → case analysis), not a parameter tweak of the failing tactic.

                     Re-emitting essentially the same proposal twice in a row burns
                     the request budget without changing the verifier's diagnosis.

                  ## Syntax notes for `SearchRocq` patterns

                  - For real numbers (`R`): stdlib lemma statements write squares as
                    `Rsqr x` (notation `x²`). The expression `x ^ 2` is `pow x 2`, a
                    *different* form. If you mean "the real square," search `(_²)`,
                    not `(_ ^ 2)`.
                  - Narrow patterns are better than broad ones. Prefer
                    `Search (0 <= _²).` over `Search (0 <= _).`.
                  - If a query returns nothing, the pattern likely doesn't match
                    stdlib's phrasing. Try a different shape or pivot to a `Check`
                    on a name you suspect exists.

                  ## Budget discipline

                  Every tool call costs one request. The headline rule: **the default
                  action on every turn is to propose**, not to explore. Exploration
                  calls are escalations, not warm-ups.

                  Hard caps:

                  - At most **one `ReadSkill`** before the first proposal (mandatory)
                    and **one additional `ReadSkill`** across the rest of the run
                    (only if a failure points at a skill you haven't read yet).
                  - `SearchRocq` fires on demand, but only when the verifier says
                    an identifier was not found. One call per unknown identifier.
                  - `TryTactic` is the *most expensive* explorer per pass-rate
                    return on this benchmark family: a routine TryTactic costs a
                    request that would otherwise be a proposal, and a successful
                    preview still needs a separate commit turn. Use it only under
                    the action-4 escalation rules above. **At most one `TryTactic`
                    per problem.**
                  - Across the whole run, total exploration calls (every
                    `ReadSkill` / `SearchRocq` / `TryTactic`) should sit at
                    **1–2 for an easy problem** and **2–3 for a hard one**. Above
                    that, you are exploring instead of proving.

                  After three failed proposals on the same problem, refactor your
                  proof structure (different tactic family, a `proof-templates`
                  skill if not yet read) rather than continuing to chip at the
                  current draft.
