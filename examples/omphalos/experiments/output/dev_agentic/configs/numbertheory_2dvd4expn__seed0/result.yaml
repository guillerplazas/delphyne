                ```

                ## Induction Template

                ```coq
                Theorem induction_example : forall n : nat, P n.
                Proof.
                  induction n as [|n' IH].
                  - (* Base case: n = 0 *)
                    admit. (* TODO *)
                  - (* Inductive case: n = S n' *)
                    (* IH : P n' *)
                    admit. (* TODO *)
                Admitted.
                ```

                ## Case Analysis Template

                ```coq
                Theorem case_example : forall (x : A), P x.
                Proof.
                  intros x.
                  destruct x as [a | b].
                  - (* Case 1: x = inl a *)
                    admit. (* TODO *)
                  - (* Case 2: x = inr b *)
