                        | Goal | Tactic |
                        |------|--------|
                        | `forall x, P x` | `intros x` |
                        | `forall x y, P x y` | `intros x y` |

                        ### Existential Quantifier
                        | Goal | Tactic |
                        |------|--------|
                        | `exists x, P x` | `exists witness` |
                        | `{ x : A | P x }` | `exist witness` |

                        ### Implication
                        | Goal | Tactic |
                        |------|--------|
                        | `P -> Q` | `intros H` |
                        | `P -> Q` (with exact proof) | `exact (fun H => ...)` |

                        ### Conjunction
                        | Goal | Tactic |
                        |------|--------|
                        | `P /\ Q` | `split` |
                        | `P /\ Q /\ R` | `repeat split` or `split; [|split]` |

                        ### Disjunction
                        | Goal | Tactic |
                        |------|--------|
