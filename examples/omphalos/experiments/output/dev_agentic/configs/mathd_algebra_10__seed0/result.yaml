                  ## Informal statement

                  What is the positive difference between $120\%$ of 30 and $130\%$ of 20? Show that it
                     is 10.

                  ## Informal proof sketch

                  One hundred twenty percent of 30 is $120\cdot30\cdot\frac{1}{100}=36$, and $130\%$ of
