                  title: SearchRocq
                  type: object
              - name: TryTactic
                description: |-
                  Preview the effect of applying a tactic (or short tactic prefix) to
                  the theorem's *initial* proof state, WITHOUT committing. Use this
                  when you're uncertain whether a structural choice (`induction n.`,
                  `destruct b.`, `case_eq ...`) will produce tractable subgoals, or
                  when a prior proposal died several tactics deep and you want to
                  confirm which step actually went wrong before redrafting.

                  Pass `tactics` as a Rocq proof body — one or more tactics, each
                  terminated with `.`, optionally fenced or newline-separated. The
                  tool replays them in order from the theorem's initial state and
                  returns:

                    - the resulting goal(s) if every tactic succeeded;
                    - "PROOF FINISHED" plus the closing tactics if the prefix
                      actually closes the goal (then emit them verbatim as your
                      final proof);
                    - the failing tactic + Rocq error if any step fails, along with
                      the prefix that did succeed.

                  The pytanque session is fresh per call, so there is NO shared
                  state between TryTactic invocations: every preview re-applies from
                  scratch. To preview after `intros a b.`, include `intros a b.` in
                  your `tactics` argument. Each call costs one request; prefer a few
                  informed previews over many speculative ones.

                  Examples:
                    tactics="intros a b.\ninduction a."
                    tactics="intros n.\ndestruct n as [|n']."
                    tactics="intros.\nlia."
