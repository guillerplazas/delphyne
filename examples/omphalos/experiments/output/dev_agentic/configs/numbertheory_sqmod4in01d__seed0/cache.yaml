            | Goal | Tactic |
            |------|--------|
            | `P -> Q` | `intros H` |
            | `P -> Q` (with exact proof) | `exact (fun H => ...)` |

            ### Conjunction
            | Goal | Tactic |
            |------|--------|
            | `P /\ Q` | `split` |
            | `P /\ Q /\ R` | `repeat split` or `split; [|split]` |

            ### Disjunction
            | Goal | Tactic |
            |------|--------|
            | `P \/ Q` (P provable) | `left` |
            | `P \/ Q` (Q provable) | `right` |

            ### Negation
