            ```coq
            induction n as [|n' IH].
            - (* Base case: n = 0 *) simpl. reflexivity.
            - (* Inductive case: n = S n' *) simpl. rewrite IH. reflexivity.
            ```

            ### Lists
            ```coq
            induction l as [|x l' IH].
            - (* Base case: l = nil *) simpl. reflexivity.
            - (* Inductive case: l = x :: l' *) simpl. rewrite IH. reflexivity.
