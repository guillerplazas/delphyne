                  ### Conjunction
                  | Goal | Tactic |
                  |------|--------|
                  | `P /\ Q` | `split` |
                  | `P /\ Q /\ R` | `repeat split` or `split; [|split]` |

                  ### Disjunction
                  | Goal | Tactic |
                  |------|--------|
                  | `P \/ Q` (P provable) | `left` |
                  | `P \/ Q` (Q provable) | `right` |

                  ### Negation
                  | Goal | Tactic |
                  |------|--------|
                  | `~P` | `intros H` (then derive `False`) |
