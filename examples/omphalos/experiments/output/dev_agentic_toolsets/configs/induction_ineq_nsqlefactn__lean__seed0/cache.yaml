          ```rocq
          intros n H.
          destruct n as [|n].
          - lia.
          - destruct n as [|n].
            + lia.
            + destruct n as [|n].
              * lia.
              * destruct n as [|n].
                { simpl. lia. }
                replace (fact (S (S (S (S n))))) with ((S (S (S (S n)))) * (S (S (S n))) * fact (S (S n))) by simpl; lia.
