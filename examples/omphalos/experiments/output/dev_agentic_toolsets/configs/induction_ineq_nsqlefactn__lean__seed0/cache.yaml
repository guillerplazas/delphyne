            lt_O_fact: forall n : nat, 0 < fact n
            fact_neq_0: forall n : nat, fact n <> 0
            fact_le: forall n m : nat, n <= m -> fact n <= fact m
            Rfunctions.fact_simpl: forall n : nat, fact (S n) = S n * fact n
