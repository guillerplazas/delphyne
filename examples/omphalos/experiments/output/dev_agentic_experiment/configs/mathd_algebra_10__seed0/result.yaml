                  |------|--------|
                  | `n < m` (nat) | `lia` / `omega` |
                  | `n <= m` (nat) | `lia` / `omega` |
                  | `x < y` (R) | `lra` / `nra` |

                  ## Domain-Specific Patterns

                  ### Natural Numbers
                  ```coq
                  induction n as [|n' IH].
