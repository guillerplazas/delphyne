            | `n < m` (nat) | `lia` / `omega` |
            | `n <= m` (nat) | `lia` / `omega` |
            | `x < y` (R) | `lra` / `nra` |

            ## Domain-Specific Patterns

            ### Natural Numbers
            ```coq
            induction n as [|n' IH].
            - (* Base case: n = 0 *) simpl. reflexivity.
            - (* Inductive case: n = S n' *) simpl. rewrite IH. reflexivity.
