            ### Booleans
            ```coq
            destruct b.
            - (* b = true *) ...
            - (* b = false *) ...
            ```

            ### Option Types
            ```coq
            destruct o as [x|].
            - (* Some x *) ...
            - (* None *) ...
            ```

            ### Real Analysis (with Reals library)
            ```coq
            Require Import Reals.
            Open Scope R_scope.
            (* Use lra for linear, nra for nonlinear *)
