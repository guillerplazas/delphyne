                      Let $a$ be an integer, then $a \pmod 3 \in {0, 1, 2}$.
                         Using that for any natural number $k$, $a \equiv b \pmod 3$ implies $a^k \equiv b^k
                         \pmod 3$, we have $a^2 \pmod 3 \in {0, 1, 4}$. Since $4 \equiv 1 \pmod 3$ the result
