                    theorem_name: numbertheory_sqmod3in01d
                    theorem_statement: |-
                      (a : Z) :
                        (a^2 mod 3 = 0) \/ (a^2 mod 3 = 1)
                    informal_statement: Show that the square of any integer is congruent to 0 or 1 modulo
                      3.
                    informal_proof: |-
                      Let $a$ be an integer, then $a \pmod 3 \in {0, 1, 2}$.
                         Using that for any natural number $k$, $a \equiv b \pmod 3$ implies $a^k \equiv b^k
                         \pmod 3$, we have $a^2 \pmod 3 \in {0, 1, 4}$. Since $4 \equiv 1 \pmod 3$ the result
                         follows.
                    imports: |-
                      Require Import ZArith.
                      Open Scope Z_scope.
                  available_skills:
                    rocq-phrasebook: Common math-to-Rocq translations.
                    proof-templates: Structured proof skeletons for common patterns in Rocq.
                    tactics-reference: Comprehensive tactics reference for Rocq theorem proving.
                    tactic-patterns: Quick reference for choosing tactics based on goal structure.
                    compilation-errors: Error-by-error guidance for Rocq compilation errors. Read this
                      first for any build error.
                    coq-stdlib-guide: Navigation guide for the Coq standard library and common packages.
                    admitted-filling: Primary reference for `Admitted`/`admit` elimination tactics used
                      in prove/autoprove work phase.
                    proof-golfing-patterns: Detailed pattern explanations for Rocq proof optimization.
                    axiom-elimination: Reference for systematically eliminating custom axioms in Rocq
                      proofs.
                  prefix:
                    - kind: oracle
                      answer:
                        mode: null
                        content: ''
                        tool_calls:
                          - name: ReadSkill
