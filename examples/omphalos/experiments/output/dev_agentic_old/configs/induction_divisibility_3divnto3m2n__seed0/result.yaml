                Theorem induction_example : forall n : nat, P n.
                Proof.
                  induction n as [|n' IH].
                  - (* Base case: n = 0 *)
                    admit. (* TODO *)
                  - (* Inductive case: n = S n' *)
                    (* IH : P n' *)
                    admit. (* TODO *)
                Admitted.
                ```

                ## Case Analysis Template

                ```coq
                Theorem case_example : forall (x : A), P x.
                Proof.
                  intros x.
                  destruct x as [a | b].
                  - (* Case 1: x = inl a *)
                    admit. (* TODO *)
                  - (* Case 2: x = inr b *)
                    admit. (* TODO *)
                Admitted.
                ```

                ## Calculation Chain Template

                ```coq
                Theorem calc_example : forall n : nat, f n = g n.
                Proof.
                  intros n.
                  (* Step-by-step rewriting *)
                  unfold f.
                  rewrite lemma1.
                  rewrite lemma2.
                  unfold g.
                  reflexivity.
                Qed.
                ```

                ## Existential Proof Template

                ```coq
                Theorem exists_example : exists n : nat, P n.
                Proof.
                  exists 42. (* witness *)
                  (* Now prove: P 42 *)
                  admit. (* TODO *)
