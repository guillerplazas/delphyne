                          - (* Case 1: x = inl a *)
                            admit. (* TODO *)
                          - (* Case 2: x = inr b *)
                            admit. (* TODO *)
                        Admitted.
                        ```

                        ## Calculation Chain Template

                        ```coq
                        Theorem calc_example : forall n : nat, f n = g n.
                        Proof.
                          intros n.
                          (* Step-by-step rewriting *)
                          unfold f.
                          rewrite lemma1.
                          rewrite lemma2.
                          unfold g.
                          reflexivity.
                        Qed.
                        ```

