                     $2.(3a).(6z) \leq (3.a)^2 + (6.z)^2$ . Then use that for all real numbers $x,y$,
                     $x^2+y^2 \geq 2xy$, with $x=3a$ and $y=6z$.

                  Reply with a fenced code block containing only the body of the proof
                  (no `Proof.`, no `Qed.`).
