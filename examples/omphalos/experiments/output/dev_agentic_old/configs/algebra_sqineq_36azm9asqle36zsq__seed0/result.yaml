                    theorem_statement: |-
                      (z a : R) :
                        36 * (a * z) - 9 * a^2 <= 36 * z^2
                    informal_statement: For real numbers a and z, show that $36az - 9a^2 \leq 36z^2$.
                    informal_proof: |-
                      We can rewrite the inequality as $2.(3a).(6z) - (3.a)^2 \leq (6.z)^2$, then
                         $2.(3a).(6z) \leq (3.a)^2 + (6.z)^2$ . Then use that for all real numbers $x,y$,
                         $x^2+y^2 \geq 2xy$, with $x=3a$ and $y=6z$.
                    imports: |-
                      Require Import Reals.
                      Open Scope R_scope.
                  available_skills:
                    rocq-phrasebook: Common math-to-Rocq translations.
                    proof-templates: Structured proof skeletons for common patterns in Rocq.
