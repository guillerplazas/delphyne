                  Prove the following theorem in Rocq.

                  ## Imports already in scope

                  ```rocq
                  Require Import Nat.
                  Require Import Arith.
                  ```

                  ## Theorem

                  ```rocq
                  Theorem numbertheory_2dvd4expn :
                    forall n : nat,
                    n <> 0 ->
                    Nat.divide 2 (4^n).
                  ```

                  ## Informal statement

                  Show that for any positive integer $n$, $2$ divides $4^n$.

                  ## Informal proof sketch

                  We have $4^n = (2^2)^n = 2^{2n}$. Since $n > 0$ we have that $2n > 0$, so $2$ divides
                     $4^n$.

                  Reply with a fenced code block containing only the body of the proof
                  (no `Proof.`, no `Qed.`).
