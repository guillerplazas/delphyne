          assert (Hmod : 2 ^ n mod 7 = 1).
          { rewrite Hk.
            rewrite Nat.add_mod by discriminate.
            rewrite Nat.mul_mod by discriminate.
            simpl.
            reflexivity. }
          assert (Hcycle : forall m : nat, 2 ^ m mod 7 = match m mod 3 with 0 => 1 | 1 => 2 | _ => 4 end).
          { intro m.
            induction m as [|m IH].
            - simpl. reflexivity.
            - rewrite Nat.pow_succ_r' by lia.
              rewrite Nat.mul_mod by discriminate.
              rewrite IH.
              destruct (m mod 3) eqn:E.
              + simpl.
                replace (S m mod 3) with 1 by (rewrite Nat.mod_eq by lia; lia).
                reflexivity.
              + simpl.
                replace (S m mod 3) with 2 by (rewrite Nat.mod_eq by lia; lia).
                reflexivity.
              + assert (Hm : m mod 3 < 3) by (apply Nat.mod_upper_bound; lia).
                assert (Hmz : m mod 3 = 2) by lia.
                rewrite Hmz.
                simpl.
                replace (S m mod 3) with 0 by (rewrite Nat.mod_eq by lia; lia).
                reflexivity. }
          assert (Hnmod : n mod 3 = 0).
          { specialize (Hcycle n).
            rewrite Hmod in Hcycle.
            destruct (n mod 3); simpl in Hcycle; try discriminate; reflexivity. }
          exists (n / 3).
          apply Nat.mod_divides in Hnmod; lia.
          ```
