            rewrite Z.add_mod by lia.
            rewrite Z.mod_mul by lia.
            rewrite Z.mod_mul by lia.
            simpl.
            reflexivity.
          - right.
            assert (Ha : a = 3 * (a / 3) + 2).
            { pose proof (Z_div_mod_eq a 3 ltac:(lia)) as Hdm. lia. }
            rewrite Ha.
            replace ((3 * (a / 3) + 2) ^ 2) with (9 * (a / 3) ^ 2 + 12 * (a / 3) + 4) by ring.
            rewrite Z.add_mod by lia.
            rewrite Z.add_mod by lia.
            rewrite Z.mod_mul by lia.
            rewrite Z.mod_mul by lia.
            simpl.
            reflexivity.
          ```
