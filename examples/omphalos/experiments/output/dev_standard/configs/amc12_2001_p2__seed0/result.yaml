                  \ (a b n : nat) :\n  (1 <= a <= 9) -> (0 <= b <= 9) -> (n = 10 * a + b) -> (n = a *\
                  \ b + a + b) -> \n  (b = 9).\n```\n\n## Informal statement\n\nLet $P(n)$ and $S(n)$\
                  \ denote the product and the sum, respectively, of the digits\n   of the integer $n$.\
                  \ For example, $P(23) = 6$ and $S(23) = 5$. Suppose $N$ is a\n   two-digit number such\
                  \ that $N = P(N)+S(N)$. What is the units digit of $N$?\n\n   $\\text{(A)}\\ 2\\qquad\
                  \ \\text{(B)}\\ 3\\qquad \\text{(C)}\\ 6\\qquad \\text{(D)}\\ 8\\qquad\n   \\text{(E)}\\\
                  \ 9$ Show that it is (\\text{E})9.\n\n## Informal proof sketch\n\nDenote $a$ and $b$\
                  \ as the tens and units digit of $N$, respectively. Then $N =\n   10a+b$. It follows\
                  \ that $10a+b=ab+a+b$, which implies that $9a=ab$. Since $a\\neq0$,\n   $b=9$. So the\
                  \ units digit of $N$ is $(\\text{E})9$.\n\nReply with a fenced code block containing\
                  \ only the body of the proof\n(no `Proof.`, no `Qed.`)."
