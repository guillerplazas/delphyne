                          {
                            assert (H : forall m : nat,
                              ((2 ^ Z.of_nat m) mod 7 = 1 \/ (2 ^ Z.of_nat m) mod 7 = 2 \/ (2 ^ Z.of_nat m) mod 7 = 4)%Z).
