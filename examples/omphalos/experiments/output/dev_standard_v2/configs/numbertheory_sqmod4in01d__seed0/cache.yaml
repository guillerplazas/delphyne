            | `a + b`, `a - b`, `a*b` | `a + b`, `a - b`, `a * b` |
            | `a / b`               | `a / b` (in `R_scope`)    |
            | `a ≤ b`, `a < b`      | `a <= b`, `a < b`         |
            | `|a|`                 | `Rabs a`                  |
            | `√a`                  | `sqrt a`                  |
            | `a^n`                 | `a^n` or `pow a n`        |
            | `∀ x, P x`            | `forall x, P x`           |
            | `∃ x, P x`            | `exists x, P x`           |
            | `P ∧ Q`, `P ∨ Q`, `¬P`| `P /\ Q`, `P \/ Q`, `~ P` |

