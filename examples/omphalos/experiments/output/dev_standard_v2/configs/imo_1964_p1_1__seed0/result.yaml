                          assert (2 ^ n - 1 = 0).
                          { nia. }
                          destruct n as [|[|[|n]]].
                          - exists 0. reflexivity.
                          - simpl in H. discriminate.
                          - simpl in H. discriminate.
                          - exfalso.
                            assert (Hge : 7 <= 2 ^ S (S (S n)) - 1).
                            { simpl. nia. }
                            lia.
                          ```
