                  ## General Tactics (Always Worth Trying)

                  **Automation:** `auto`, `eauto`, `trivial`, `tauto`, `intuition`, `firstorder`

                  **Structuring:** `intros`, `destruct`, `induction`, `split`, `left`, `right`, `exists`

