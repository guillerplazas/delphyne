                    compiler-guided-repair: Quick reference for compiler-guided proof repair. Escalation-only
                      — not first-pass.
                    coq-stdlib-guide: Navigation guide for the Coq standard library and common packages.
                    admitted-filling: Primary reference for `Admitted`/`admit` elimination tactics used
                      in prove/autoprove work phase.
                    proof-golfing-patterns: Detailed pattern explanations for Rocq proof optimization.
                    axiom-elimination: Reference for systematically eliminating custom axioms in Rocq
                      proofs.
