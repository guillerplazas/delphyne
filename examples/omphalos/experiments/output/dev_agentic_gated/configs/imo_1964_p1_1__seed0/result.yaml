                  | Goal | Tactic |
                  |------|--------|
                  | `P -> Q` | `intros H` |
                  | `P -> Q` (with exact proof) | `exact (fun H => ...)` |

                  ### Conjunction
                  | Goal | Tactic |
                  |------|--------|
                  | `P /\ Q` | `split` |
