            # Tactic Patterns

            Quick reference for choosing tactics based on goal structure.

            ## Goal Structure Patterns

            ### Equality
            | Goal | Tactic |
            |------|--------|
            | `x = x` | `reflexivity` |
            | `f x = f y` | `f_equal` / `congr` |
            | `x = y` (nat arithmetic) | `lia` / `ring` |
