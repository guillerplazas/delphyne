                  ### Disjunction
                  | Goal | Tactic |
                  |------|--------|
                  | `P \/ Q` (P provable) | `left` |
                  | `P \/ Q` (Q provable) | `right` |

                  ### Negation
                  | Goal | Tactic |
                  |------|--------|
                  | `~P` | `intros H` (then derive `False`) |
