                     - `SearchRocq(command="Check Rabs_pos.")` — confirm a lemma exists
                       and inspect its type before citing it in a tactic.
                     - `SearchRocq(command="Print Rsqr.")` — show a definition's body.

                  4. **Call the `TryTactic` tool.** Previews the effect of a tactic
                     prefix on the theorem's *initial* proof state, WITHOUT committing.
                     Rocq proof state is functional, so this is a non-destructive look
                     at what `induction n.` / `destruct b.` / `case_eq ...` would do
                     before you draft a full script. The tool returns either the
                     resulting goal(s), `PROOF FINISHED` if the prefix closes the goal
                     (then emit those tactics verbatim as your final proof), or the
                     failing tactic + Rocq error if a step fails. Each `TryTactic` call
                     re-applies from scratch — there is no shared state between
                     invocations, so include any prerequisite tactics (e.g.
                     `intros n.`) in every preview. Examples:

                     - `TryTactic(tactics="intros n.\ninduction n.")` — see what the
                       base / step cases look like before drafting.
                     - `TryTactic(tactics="intros b.\ndestruct b.")` — see whether the
                       two cases simplify to something tractable.
                     - `TryTactic(tactics="intros n u H0 Hrec.\ninduction n as [|n IH].")`
                       — preview a structural opener with named hypotheses.

                     `TryTactic` is for **structural exploration** only. It is **not**
