                  \nShow that for any real numbers $a$ and $b$ such that $a^2 + b^2 = 2$, $ab \\leq 1$.\n\
                  \n## Informal proof sketch\n\nWe have that $0 \\leq (a-b)^2 = a^2 - 2ab + b^2$. Since\
