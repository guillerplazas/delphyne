  section: tactics
- content: 'When the context consists of real variables with equations x plus y equals
    7 and 3 times x plus y equals 45, introduce the variables and equations and use
    nra for a polynomial arithmetic conclusion. This applies only to that checked
    real-equation shape with the required arithmetic environment; it is not a general
    substitute for exposing opaque definitions or for goals outside the supported
    nonlinear arithmetic fragment.


