  section: tactics
- content: 'When the introduced hypotheses are Ht, Hs, and Hn, with Hn fixing n to
    3%nat, substitute n using Hn. Then normalize the resulting closed cast and natural
    expression in Hs with cbv [INR] followed by simpl, and invoke nra. This applies
    only when substitution makes the relevant expression closed and the normalized
    hypotheses suffice for real arithmetic; the hypothesis names, fixed value, and
    theorem shape must be adapted and rechecked elsewhere.


    Source-local example (mathd_algebra_247; snippet-3ea7bc9ca315fe0585059b44). Valid
    only in its source context; check adapted names and hypotheses in the current
    theorem before reuse.

    ```rocq

    intros t s n Ht Hs Hn.

    subst n.

    cbv [INR] in Hs.

    simpl in Hs.

    nra.

    ```'
