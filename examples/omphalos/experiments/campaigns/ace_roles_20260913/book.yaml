- content: 'For a theorem with no variables or hypotheses whose goal is a closed equality
    formed from the in-scope finite-list computation, evaluate it with the available
    virtual-machine computation tactic and then close the remaining definitional equality
    by reflexivity. This applies only when the relevant definitions, including dividesb,
    and required imports are available; it does not justify broad computation on symbolic
    or unbounded goals.


    Source-local example (mathd_numbertheory_403; snippet-981c918cd51660544d64b0e7).
    Valid only in its source context; check adapted names and hypotheses in the current
    theorem before reuse.

    ```rocq

    vm_compute.

    reflexivity.

    ```'
