bullets:
- content: 'When `Hf : forall x, f x = polynomial x` and `Hx : f x <= 0`, use `rewrite
    Hf in Hx` to expose the polynomial before invoking `nra`; merely specializing
    `Hf` does not connect it to `Hx`.

    '
  harmful: 0
  helpful: 5
  id: rocq-00001
  section: pitfalls
- content: 'For an induction hypothesis relating recursive `sum_f` expressions, if
    `rewrite IH` fails after `simpl`, use `change` to expose the successor case explicitly
    as `sum_f ... n + f n = sum_f ... n + g n + S n`; then apply `rewrite IH; lia`.

    '
  harmful: 0
  helpful: 0
  id: rocq-00002
  section: tactics
- content: 'For goals over `nat` with hypotheses such as `(n - 1) * n * (n + 1) =
    k` and a successor or exact-value conclusion, use `intros` followed by `nia`;
    it can handle the nonlinear products and truncated subtraction directly.

    '
  harmful: 3
  helpful: 4
  id: rocq-00003
  section: tactics
- content: 'For closed `nat` equalities built from executable finite-list operations
    such as `seq`, `filter`, boolean predicates, and `fold_right`, try `vm_compute`;
    use `reflexivity` afterward if the resulting definitional equality is not closed
    automatically.

    '
  harmful: 1
  helpful: 1
  id: rocq-00004
  section: tactics
- content: 'When applying a recurrence hypothesis whose predecessor uses truncated
    subtraction, first prove the exact natural-number equality (for example, `((2
    * S k + 1) - 2)%nat = 2 * k + 1` by `simpl; lia`), then rewrite with that equality
    before applying the hypothesis so its indices unify.

    '
  harmful: 0
  helpful: 0
  id: rocq-00005
  section: pitfalls
- content: 'Under an active `R_scope`, annotate natural-number indices, arithmetic,
    and order conditions with `%nat` (for example, `(1 < n)%nat`); reserve `INR` and
    unannotated arithmetic for real-valued conclusions to avoid coercion and comparison-type
    errors.

    '
  harmful: 0
  helpful: 6
  id: rocq-00006
  section: pitfalls
- content: 'For nat modulo goals, explicitly instantiate `Nat.div_mod_eq x y`; rewrite
    a hypothesis `x mod y = r` to obtain `x = y * (x / y) + r`, then use `nia` for
    the resulting arithmetic. When the dividend is normalized as `r + q * m`, use
    `Nat.Div0.mod_add` first and simplify the remaining `r mod m`.

    '
  harmful: 0
  helpful: 0
  id: rocq-00007
  section: lemmas
- content: 'For finite nonnegative real sequences with a fixed-sum product goal, prove
    the stronger normalized inequality `prod_n a n <= (sum_n a n / INR n)^n` first,
    preserving an arbitrary sum or average throughout the induction; specialize to
    `sum_n a n = INR n` only afterward.

    '
  harmful: 0
  helpful: 0
  id: rocq-00009
  section: strategy
- content: 'Do not obtain a successor product bound by multiplying an induction hypothesis
    such as `prod_n a (S n) <= 1` by an arbitrary nonnegative factor: that factor
    may exceed `1`. An induction proof must retain a bound parameterized by the total
    sum or average.

    '
  harmful: 0
  helpful: 0
  id: rocq-00010
  section: pitfalls
- content: 'Before using `nra` in AM-GM base or successor cases, unfold or rewrite
    the relevant `sum_n` and `prod_n` expressions, including base cases such as `sum_n
    a 0` and `prod_n a 1`, and prove any required `INR n <> 0` denominator condition;
    `nra` cannot reason through opaque recursive definitions or supply the global
    inequality.

    '
  harmful: 0
  helpful: 1
  id: rocq-00011
  section: tactics
- content: 'For a real goal `0 <= t^2` where `Rle_0_sqr` does not unify directly,
    use `replace (t^2) with (t * t) by ring; apply Rle_0_sqr`; use `ring` separately
    for completing-square identities before finishing the resulting linear inequality
    with `lra`.

    '
  harmful: 0
  helpful: 2
  id: rocq-00012
  section: tactics
- content: 'For positivity of a recursive real product whose successor factor is `1
    + / d`, prove `0 < d` with `Rmult_pos_pos`, obtain `0 < / d` via `Rinv_0_lt_compat`,
    prove the factor with `lra`, and finish the product with `apply Rmult_pos_pos;
    assumption`; `nra` does not infer positivity through opaque recursive products.

    '
  harmful: 0
  helpful: 0
  id: rocq-00013
  section: lemmas
- content: 'For natural-number product bounds, use `Nat.mul_le_mono` to combine factor
    inequalities such as `3 <= y` and `2 <= z`, and use `Nat.mul_le_mono_nonneg_r`
    to multiply an established inequality by a nonnegative factor; provide the premises
    in the lemma''s expected order instead of guessing a multiplication-monotonicity
    API.

    '
  harmful: 0
  helpful: 0
  id: rocq-00014
  section: lemmas
- content: 'To lift a natural bound into `R`, expose the coercion and apply `le_INR`:
    for example, prove `2 <= INR c` with `change INR 2 <= INR c; apply le_INR; lia`;
    for strict positivity of a cast, apply `lt_0_INR` to the natural positivity hypothesis
    rather than using a nonexistent `.mpr` projection.

    '
  harmful: 0
  helpful: 1
  id: rocq-00015
  section: lemmas
- content: 'For real equations involving a single reciprocal `1 / x`, after proving
    `x <> 0`, multiply explicitly by `x` and expose the inverse identity with `unfold
    Rdiv` and `assert (x * / x = 1) by exact (Rinv_r x Hx)`; then use `ring` and `nra`
    on the resulting polynomial equation instead of relying on `field_simplify` to
    normalize it.

    '
  harmful: 0
  helpful: 0
  id: rocq-00016
  section: pitfalls
- content: 'To turn `Rabs t = 1` into a sign disjunction, destruct `(Rle_or_lt 0 t)`;
    in the nonnegative branch rewrite with `Rabs_pos_eq t H`, and in the negative
    branch rewrite with `Rabs_left t H`, yielding `t = 1 \/ t = -1` by `lra`.

    '
  harmful: 0
  helpful: 0
  id: rocq-00017
  section: tactics
- content: 'For bounded natural searches involving `Nat.lcm` or `Nat.gcd`, avoid broad
    `vm_compute`, `compute`, or `simpl [Nat.gcd]`, since recursive evaluation can
    stack-overflow; reduce only explicitly closed numeral cases, using `change` to
    expose a known numeral equality when needed.

    '
  harmful: 0
  helpful: 0
  id: rocq-00018
  section: pitfalls
- content: 'When proving a least witness by finite exclusion, first split with `destruct
    (le_gt_dec bound m) as [Hge | Hlt]`; close the lower-bound branch immediately,
    handle the finitely many numeral cases explicitly under `Hlt`, and discharge any
    residual symbolic successor branch directly from `Hlt` rather than using blanket
    `all:` tactics or unstable numbered selectors.

    '
  harmful: 1
  helpful: 1
  id: rocq-00019
  section: strategy
- content: 'For instantiated recurrence equations containing closed casts and natural
    sums, use `cbv [INR]` to evaluate the casts, then normalize each index explicitly
    with `replace (a + b)%nat with c%nat in H by reflexivity`; after these rewrites,
    `lra` can solve the resulting linear real-equation chain.

    '
  harmful: 1
  helpful: 0
  id: rocq-00020
  section: tactics
- content: 'For an explicit `Ensemble` built from nested `Add`, first unfold `Add`
    and rewrite membership using the corresponding `Empty_set`, `Singleton`, and `Union`
    equivalences; once the resulting disjunctions and `False` cases are exposed, use
    `intuition; lia`. For cardinality, apply `card_add` layer by layer, prove each
    freshness premise by unfolding `In` and `Add` and inverting membership hypotheses,
    and finish the empty base with `card_empty`.

    '
  harmful: 0
  helpful: 1
  id: rocq-00021
  section: tactics
- content: "For trigonometric goals involving complementary or doubled angles, use\
    \ the library lemma with the exact goal orientation\u2014such as `sin_PI_x` or\
    \ `sin_2a`, rewriting with it before `reflexivity` when necessary. For positivity\
    \ of `sin x`, apply `sin_gt_0` and prove the bounds `0 < x` and `x < PI` explicitly.\n"
  harmful: 0
  helpful: 0
  id: rocq-00022
  section: lemmas
- content: 'For logarithmic inequalities and identities, derive `0 < ln a` from `1
    < a` by applying `ln_increasing` to obtain `ln 1 < ln a` and rewriting with `ln_1`.
    For `ln (t ^ 2) = 2 * ln t`, use `ln_pow` with a proof that the base `t` is positive,
    normalize the casted exponent with `cbv [INR]`, and use the resulting instantiated
    equality directly.

    '
  harmful: 0
  helpful: 1
  id: rocq-00023
  section: lemmas
- content: 'For an unbounded quadratic equation over `nat` that `nia` cannot solve
    directly, split with `destruct (lt_dec b k)` to obtain a finite bound. In the
    other branch derive `k * k <= b * b` with `rewrite Nat.square_le_mono; lia`, then
    let `nia` derive the contradiction from the original equation.

    '
  harmful: 0
  helpful: 0
  id: rocq-00024
  section: tactics
- content: 'A closed cast such as `INR 4` is not necessarily definitionally convertible
    to `(4 : R)`, so `change` may fail. First prove an explicit equality, for example
    with `cbv [INR]; ring`, and rewrite with that equality before applying real arithmetic.

    '
  harmful: 0
  helpful: 0
  id: rocq-00025
  section: pitfalls
- content: 'For a target or hypothesis containing `ln (a * b)`, explicitly rewrite
    it with `ln_mult a b Ha Hb` before calling `nra`; arithmetic automation does not
    expose this logarithmic product identity on its own.

    '
  harmful: 0
  helpful: 0
  id: rocq-00026
  section: lemmas
- content: 'For real square-root goals, use `pow2_sqrt` to prove `sqrt t ^ 2 = t`
    from `0 <= t`, and use `sqrt_pow2` to prove `sqrt (t ^ 2) = t` from `0 <= t`;
    to compare a root with `1 / 2`, first rewrite `sqrt ((1 / 2 : R) ^ 2)` using `sqrt_pow2`,
    then apply `sqrt_le_1_alt`.

    '
  harmful: 0
  helpful: 0
  id: rocq-00027
  section: lemmas
- content: "When two root hypotheses describe values of a quadratic function, first\
    \ rewrite the function equation into both hypotheses. If distinctness can rule\
    \ out a zero constant term, establish that nonzero fact separately. Use real arithmetic\
    \ to derive a product equal to zero, split it with the real multiplication-integral\
    \ lemma, eliminate the impossible zero-factor branch using the nonzero fact, and\
    \ finish the remaining linear consequence with arithmetic. This applies when the\
    \ hypotheses and distinctness condition have the stated algebraic shape and the\
    \ required real arithmetic lemmas are available; it does not replace proving the\
    \ nonzero factor or apply before the factorization has been established.\n\nSource-local\
    \ example (mathd_algebra_206; snippet-deb4bdf72e8154f880c5d807). Valid only in\
    \ its source context; check adapted names and hypotheses in the current theorem\
    \ before reuse.\n```rocq\nintros a b f Hf Hneq H2 H3.\nrewrite Hf in H2, H3.\n\
    assert (Hb : b <> 0).\n{ intro Hb0.\n  subst b.\n  apply Hneq.\n  nra.\n}\nassert\
    \ (Hfac : b * (2 * a - 1) = 0) by nra.\ndestruct (Rmult_integral _ _ Hfac) as\
    \ [Hb0 | Ha0].\n- exfalso.\n  apply Hb.\n  exact Hb0.\n- nra.\n```"
  harmful: 0
  helpful: 0
  id: rocq-00028
  section: tactics
- content: 'For a natural-number modulo goal of this form, first rewrite the dividend
    as a numeral remainder plus a multiple of the modulus, then use the modulo-addition
    lemma and close the numeral remainder by computation. This applies when the goal
    is over natural numbers, the modulo-addition lemma is available, and arithmetic
    automation can verify the normalization equality. A positivity hypothesis on the
    variable is unnecessary for this identity and does not by itself generalize the
    pattern to other coefficients or moduli.


    Source-local example (mathd_numbertheory_301; snippet-46b6047582fa5f8d5c2a2d14).
    Valid only in its source context; check adapted names and hypotheses in the current
    theorem before reuse.

    ```rocq

    intros j Hj.

    replace (3 * (7 * j + 3)) with (2 + (3 * j + 1) * 7) by nia.

    rewrite Nat.Div0.mod_add.

    reflexivity.

    ```'
  harmful: 0
  helpful: 0
  id: rocq-00029
  section: lemmas
- content: "For a natural-number equation with the exact shape 10 raised to x multiplied\
    \ by 100 raised to 2 times x equals 1000 raised to 5, rewrite 100 and 1000 as\
    \ powers of 10, combine powers and normalize the exponents, then use injectivity\
    \ of exponentiation with base 10 to derive 5 times x equals 15 and finish with\
    \ natural-number arithmetic. This requires the Peano natural-arithmetic lemmas\
    \ and arithmetic tactics available in the checked environment; it does not generalize\
    \ to arbitrary bases or differently shaped equations without corresponding power-normalization\
    \ and injectivity results.\n\nSource-local example (amc12a_2016_p2; snippet-eb3200b523bd89db04b200d2).\
    \ Valid only in its source context; check adapted names and hypotheses in the\
    \ current theorem before reuse.\n```rocq\nintros x H.\nassert (Hleft : 10 ^ x\
    \ * 100 ^ (2 * x) = 10 ^ (5 * x)).\n{ replace 100 with (10 ^ 2) by reflexivity.\n\
    \  rewrite <- Nat.pow_mul_r.\n  rewrite <- Nat.pow_add_r.\n  replace (x + 2 *\
    \ (2 * x)) with (5 * x) by nia.\n  reflexivity.\n}\nassert (Hright : 1000 ^ 5\
    \ = 10 ^ 15).\n{ replace 1000 with (10 ^ 3) by reflexivity.\n  rewrite <- Nat.pow_mul_r.\n\
    \  replace (3 * 5) with 15 by reflexivity.\n  reflexivity.\n}\nrewrite Hleft,\
    \ Hright in H.\nassert (Hexp : 5 * x = 15).\n{ apply Nat.pow_inj_r with (a :=\
    \ 10).\n  - lia.\n  - exact H.\n}\nnia.\n```"
  harmful: 0
  helpful: 0
  id: rocq-00030
  section: strategy
- content: 'For a natural-number theorem whose introduced hypotheses include exactly
    the product equation involving n minus one, n, and n plus one equaling 720, introduce
    the variables and equation and use nia to solve the resulting goal. This is limited
    to that domain, equation shape, and conclusion pattern; verify the surrounding
    theorem before reuse.


    Source-local example (mathd_numbertheory_326; snippet-a2b3deb1390a5ca295114bff).
    Valid only in its source context; check adapted names and hypotheses in the current
    theorem before reuse.

    ```rocq

    intros n H.

    nia.

    ```'
  harmful: 0
  helpful: 0
  id: rocq-00031
  section: tactics
- content: "For an odd-index recurrence over natural numbers introduced with the stated\
    \ function, base, even-case, and odd-rule hypotheses, establish the odd-index\
    \ formula by induction. In the successor case, prove the truncated-subtraction\
    \ predecessor equality before rewriting the recurrence, then normalize the successor\
    \ cast and the final closed index before linear arithmetic. Applicability requires\
    \ the corresponding recurrence shape and availability of the natural oddness,\
    \ successor-cast, arithmetic, and cast-evaluation lemmas used by the checked source\
    \ proof.\n\nSource-local example (amc12a_2017_p7; snippet-14257370c44c7fad96cb291c).\
    \ Valid only in its source context; check adapted names and hypotheses in the\
    \ current theorem before reuse.\n```rocq\nintros f Hbase Heven Hodd_rule.\nassert\
    \ (Hoddform : forall k : nat, f (2 * k + 1)%nat = 2 * INR k + 2).\n{ intro k.\n\
    \  induction k as [| k IH].\n  - simpl. rewrite Hbase. simpl. lra.\n  - assert\
    \ (Hgt : (1 < 2 * S k + 1)%nat) by lia.\n    assert (Hpar : Nat.odd (2 * S k +\
    \ 1)%nat = true).\n    { apply Nat.odd_odd. }\n    pose proof (Hodd_rule (2 *\
    \ S k + 1)%nat (conj Hgt Hpar)) as Hrec.\n    assert (Heq : ((2 * S k + 1) - 2)%nat\
    \ = (2 * k + 1)%nat) by lia.\n    rewrite Heq in Hrec.\n    rewrite Hrec, IH,\
    \ S_INR.\n    lra.\n}\nassert (Hidx : (2 * 1008 + 1)%nat = 2017%nat) by reflexivity.\n\
    rewrite <- Hidx.\nrewrite (Hoddform 1008%nat).\ncbv [INR].\nlra.\n```"
  harmful: 0
  helpful: 0
