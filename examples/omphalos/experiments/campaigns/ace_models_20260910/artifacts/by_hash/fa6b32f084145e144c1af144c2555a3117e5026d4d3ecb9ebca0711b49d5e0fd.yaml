bullets:
- content: 'When `Hf : forall x, f x = polynomial x` and `Hx : f x <= 0`, use `rewrite
    Hf in Hx` to expose the polynomial before invoking `nra`; merely specializing
    `Hf` does not connect it to `Hx`.

    '
  harmful: 0
  helpful: 5
  id: rocq-00001
  section: pitfalls
- content: 'For an induction hypothesis relating recursive `sum_f` expressions, if
    `rewrite IH` fails after `simpl`, use `change` to expose the successor case explicitly
    as `sum_f ... n + f n = sum_f ... n + g n + S n`; then apply `rewrite IH; lia`.

    '
  harmful: 0
  helpful: 1
  id: rocq-00002
  section: tactics
- content: For natural-number polynomial constraints such as `(n - 1) * n * (n + 1)
    = k`, where the subtraction is a simple linear term and the remaining expressions
    are polynomial, introduce the variables and try `nia`; it can handle this truncated
    subtraction together with the nonlinear products. Do not expect this route to
    solve goals that retain opaque non-polynomial subterms.
  harmful: 3
  helpful: 5
  id: rocq-00003
  section: tactics
- content: 'When applying a recurrence hypothesis whose predecessor uses truncated
    subtraction, first prove the exact natural-number equality (for example, `((2
    * S k + 1) - 2)%nat = 2 * k + 1` by `simpl; lia`), then rewrite with that equality
    before applying the hypothesis so its indices unify.

    '
  harmful: 0
  helpful: 1
  id: rocq-00005
  section: pitfalls
- content: 'Under an active `R_scope`, annotate natural-number indices, arithmetic,
    and order conditions with `%nat` (for example, `(1 < n)%nat`); reserve `INR` and
    unannotated arithmetic for real-valued conclusions to avoid coercion and comparison-type
    errors.

    '
  harmful: 0
  helpful: 7
  id: rocq-00006
  section: pitfalls
- content: 'For natural modulo goals, first prove `Hy : y <> 0`. Instantiate `Nat.div_mod_eq
    x y Hy` to obtain `x = y * (x / y) + x mod y`, rewrite a hypothesis `x mod y =
    r` in that equality, and use `nia` on the resulting arithmetic. When the dividend
    is normalized as `r + q * m`, use `Nat.Div0.mod_add`; simplify the remaining `r
    mod m` with `Nat.mod_small` once `r < m` is available.'
  harmful: 0
  helpful: 1
  id: rocq-00007
  section: lemmas
- content: 'For a fixed-sum product bound on a finite nonnegative real sequence, induct
    on a stronger normalized invariant for positive indices, such as `prod_n a n <=
    (sum_n a n / INR n)^n`, retaining an arbitrary total sum or average. Do not obtain
    a successor case merely by multiplying an induction hypothesis `prod_n a n <=
    1` by a nonnegative factor: that factor need not be at most `1`. Specialize a
    condition such as `sum_n a n = INR n` only after the induction.'
  harmful: 0
  helpful: 2
  id: rocq-00009
  section: strategy
- content: 'Before using `nra` in AM-GM base or successor cases, unfold or rewrite
    the relevant `sum_n` and `prod_n` expressions, including base cases such as `sum_n
    a 0` and `prod_n a 1`, and prove any required `INR n <> 0` denominator condition;
    `nra` cannot reason through opaque recursive definitions or supply the global
    inequality.

    '
  harmful: 0
  helpful: 3
  id: rocq-00011
  section: tactics
- content: 'For a real goal `0 <= t^2` where `Rle_0_sqr` does not unify directly,
    use `replace (t^2) with (t * t) by ring; apply Rle_0_sqr`; use `ring` separately
    for completing-square identities before finishing the resulting linear inequality
    with `lra`.

    '
  harmful: 0
  helpful: 3
  id: rocq-00012
  section: tactics
- content: 'When `positivity` is unavailable and a recursive real product has a successor
    factor `1 + / d`, construct the signs explicitly: prove `0 < d` (for a product
    denominator, with `Rmult_pos_pos`), derive `0 < / d` with `Rinv_0_lt_compat`,
    prove `0 < 1 + / d` with `lra`, and combine it with product positivity using `Rmult_pos_pos`.
    Arithmetic automation does not infer this through opaque recursive products.'
  harmful: 0
  helpful: 1
  id: rocq-00013
  section: lemmas
- content: 'For natural-number product bounds, combine factor inequalities with `Nat.mul_le_mono`.
    To multiply `H : A <= B` by a fixed right natural factor `r` in a target `A *
    r <= B * r`, use `apply Nat.mul_le_mono_r; exact H` (or commute factors first);
    no separate nonnegativity premise is needed for a natural factor.'
  harmful: 0
  helpful: 0
  id: rocq-00014
  section: lemmas
- content: 'To lift a natural bound into `R`, expose the coercion and apply `le_INR`:
    for example, prove `2 <= INR c` with `change INR 2 <= INR c; apply le_INR; lia`;
    for strict positivity of a cast, apply `lt_0_INR` to the natural positivity hypothesis
    rather than using a nonexistent `.mpr` projection.

    '
  harmful: 0
  helpful: 1
  id: rocq-00015
  section: lemmas
- content: 'For real equations involving a single reciprocal `1 / x`, after proving
    `x <> 0`, multiply explicitly by `x` and expose the inverse identity with `unfold
    Rdiv` and `assert (x * / x = 1) by exact (Rinv_r x Hx)`; then use `ring` and `nra`
    on the resulting polynomial equation instead of relying on `field_simplify` to
    normalize it.

    '
  harmful: 0
  helpful: 1
  id: rocq-00016
  section: pitfalls
- content: 'Given `Habs : Rabs t = 1`, destruct `(Rle_or_lt 0 t) as [Ht | Ht]`. In
    the nonnegative branch, rewrite `Rabs_pos_eq` in `Habs` by `exact Ht` and conclude
    `t = 1` by `lra`. In the negative branch, rewrite `Rabs_left` in `Habs` by `lra`
    to supply `t <= 0`, then conclude `t = -1` by `lra`.'
  harmful: 0
  helpful: 1
  id: rocq-00017
  section: tactics
- content: 'Avoid `vm_compute`, `compute`, and whole-context `cbv` or `simpl` on large
    closed recursive terms, including `Nat.gcd`, `Nat.lcm`, or `sum_f` at a large
    numeral: these shapes crashed the prover in the pool. Reduce only small explicitly
    closed subterms locally. For a large fixed `sum_f` value, prove the relevant closed-form
    identity by induction and rewrite with its instantiated result instead of evaluating
    the recursion.'
  harmful: 1
  helpful: 0
  id: rocq-00018
  section: pitfalls
- content: 'When proving a least witness by finite exclusion, first split with `destruct
    (le_gt_dec bound m) as [Hge | Hlt]`; close the lower-bound branch immediately,
    handle the finitely many numeral cases explicitly under `Hlt`, and discharge any
    residual symbolic successor branch directly from `Hlt` rather than using blanket
    `all:` tactics or unstable numbered selectors.

    '
  harmful: 1
  helpful: 1
  id: rocq-00019
  section: strategy
- content: 'For recurrence equations containing closed casts and closed numeral natural
    indices, normalize the casts with `cbv [INR] in H` and use `replace ... by reflexivity`
    only when both index expressions definitionally reduce to the same numeral. For
    symbolic indices, first prove an equality such as `Hidx : (a + b)%nat = c%nat`
    with `lia`, then `rewrite Hidx in H`. After recursive sums are exposed and all
    remaining expressions are linear real equations, use `lra`.'
  harmful: 1
  helpful: 1
  id: rocq-00020
  section: tactics
- content: 'For an explicit `Ensemble` built from nested `Add`, first unfold `Add`
    and rewrite membership using the corresponding `Empty_set`, `Singleton`, and `Union`
    equivalences; once the resulting disjunctions and `False` cases are exposed, use
    `intuition; lia`. For cardinality, apply `card_add` layer by layer, prove each
    freshness premise by unfolding `In` and `Add` and inverting membership hypotheses,
    and finish the empty base with `card_empty`.

    '
  harmful: 0
  helpful: 1
  id: rocq-00021
  section: tactics
- content: "For trigonometric goals involving complementary or doubled angles, use\
    \ the library lemma with the exact goal orientation\u2014such as `sin_PI_x` or\
    \ `sin_2a`, rewriting with it before `reflexivity` when necessary. For positivity\
    \ of `sin x`, apply `sin_gt_0` and prove the bounds `0 < x` and `x < PI` explicitly.\n"
  harmful: 0
  helpful: 0
  id: rocq-00022
  section: lemmas
- content: 'For logarithmic inequalities and identities, derive `0 < ln a` from `1
    < a` by applying `ln_increasing` to obtain `ln 1 < ln a` and rewriting with `ln_1`.
    For `ln (t ^ 2) = 2 * ln t`, use `ln_pow` with a proof that the base `t` is positive,
    normalize the casted exponent with `cbv [INR]`, and use the resulting instantiated
    equality directly.

    '
  harmful: 0
  helpful: 1
  id: rocq-00023
  section: lemmas
- content: 'For an unbounded quadratic equation over `nat` that `nia` cannot solve
    directly, split with `destruct (lt_dec b k)` to obtain a finite bound. In the
    other branch derive `k * k <= b * b` with `rewrite Nat.square_le_mono; lia`, then
    let `nia` derive the contradiction from the original equation.

    '
  harmful: 0
  helpful: 0
  id: rocq-00024
  section: tactics
- content: 'A closed cast such as `INR 4` is not necessarily definitionally convertible
    to `(4 : R)`, so `change` may fail. First prove an explicit equality, for example
    with `cbv [INR]; ring`, and rewrite with that equality before applying real arithmetic.

    '
  harmful: 0
  helpful: 1
  id: rocq-00025
  section: pitfalls
- content: 'For a target or hypothesis containing `ln (a * b)`, explicitly rewrite
    it with `ln_mult a b Ha Hb` before calling `nra`; arithmetic automation does not
    expose this logarithmic product identity on its own.

    '
  harmful: 0
  helpful: 0
  id: rocq-00026
  section: lemmas
- content: 'For real square-root equalities, use `pow2_sqrt` to rewrite `sqrt t ^
    2 = t` from `0 <= t`, and use `sqrt_pow2` to rewrite `sqrt (t ^ 2) = t` from `0
    <= t`. To prove a bound `sqrt u <= (1 / 2 : R)`, rewrite the right side as `sqrt
    ((1 / 2 : R) ^ 2)` using `sqrt_pow2`, then apply `sqrt_le_compat`, supplying `0
    <= u` and `u <= (1 / 2 : R) ^ 2`. Use `sqrt_le_1_alt` only after the target has
    specifically become a comparison with `1`.'
  harmful: 0
  helpful: 0
  id: rocq-00027
  section: lemmas
- content: Do not assume `omega` or `norm_num` is available under the pool imports.
    With imports such as `Arith`, reduce a closed natural subexpression locally with
    `cbv` in the relevant hypothesis or goal, then use `discriminate`, `reflexivity`
    for a definitional equality, or `lia`. For closed real numeral goals, normalize
    casts as needed and use `lra` for inequalities or `ring` for polynomial equalities.
  harmful: 0
  helpful: 0
  id: rocq-00028
  section: pitfalls
- content: 'For goals `0 < (c ^ j : R)` when positivity automation or `pow_succ` is
    unavailable, induct on `j`; solve the base case directly, then use `cbn [pow]`
    followed by `apply Rmult_pos_pos` in the successor case.

    '
  harmful: 0
  helpful: 0
  id: rocq-00030
  section: tactics
- content: 'The unqualified name `le_trans` was rejected in this environment. For
    a named natural chain `Hxy : x <= y` and `Hyz : y <= z`, use `exact (Nat.le_trans
    _ _ _ Hxy Hyz)`; for a real chain, use `exact (Rle_trans _ _ _ Hxy Hyz)`. Choose
    the qualified lemma matching the ordered type rather than applying bare `le_trans`.

    '
  harmful: 0
  helpful: 0
  id: rocq-00031
  section: pitfalls
- content: 'Rocq rejects tactic-proof shorthand as an argument, such as `specialize
    (IH (by lia)).` First establish and name the premise with `assert (Hbound : P)
    by lia.`, then use the parser-compatible form `specialize (IH Hbound).`

    '
  harmful: 0
  helpful: 0
  id: rocq-00032
  section: pitfalls
