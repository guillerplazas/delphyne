bullets:
- content: 'For nonlinear inequalities over `R`, derive useful quadratic bounds by
    asserting a nonnegative completed square, e.g. `assert (hs : 0 <= (a * x + b)
    * (a * x + b)) by apply Rle_0_sqr`, then let `nra` expand it and combine it with
    the hypotheses. If a square is written as `t ^ 2`, first bridge or restate it
    as `t * t` when `Rle_0_sqr` does not unify syntactically.

    '
  harmful: 1
  helpful: 5
  id: rocq-00001
  section: tactics
- content: 'For divisibility goals over integers, arithmetic tactics do not construct
    divisibility witnesses. After unpacking `d | p` as `p = q * d` (or an equivalent
    witness equation), prove derived divisibility facts explicitly by giving the transformed
    witness, rewriting with that equation, and normalizing with `ring`; then use divisibility
    closure lemmas such as those for addition or multiplication.

    '
  harmful: 1
  helpful: 1
  id: rocq-00002
  section: pitfalls
- content: 'For equalities involving large concrete recursive sums, avoid unfolding
    the concrete computation directly. Prove a symbolic closed form or recurrence
    by induction on the bound, instantiate it at the desired numeral, and finish the
    resulting arithmetic with `lia` or `nia`.

    '
  harmful: 1
  helpful: 3
  id: rocq-00003
  section: strategy
- content: 'For nat remainder goals relating a modulus `d` to a larger modulus `m`
    divisible by `d`, expand `n` using `Nat.div_mod n m` after proving `m > 0`, rewrite
    the known remainder modulo `m`, and normalize modulo `d` with `Nat.add_mod` and
    `Nat.mul_mod`. The remaining concrete modular arithmetic often closes with `simpl;
    reflexivity`.

    '
  harmful: 0
  helpful: 2
  id: rocq-00004
  section: tactics
- content: 'For a closed nat equality consisting only of executable definitions, such
    as `seq`, `filter`, `fold_right`, and boolean tests, try `vm_compute; reflexivity`
    before constructing a symbolic induction or recurrence proof.

    '
  harmful: 2
  helpful: 2
  id: rocq-00005
  section: tactics
- content: 'When a nat recurrence advances by a fixed step or applies only on one
    residue class, induct on a quotient parameter and state the invariant with an
    index already in that shape, for example `forall k, f (2 * k + 1)%nat = ...`.
    Before applying or rewriting with the induction hypothesis, use `replace` plus
    `lia` or definitional simplification to make the goal''s function argument syntactically
    identical to the shaped index.

    '
  harmful: 1
  helpful: 2
  id: rocq-00006
  section: strategy
- content: 'For polynomial equalities over R whose hypotheses are algebraic equations
    such as x + y = c and a * x + y = d, try `intros; nra` directly. It can eliminate
    the variables, expand powers, and prove polynomial consequences without manual
    substitution.

    '
  harmful: 0
  helpful: 10
  id: rocq-00007
  section: tactics
- content: 'To use a hypothesis `(a * x) mod m = r` inside an expression such as `(k
    * (a * x)) mod m`, first rewrite the outer product with `Nat.mul_mod` (proving
    `m <> 0` as required). This exposes `(a * x) mod m`, after which the hypothesis
    can be rewritten and the remaining modular arithmetic normalized.

    '
  harmful: 0
  helpful: 0
  id: rocq-00008
  section: tactics
- content: 'For real goals with an affine specification `h : forall x, f x = a * x
    + b`,

    rewrite `h` at every relevant point-value hypothesis and at the target (for

    example, `rewrite (h 7) in h1` and `rewrite (h target)`). The resulting scalar

    linear equations usually close with `nra`.

    '
  harmful: 0
  helpful: 0
  id: rocq-00009
  section: tactics
- content: 'For a linear second-order recurrence over `R`, specialize the recurrence
    at the

    few concrete indices that link the known values to the target, then use `lra`.

    Concrete successor indices typically normalize during linear arithmetic, so a

    separate index-normalization proof is often unnecessary.

    '
  harmful: 0
  helpful: 1
  id: rocq-00010
  section: tactics
- content: 'For a first-order recurrence over `R`, such as `Hu : forall n, u (n +
    1)%nat = u n + c`, prove a reusable closed form by induction, for example `forall
    n, u (S n) = u 0 + INR (S n) * c`. In the induction step, use `replace ... by
    lia` when necessary to expose the exact successor index required by `Hu`, rewrite
    `plus_INR`, and finish the algebra with `ring`.

    '
  harmful: 0
  helpful: 0
  id: rocq-00011
  section: tactics
- content: 'When a hypothesis or lemma about a product fails to rewrite because factors
    are merely reordered or reassociated, explicitly align the target expression first:
    use `replace (b * c * a) with (a * b * c) by ring` (or the analogous commutative-semiring
    identity), then apply or rewrite with the hypothesis.

    '
  harmful: 0
  helpful: 2
  id: rocq-00012
  section: tactics
- content: 'For real equations involving an absolute value of an expression with a
    reciprocal, first derive the denominator is nonzero and record a cancellation
    identity such as `/ x * x = 1` using `Rinv_l`. Split on the sign of the expression
    with `Rle_dec`, rewrite the absolute value using `Rabs_right` or `Rabs_left`,
    then use `nra` with the cancellation identity to clear the reciprocal and solve
    the resulting polynomial conditions.

    '
  harmful: 0
  helpful: 0
  id: rocq-00013
  section: tactics
- content: 'To prove equality of exponents in an equality of real powers with base
    `b`, when `0 < b` and `b <> 1`, first normalize nested/products of powers with
    the appropriate `Rpower` multiplication and addition lemmas. Apply `f_equal ln`,
    rewrite logarithms of powers with `ln_Rpower`, then use the nonzero fact for `ln
    b` and `nra` to cancel that factor and equate the exponents.

    '
  harmful: 0
  helpful: 0
  id: rocq-00014
  section: tactics
- content: 'For sign-sensitive cyclic polynomial inequalities over `R`, do not rely
    on `nra` to invent a sum-of-nonnegative-products certificate. Split into the relevant
    relative-order cases, derive signs of the differences with `lra`, explicitly replace
    the target polynomial by a branch-specific factorization or decomposition using
    `ring`, and prove each product nonnegative from the established sign facts.

    '
  harmful: 0
  helpful: 0
  id: rocq-00015
  section: strategy
- content: 'For an equality of natural-number powers, first rewrite both sides as

    powers of a common base and normalize nested powers and products of powers

    using the relevant `Nat.pow_mul_r` and `Nat.pow_add_r` rewrites. Once the

    goal has shape `b ^ m = b ^ n` with `1 < b`, apply the natural-power

    injectivity lemma (such as `Nat.pow_inj_r`) to reduce it to `m = n`, then

    finish the exponent arithmetic with `lia` or `nia`.

    '
  harmful: 0
  helpful: 0
  id: rocq-00016
  section: tactics
- content: 'When nonlinear reasoning over `R` needs strict positivity of a square
    and

    `h : x <> 0` is available, assert `0 < x * x` using `Rlt_0_sqr` (stating

    the square as a product if necessary for syntactic unification). This

    excludes the zero branch for `nra` while the existing nonnegative-square

    pattern only yields `0 <= x * x`.

    '
  harmful: 0
  helpful: 0
  id: rocq-00017
  section: lemmas
- content: 'Do not assume `vm_compute` is safe for every closed nat computation:

    expressions involving recursively evaluated `Nat.lcm`, large powers, or

    large products can exhaust the reduction stack. Prefer exposing a smaller

    branch-specific arithmetic equation with `change` or proving a symbolic

    normalization first, then use arithmetic tactics rather than fully

    evaluating the original term.

    '
  harmful: 0
  helpful: 0
  id: rocq-00018
  section: pitfalls
- content: 'For integer interval goals involving an absolute value, rewrite `Z.abs
    e < n` with `Z.abs_lt` to obtain the linear bounds `- n < e /\ e < n`; after destructing
    the conjunction, `lia` usually closes the resulting branches.

    '
  harmful: 0
  helpful: 0
  id: rocq-00019
  section: tactics
- content: 'For real logarithm equations, first establish positivity of every logarithm
    argument, then normalize products and reciprocals with `ln_mult` and `ln_Rinv`.
    After these rewrites, use `nra` while treating remaining logarithm terms as algebraic
    atoms. To conclude equality of positive arguments from equal logarithms, use `ln_inv`;
    to show `0 < ln x` from `1 < x`, rewrite `0` as `ln 1` using `ln_1` and apply
    `ln_increasing`.

    '
  harmful: 0
  helpful: 1
  id: rocq-00020
  section: tactics
- content: 'Do not expect `ring` to prove identities containing division, including
    rational multiples of constants such as `PI`: these are not polynomial expressions.
    Unfold local definitions if needed and use `field` to clear denominators first,
    discharging its nonzero-denominator side conditions, then continue with rewriting
    or `ring`.

    '
  harmful: 0
  helpful: 2
  id: rocq-00021
  section: pitfalls
- content: 'For a natural polynomial equation involving `b ^ 2` whose expected solution
    is a small numeral but where `nia` does not directly derive `b = k`, first rule
    out `k + 1 <= b`: use `Nat.pow_le_mono_l` to obtain `(k + 1) ^ 2 <= b ^ 2`, simplify
    that bound together with the equation, and let `nia` refute the branch. Then use
    the resulting finite upper bound to destruct the few possible values of `b` and
    close normalized cases with `lia` or `nia`.

    '
  harmful: 0
  helpful: 0
  id: rocq-00022
  section: tactics
- content: 'For real logarithm equations containing positive natural powers, establish
    positivity explicitly with `pow_lt base n Hbase`, then rewrite `ln (base ^ n)`
    using `ln_pow base Hbase n`. Expand surrounding products with `ln_mult`, simplify
    the resulting `INR` coefficients, and use `nra` on the resulting linear equations
    in logarithm atoms.

    '
  harmful: 0
  helpful: 0
  id: rocq-00023
  section: tactics
- content: 'When `R_scope` is open, scope an entire natural-number comparison or conjunction
    rather than only its numerals: write `(5 <= n /\ n <= 12)%nat` or `(4 < n)%nat`.
    An expression such as `5%nat <= n` can still cause the comparison itself to elaborate
    in an unintended scope.

    '
  harmful: 0
  helpful: 0
  id: rocq-00024
  section: pitfalls
- content: 'For a small closed nat equality involving only numerals and transparently
    reducible arithmetic such as `+`, try `reflexivity` first: kernel conversion may
    normalize it directly, avoiding unnecessary `lia`, `nia`, or `vm_compute`.

    '
  harmful: 0
  helpful: 0
  id: rocq-00025
  section: tactics
- content: 'To prove `g c = a` from a left-inverse law `Hleft : forall x, g (f x)
    = x` and a concrete preimage equation `Hs : f a = c`, rewrite `c` backward with
    `Hs` and apply `Hleft`. In nested terms such as `g (f (g c))`, first rewrite with
    `Hleft (g c)` to expose the simpler equality.

    '
  harmful: 0
  helpful: 0
  id: rocq-00026
  section: tactics
