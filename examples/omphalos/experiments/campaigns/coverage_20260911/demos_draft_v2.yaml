      theorem_statement: ":\n  forall (u : nat -> R),\n  (forall n, u (n + 1)%nat\
        \ = u n + 1) ->\n  sum_f_R0 (fun k => u (k + 1)%nat) 97 = 137 ->\n  sum_f_R0\
        \ (fun k => u (2 * (k + 1))%nat) 48 = 93"
      informal_statement: "Find the value of $a_2+a_4+a_6+a_8+\\ldots+a_{98}$ if $a_1$,\
        \ $a_2$, $a_3\\ldots$ is an\n   [[arithmetic progression]] with common difference\
        \ 1, and\n   $a_1+a_2+a_3+\\ldots+a_{98}=137$. Show that it is 093."
      informal_proof: "One approach to this problem is to apply the formula for the\
        \ sum of an [[arithmetic\n   series]] in order to find the value of $a_1$,\
        \ then use that to calculate $a_2$ and\n   sum another arithmetic series to\
        \ get our answer.\n\n   A somewhat quicker method is to do the following:\
        \ for each $n \\geq 1$, we have $a_{2n\n   - 1} = a_{2n} - 1$.  We can substitute\
        \ this into our given equation to get $(a_2 - 1)\n   + a_2 + (a_4 - 1) + a_4\
        \ + \\ldots + (a_{98} - 1) + a_{98} = 137$.  The left-hand side\n   of this\
        \ equation is simply $2(a_2 + a_4 + \\ldots + a_{98}) - 49$, so our desired\n\
        \   value is $\\frac{137 + 49}{2} = 093$."
      imports: 'Require Import Reals.

        Open Scope R_scope.'
      definitions: ''
    available_skills: {}
    toolset: core
    turn_budget: 64
    prefix: []
    playbook: ''
