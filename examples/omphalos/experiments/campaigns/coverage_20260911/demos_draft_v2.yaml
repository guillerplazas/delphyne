      replace ((2 * n + 3 + 1)%nat) with (2 * n + 4)%nat in H by lia.

      exact H.

      }

      replace (2 * S n + 1)%nat with (2 * n + 3)%nat by lia.

      replace (2 * (S n + 1))%nat with (2 * n + 4)%nat by lia.

      replace (2 * n + 3)%nat with (S (S (2 * n + 1)))%nat by lia.

      rewrite (tech5 (fun k => u (k + 1)%nat) (S (2 * n + 1))).

      rewrite (tech5 (fun k => u (k + 1)%nat) (2 * n + 1)).

