      = 2 * sum_f_R0 (fun k => u (2 * (k + 1))%nat) n - INR (S n)).

      { intro n.

      induction n as [|n IH].

      - simpl.

      pose proof (Hu (1%nat)) as H1.

      simpl in H1.

      nra.

      - cbn [sum_f_R0].

      assert (Hrel : u (2 * n + 4)%nat = u (2 * n + 3)%nat + 1).

      { pose proof (Hu (2 * n + 3)%nat) as H.

      replace ((2 * n + 3 + 1)%nat) with (2 * n + 4)%nat in H by lia.

      exact H.

      }

      replace (2 * S n + 1)%nat with (2 * n + 3)%nat by lia.

      replace (2 * (S n + 1))%nat with (2 * n + 4)%nat by lia.

      replace (2 * n + 3)%nat with (S (S (2 * n + 1)))%nat by lia.

      rewrite (tech5 (fun k => u (k + 1)%nat) (S (2 * n + 1))).

      rewrite (tech5 (fun k => u (k + 1)%nat) (2 * n + 1)).

      replace (S (2 * n + 1) + 1)%nat with (2 * n + 3)%nat by lia.

      replace (S (S (2 * n + 1)) + 1)%nat with (2 * n + 4)%nat by lia.

      rewrite IH.

      repeat rewrite S_INR.

      nra.

      }

      specialize (Hpair (48%nat)).

      change (sum_f_R0 (fun k => u (k + 1)%nat) 97 = 2 * sum_f_R0 (fun k => u (2 *
      (k + 1))%nat) 48 - INR (S 48)) in Hpair.

      rewrite Hsum in Hpair.'
