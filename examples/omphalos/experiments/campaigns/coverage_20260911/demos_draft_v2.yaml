      lia.", "replace (2 * (S n + 1))%nat with (2 * n + 4)%nat by lia.", "replace
      (2 * n + 3)%nat with (S (S (2 * n + 1)))%nat by lia.", "rewrite (tech5 (fun
      k => u (k + 1)%nat) (S (2 * n + 1))).", "rewrite (tech5 (fun k => u (k + 1)%nat)
      (2 * n + 1)).", "replace (S (2 * n + 1) + 1)%nat with (2 * n + 3)%nat by lia.",
      "replace (S (S (2 * n + 1)) + 1)%nat with (2 * n + 4)%nat by lia.", "rewrite
      IH.", "repeat rewrite S_INR.", "nra.", "}", "specialize (Hpair (48%nat)).",
      "change (sum_f_R0 (fun k => u (k + 1)%nat) 97 = 2 * sum_f_R0 (fun k => u (2
