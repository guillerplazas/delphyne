  - title: 'When would preparing the book pay for itself?'
    section: 'Backup / amortization'
    backup: true
    layout: table
    widths: [4.9, 3.6, 3.6]
    font: 22
    columns: ['Quantity', 'Luna', 'Terra']
    rows:
