  - title: 'Four failure mechanisms behind weak transfer'
    section: 'Mistakes and lessons'
    layout: cards
    cards:
      - title: '1 · The wrong successful ending'
        bullets: ['**Accepted ending: nia.** Missing from the last proposed script.', '**Risk:** teach a different action from the one that closed the proof.']
      - title: '2 · Invalid syntax in a valid idea'
        bullets: ['**Reducer:** valid assert becomes rejected have syntax around Rle_0_sqr.', '**Name lookup is insufficient:** verify the snippet in its source context.']
      - title: '3 · A mechanism that never arrives'
        bullets: ['**51 parse failures; 33 duplicates.**', '**Concatenated final messages** break parsing; evaluate the fix separately.']
      - title: '4 · Shorter context, longer search'
        bullets: ['**Compaction:** repeated tool calls; sometimes no proof submission.', '**Local savings** can lose useful memory and completion opportunity.']
    takeaway: 'Capture → validate → retain → expose → use → finish. A failure anywhere can erase the benefit.'
    notes: 'Terminal witness: amc12_2000_p6. The missing-text flag alone does not prove every affected training lesson was wrong. Syntax acceptance is not full theorem success; exposure is not causal attribution.'

  - title: 'More allowance recovered Terra proofs, then stalled'
    section: 'Exact continuations'
    layout: continuation
    bullets:
