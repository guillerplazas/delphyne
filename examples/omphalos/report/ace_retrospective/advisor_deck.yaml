        bullets: ['**3 gains, 0 losses:** paired exact p = **0.25**.', '**No proof of a general effect;** also no proof that ACE has zero value.']
      - title: 'What counts as evidence'
        bullets: ['**All expected cells;** platform failures retained in the denominator.', '**Whole-panel costs,** including failed attempts, retries and known liabilities.']
      - title: 'What is independent'
        bullets: ['**Cluster related theorem families and repeated seeds.**', '**validationX is reused development data;** selection is not confirmation.']
      - title: 'What permits a practical decision'
