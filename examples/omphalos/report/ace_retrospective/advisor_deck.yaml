      - '**Not included:** engineering / assistant costs; Luna’s missing historical embeddings.'
    takeaway: 'This is arithmetic under fixed assumptions, not a prediction of external generalization.'
    notes: 'Break-even = known preparation cost divided by observed per-attempt inference saving. Values are rounded upward to whole attempted tasks. No extrapolated straight-line chart is needed to convey these conditional figures.'

