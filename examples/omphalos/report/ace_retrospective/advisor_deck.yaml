      - '**Extra money:** Luna unchanged; Terra gains **+2 / +4** solves.'
      - '**Then no extra solves:** 11 residual paths face money denial; one carries an API failure.'
    takeaway: 'The final plateau is not evidence of an unrestricted model-capability ceiling.'
    notes: 'C = no ACE; E = corrected own-book context. Level 0 caps Luna $0.10 / Terra $1.00. Level 1 doubles money to $0.20 / $2.00 while retaining 64 requests / 300s. Level 2 retains that money and gives 128 requests / 600s. Costs in backups include each prefix once.'

