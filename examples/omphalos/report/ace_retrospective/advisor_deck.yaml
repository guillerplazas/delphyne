  - title: 'Are failed ideas inherited by later experiments?'
    section: 'Research discipline'
    layout: cards
    cards:
      - title: 'Stored in Git'
        bullets: ['**Keep results, costs, books and candidate code.**', '**A research commit does not establish a solver improvement.**']
      - title: 'Activated by configuration'
        bullets: ['**Opt-in:** compaction, exploration, repair and continuation.', '**The next control retains the reference;** losing flags stay off.']
      - title: 'What really is inherited'
        bullets: ['**The accepted controller** and its cost / coverage compromise.', '**Shared code changes** can affect several configurations.']
      - title: 'Remaining protection to strengthen'
        bullets: ['**One explicit reference constructor;** preserve prompt identity.', '**Separate archive, fix and promotion;** check shared behavior.']
    takeaway: 'Optional treatments are isolated by switches; shared-code behavior still deserves regression checks.'
    notes: 'This is an assessment of inspected configuration and history, not a proof of complete behavioral equivalence. Raw BoundedConfig defaults differ from the reference’s explicit admission=False / restart=False settings. No code is changed by preparing this presentation.'

