      - title: 'Known issue · completion is fragile'
        bullets: ['**Unfinished progress:** time limits, parsing and final submission matter.', '**More nominal requests** do not guarantee useful admitted work.']
      - title: 'Unknown · the causal breakdown'
        bullets: ['**Different sampled trajectories:** this is not a paired controller ablation.', '**Six net solves lost ≠ six proven reservation failures.**']
    takeaway: 'The gap motivates diagnosis; it does not show that the finished book destroyed six proofs.'
    notes: 'Same nominal Terra generator allowance $1.00, different stopping semantics. Do not assign a numerical share of the six-solve gap to the controller, compression or sampling without a matched intervention.'

