title: 'Omphalos · ACE, control and evidence'
date: '13 September 2026'
scope: 'Audited development evidence through 12 September; completed resource-completion campaign on 13 September. Ongoing code work excluded.'
slides:
  - title: 'ACE, control and the cost of a proof'
    section: 'Research update'
    layout: cover
    subtitle: 'Omphalos / Delphyne / miniF2F in Rocq'
    cards:
      - {value: '−55.5%', label: 'spending', text: 'Accepted bounded-control trade-off; 28 → 25 validation solves.'}
      - {value: '+3 / 40', label: 'Luna ACE increment', text: 'Matched development comparison; encouraging, p = 0.25.'}
      - {value: '38 / 40', label: 'Terra during learning', text: 'Training generation; later frozen evaluation uses a different controller.'}
    bullets:
      - '**Thesis contribution:** economical, verifiable search through Delphyne.'
      - '**Main question:** which improvements survive the entire path to a checked proof?'
    takeaway: 'Strong control result; modest ACE signal; concrete explanations for lost opportunity.'
    notes: 'Open with the three numbers. They belong to different comparisons. Never present 38/40 as validation performance. This is a complete reading deck; use the rehearsal route for a shorter talk.'

  - title: 'The questions this update answers'
    section: 'Reading guide'
    layout: cards
    cards:
      - title: 'Is ACE implemented?'
        bullets: ['**Yes:** Generator, Reflector, Curator and persistent playbook.', '**Local additions:** batched Reducer, checked evidence and budget controls.']
      - title: 'Did it improve coverage?'
        bullets: ['**Luna:** 24 → 27/40 in the matched validation comparison.', '**Uncertain:** three gains; too little evidence for a supported general gain.']
      - title: 'Does a stronger model unlock ACE?'
        bullets: ['**Terra solves more** without a book.', '**ACE increment stays small:** +0 with Luna’s book, +1 with its own.']
      - title: 'What is worth retaining?'
        bullets: ['**Budget trade-offs and reliable evidence.**', '**Failed candidates stay optional;** common controller limitations remain.']
    takeaway: 'Separate implementation fidelity, local correctness, coverage and economic value.'
    notes: 'Use these questions as a map. Each is answered visibly later; no claim depends on speaker notes or a live file visit.'

  - title: 'Our ACE loop, in one slide'
    section: 'Implementation'
    layout: pipeline
    stages:
      - ['Generator', 'Propose a proof\nusing the current book']
      - ['Rocq feedback', 'Execute and check\nwhat actually happened']
      - ['Reflector', 'Diagnose the attempt;\npropose useful lessons']
      - ['Curator', 'Propose structured\nplaybook changes']
      - ['Reducer', 'Select / combine\nbatched proposals']
      - ['Merge + store', 'Deterministic update;\nhash the next book']
    bullets:
      - '**Training:** the book evolves between batches; no model weights are updated.'
      - '**Evaluation:** the selected book is frozen; each proof has its own resource allowance.'
      - '**Delphyne:** strategies describe choices; policies choose models, search and spending.'
    takeaway: 'The Reducer is a local batching component; the deterministic merge owns the stored state.'
    notes: 'The advisor knows ACE. Spend at most 45 seconds here. Emphasize the local Reducer and the separation between the evolving book and frozen inference.'

