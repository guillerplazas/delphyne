    takeaway: 'Do not buy extra seeds merely to cross a significance threshold; testX stays closed.'
    notes: 'Five independent all-favorable discordances give exact two-sided p=0.0625. This is a minimum for attainable significance, not a power calculation. Small samples and historical controls warrant restrained interpretation.'

