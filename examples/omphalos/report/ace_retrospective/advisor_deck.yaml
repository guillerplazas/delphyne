  - title: 'The full crossover separates solver from book'
    section: 'Luna / Terra experiment'
    layout: crossover
    bullets:
      - '**Same Luna book:** +3 solves for Luna, **+0** for Terra.'
      - '**Terra-written book:** no gain for Luna; **+1** for Terra.'
      - '**Own-book Terra:** **9.67×** the bill for three more validation solves.'
    takeaway: 'Each cell is 40 validationX problems; costs include failures and exclude book preparation.'
    notes: 'Rows are solver models, columns are frozen books. Luna cap $0.10; Terra $1.00. Same-book interaction −7.5 percentage points, paired p=0.375. Own-Terra book increment p=1.0. Reused records do not become independent theorems.'

  - title: 'What the Luna / Terra experiment changes'
    section: 'Interpretation'
    layout: cards
    cards:
      - title: 'Stronger solver: yes, more coverage'
        bullets: ['**Without ACE:** Terra 29/40; Luna 24/40.', '**Cost matters:** Terra uses a $1.00 cap and recorded tariffs ×10.']
      - title: 'Stronger writer: no clear unlock'
        bullets: ['**Luna + Terra book:** 24/40, matching no book.', '**Terra + own book:** only 29 → 30/40.']
      - title: 'Training success vs book usefulness'
        bullets: ['**Generator:** Terra 38/40; Luna 33/40.', '**Transfer still needs** valid, relevant advice that the solver uses.']
      - title: 'Next inference to test'
        bullets: ['**Target exposed bottlenecks** in evidence or completion.', '**Larger models and more writing** do not guarantee an ACE gain.']
    takeaway: 'The study does not establish that model scale unlocks ACE; an intrinsic model ceiling also remains unproven.'
    notes: 'Avoid a categorical statement that Terra cannot benefit. The same-book interaction has p=0.375 and the own-Terra difference p=1.0. Small gains and the study design limit conclusions.'

  - title: 'Yes: Terra achieved 38/40 during book creation'
    section: 'The 38/40 result'
    layout: chart
    chart: training_gap
    bullets:
      - '**38/40 on trainX:** the book evolved between batches.'
      - '**Generator bill:** $5.9984 for all 40 tasks.'
      - '**Full preparation:** $8.0992, including writers and embeddings.'
      - '**Frozen book:** trainX **32/40**; validationX **30/40**.'
    takeaway: '38 → 32 compares two training executions; 30/40 is a different partition, not another measured decline.'
    notes: 'Terra is used for all four generative roles. One shuffled pass, four-problem batches, final book 26 bullets / 2426 estimated tokens. The two training-generation misses were algebra_amgm_sum1toneqn_prod1tonleq1 and imo_1967_p3. Source: training_evolution.json and training_accounting.json in ace_attribution_20260912.'

