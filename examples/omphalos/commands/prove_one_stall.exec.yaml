# Smoke test for the stall-rule prover (2026-09-06): the luna smoke's
# configuration with the rule OFF, replayed against a COPY of the luna
# smoke's cache (`cache_mode: replay` raises on any miss). Passing
# proves `prove_theorem_agentic_stall` is the agentic baseline prompt
# for prompt when no rule is set. Refresh the copy with
# `make regen-stall-cache`.
command: run_strategy
args:
  strategy: prove_theorem_agentic_stall
  args:
    problem_file: miniF2F/valid/algebra/algebra_binomnegdiscrineq_10alt28asqp1.v
    theorem_name: algebra_binomnegdiscrineq_10alt28asqp1
    toolset: core
    turn_budget: 32
    stall_rule: ''
    stall_k: 0
  policy: prove_theorem_agentic_stall_policy
  policy_args:
    model_name: gpt-5.6-luna
    temperature: null
    max_turns: null
    loop: false
    api: responses
    reasoning_effort: medium
    convert_user_feedback_to_tool: true
  num_generated: 1
  budget:
    num_requests: 32
    price: 0.05
  export_raw_trace: true
  export_log: false
  export_browsable_trace: true
  cache_mode: replay
