- input:
    request:
      chat:
        - role: system
          content: |-
            You are a Rocq proof engineer. Your job is to close `Admitted` proofs
            in miniF2F problems formalized in Rocq.

            ## Proposing a proof

            On each turn you either **propose a proof** or call one of your tools.
            To propose, end your message with a single fenced code block containing
            only the body tactics of the proof. Each tactic must terminate with a
            `.`. No `Theorem ...`, no `Proof.`, no `Qed.`, no surrounding prose
            inside the fence. Example:

            ```rocq
            intros a b.
            nra.
            ```

            **Partial proposals are free previews.** If every tactic in your
            script applies cleanly but goals remain, the verifier reports your
            verified prefix together with the exact remaining goals. When you are
            unsure how an opener (`induction ...`, `destruct ...`) reshapes the
            goal, submitting just that prefix is often the cheapest way to see the
            resulting subgoals before drafting the rest.

            **Verification is automation-assisted.** Whenever your script fails or
            stops short, the verifier probes every remaining goal with a battery
            of cheap closing tactics (`assumption`, `reflexivity`, `easy`, `lia`,
            `nia`, `lra`, `nra`, `ring`, `field`, `congruence`,
            `auto with arith/zarith`, and `simpl`/`intuition` combinations) and
            tells you which goals are routine. **If every remaining goal closes,
            the verifier finishes the proof for you and you win on the spot.**
            Consequence: prioritize the *structure* — the right opener, the right
            case split, the right witnesses and intermediate assertions — and let
            the battery sweep up routine leaves. Do not spend turns hand-closing
            goals the probe already marked as routine.

            **Decompose hard goals with asserts.** A goal that automation cannot
            swallow whole often splits into steps it can: state the key
            intermediate facts with `assert (H : ...). { ... }` and chain them.
            The skeleton is itself a valid partial proposal — the verifier will
            show which step broke or finish the routine remainder for you.

            ## Your tools

            Each tool call costs one turn, exactly like a proposal.

            ### `ReadSkill`

            Load a Rocq skill reference and append its full content to this
            conversation. Use this before (or between) proof attempts when you
            need detailed tactic guidance, stdlib lemma cheatsheets, error
            explanations, or proof templates.

            The set of legal `skill_name` values is shown to you as a table in
            the system prompt; calling with any other name returns an error
            message.

            ### `SearchRocq`

            Query Rocq's interactive REPL for introspection information about
            the current problem's context. Use this BEFORE proposing a proof,
            or AFTER a failed attempt where a lemma name was wrong, to discover
            real lemma names / types / definitions instead of guessing.

            Pass `command` as a full Rocq command terminated with a period.
            Examples:
              command="Search (_ + _ <= _ + _)."   # find lemmas matching a shape
              command="SearchPattern (_ * _)."     # narrower structural search
              command="Check Rabs_pos."            # show a lemma's statement
              command="Print Rsqr."                # show a definition's body
              command="About lia."                 # short summary of a tactic

            The output is whatever Rocq prints to its feedback channel. Long
            outputs are truncated; refine your query if you hit the truncation
            marker. Syntax errors come back as an error message that you can
            correct on your next turn.


            ## Available skills

            You can call `ReadSkill(skill_name=...)` with any of:

            | name | description |
            |---|---|
            | `rocq-phrasebook` | Common math-to-Rocq translations. |
            | `proof-templates` | Structured proof skeletons for common patterns in Rocq. |
            | `tactics-reference` | Comprehensive tactics reference for Rocq theorem proving. |
            | `tactic-patterns` | Quick reference for choosing tactics based on goal structure. |
            | `compilation-errors` | Error-by-error guidance for Rocq compilation errors. Read this first for any build error. |
            | `compiler-guided-repair` | Quick reference for compiler-guided proof repair. Escalation-only — not first-pass. |
            | `coq-stdlib-guide` | Navigation guide for the Coq standard library and common packages. |

            Calling with any other name returns an error.

            ## Rocq introspection cheatsheet (for the `command` argument)

            Pass the full Rocq command (verb + argument + trailing period).
            Useful verbs:

            | verb | what it shows |
            |---|---|
            | `Search` | every lemma whose statement matches a pattern |
            | `SearchPattern` | structural pattern match (narrower than `Search`) |
            | `Check` | the *type* of a term (lemma, definition, expression) |
            | `Print` | the *body* of a definition or proof |
            | `About` | short summary (type + which module it lives in) |

            Pattern syntax notes:

            - `_` is a wildcard. Parenthesize compound shapes:
              `Search (_ + _ <= _ * _).` is well-formed; without parentheses it
              is not.
            - For real numbers (`R`): stdlib statements write squares as `Rsqr x`
              (notation `x²`); `x ^ 2` is `pow x 2`, a *different* form. If you
              mean "the real square," search `(_²)`, not `(_ ^ 2)`.
            - Narrow patterns beat broad ones: prefer `Search (0 <= _²).` over
              `Search (0 <= _).`.
            - If a query returns nothing, the pattern likely doesn't match
              stdlib's phrasing — try a different shape, or `Check` a name you
              suspect exists.

            ## Pitfalls that burn turns (observed on this benchmark)

            1. **Name everything you introduce, reference only what you can see.**
               Use explicit intro patterns (`intros n k Hk.`), destructure
               existentials (`destruct H as [k Hk].`), and never reference
               auto-generated names (`H`, `H0`, `Hn`) unless they literally appear
               in the goal state shown to you. Also never re-bind a name that is
               already in context (`a is already used`).
            2. **`S n` vs `n + 1`.** miniF2F hypotheses state recurrences with
               `n + 1`, but `induction n` produces goals in `S n` form, so
               `rewrite hrec` will find no matching subterm. Bridge explicitly
               first: `replace (S n) with (n + 1) by lia.` (or
               `rewrite Nat.add_1_r.` to go the other way).
            3. **Match the automation to the goal.** `lia` = linear integers,
               `nia` = nonlinear integers, `lra`/`nra` = reals. Powers (`^`) are
               nonlinear: `simpl` small constant exponents away first, or reach
               for `nia`. And check the *type*: some problems are stated over `C`
               (complex numbers), where `lia`/`lra`/`nra` do not apply at all —
               reason equationally with `ring` / `field` /
               `replace ... with ... by ring` instead.
            4. **`nat` subtraction is truncated** (`0 - 1 = 0`), which blinds
               `lia`/`nia` whenever a power appears under `-`: they treat `b ^ e`
               as an opaque atom that could be `0`. Feed them the missing bound
               first — `assert (Hp : 1 <= b ^ e) by (apply Nat.pow_lower_bound;
               lia).` — and the goal usually falls. For the same reason,
               re-derive `exists` witnesses carefully when the IH involves `-`:
               an off-by-one there produces a *false* final goal that no
               automation can ever close.
            5. **Scripts are linear.** After `assert (H : P).` the *next* tactics
               prove `P` — the main goal waits, and `H` does not exist yet.
               Prove one-line asserts inline (`assert (H : P) by lia.`) or wrap
               the sub-proof in `{ ... }`, and only reference `H` afterwards.
            6. **Goal selectors and bullets.** `2: tac.` applies `tac` to goal 2
               (a bare `2.` is a syntax error). Every bullet branch (`-`/`+`/`*`)
               and `{ }` block you open must be finished before `Qed` — if the
               verifier says no goal is focused yet the proof is incomplete, a
               bullet branch is missing.

            ## Budget

            You have roughly 32 assistant turns for this
            problem. Every message — tool call or proposal — costs one turn, and
            unused turns are worthless: only a verified proof finishes the job.
            Spend your turns however you judge best, but if the same approach has
            failed twice, change something structural (a different opener, a
            decomposition into asserts, a search for the right lemma) rather than
            re-submitting a near-duplicate.

            ## Output format

            Reason briefly before acting. A proof proposal must be the **last**
            thing in your message: one fenced code block, body tactics only, each
            terminated with a `.`.
        - role: user
          content: |-
            Prove the following theorem in Rocq.

            ## Imports already in scope

            ```rocq
            Require Import Reals.
            Open Scope R_scope.
            ```

            ## Theorem

            ```rocq
            Theorem algebra_binomnegdiscrineq_10alt28asqp1 :
              forall a : R, 10 * a <= 28 * a^2 + 1.
            ```

            ## Informal statement

            For any real number a, show that $10a \leq 28a^2 + 1$.

            ## Informal proof sketch

            It suffices to show $0\leq 28a^2 - 10a + 1$.
               First, consider completing the square for $28a^2 - 10a$ and observe that $(a -
               \frac{5}{28})^2 = a^2 - \frac{10}{28}a + (5/28)^2$.
               Since $0\leq (a - \frac{5}{28})^2$, we have $0\leq a^2 - \frac{10}{28}a + (5/28)^2$.
               Multiplying by 28 and simplifying terms gives $0\leq 28*a^2 - 10*a + (25/28)$.
               Since $25/28 < 1$, the result follows.

            Reply with a fenced code block containing only the body of the proof
            (no `Proof.`, no `Qed.`).
        - role: assistant
          answer:
            mode: null
            content: |-
              Completing the square: $28a^2 - 10a + 1 = 28(a - 5/28)^2 + 3/28 > 0$.
              The square-nonnegativity assert makes the goal linear-arithmetic-free
              for `nra`.
              ```rocq
              intros a.
              assert (Hsq : 0 <= (28 * a - 5) * (28 * a - 5)) by apply Rle_0_sqr.
              replace (a ^ 2) with (a * a) by ring.
              nra.
              ```
        - role: user
          content: |-
            Prove the following theorem in Rocq.

            ## Imports already in scope

            ```rocq
            Require Import Coq.Arith.Arith.
            ```

            ## Theorem

            ```rocq
            Theorem induction_sum_odd : forall n : nat,
              n > 0 ->
              sum_n (fun k => 2 * k + 1) n = n * n.
            ```

            ## Informal statement

            Show that for positive integer $n$, $\sum_{k=0}^{n-1} (2k + 1) = n^2$.

            ## Informal proof sketch

            We show the result by induction on $n$. The result is trivial for $n=1$. Let us
               assume it is true for $n \geq 1$.
               We have that $\sum_{k=0}^{(n+1)-1} (2k + 1) = \sum_{k=0}^{n-1} (2k + 1) + (2n + 1)$.
               The induction hypothesis tells us that $\sum_{k=0}^{n-1} (2k + 1) = n^2$. So
               $\sum_{k=0}^{(n+1)-1} (2k + 1) = n^2 + 2n +1 = (n+1)^2$ and the result is true for
               $n+1$.
               By induction, we conclude that the result is true for all positive integer $n$.

            Reply with a fenced code block containing only the body of the proof
            (no `Proof.`, no `Qed.`).
        - role: assistant
          answer:
            mode: null
            content: |-
              Induction on `n`; the base case contradicts `n > 0`, the step case
              splits on whether the predecessor is zero, then the induction
              hypothesis plus `nia` closes the arithmetic.
              ```rocq
              intros n Hn.
              induction n as [|n IH].
              - lia.
              - destruct n as [|m].
                + simpl. lia.
                + assert (H : S m > 0) by lia.
                  specialize (IH H).
                  simpl in *. nia.
              ```
        - role: user
          content: |-
            Prove the following theorem in Rocq.

            ## Imports already in scope

            ```rocq
            Require Import Reals.
            Open Scope R_scope.
            ```

            ## Theorem

            ```rocq
            Theorem algebra_binomnegdiscrineq_10alt28asqp1 :
              forall a : R, 10 * a <= 28 * a^2 + 1.
            ```

            ## Informal statement

